# Local observability: OpenTelemetry Collector + Grafana LGTM (ADR-045 plane 1, #418).
#
#   docker compose -f docker-compose.observability.yml up -d
#   open http://localhost:3300          (Grafana, admin/admin)
#
# Runs beside any of the other compose files: the collector tails every
# container on this Docker host through the socket, so nothing in the app
# stack changes. Services that speak OTLP send to localhost:4317 / 4318.
#
# grafana/otel-lgtm is Loki, Tempo, Prometheus and Grafana in one container,
# which is what ADR-045 plans for Azure as well (one app, monolithic mode).
# Its data is in a volume here; on Azure it goes to a bucket.
name: mvhd-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: mvhd-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    # Root, to read the Docker socket and the containers' json-file logs.
    user: "0:0"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "13133:13133" # health
    depends_on:
      - lgtm
    restart: unless-stopped

  lgtm:
    image: grafana/otel-lgtm:0.35.0
    container_name: mvhd-lgtm
    ports:
      - "3300:3000" # Grafana; 3000 is the UI
      # Prometheus remote write, for k6 during a load test (#519). 9090 on the
      # host is the neo4j-proxy.
      - "9091:9090"
    volumes:
      - lgtm_data:/data
      # MVHD dashboards and the audit datasource, as code (ADR-045, #418).
      - ./observability/grafana/provisioning/datasources/mvhd.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/mvhd.yaml:ro
      - ./observability/grafana/provisioning/dashboards/mvhd.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/mvhd.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/mvhd-dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # k6 sends its latency trends as native histograms, so a quantile over
      # several endpoints is exact (#519).
      PROMETHEUS_EXTRA_ARGS: "--enable-feature=native-histograms"
      # Reads the audit trail's JSON endpoints on the neo4j-proxy.
      GF_PLUGINS_PREINSTALL: yesoreyeram-infinity-datasource@4.1.0
      # The proxy as this container reaches it: the compose stack publishes 9090.
      MVHD_AUDIT_URL: ${MVHD_AUDIT_URL:-http://host.docker.internal:9090}
      MVHD_AUDIT_TOKEN: ${MVHD_AUDIT_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  lgtm_data:
