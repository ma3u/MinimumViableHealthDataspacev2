# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^jad/openapi/
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=error"]
        exclude: ^jad/openapi/

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  # Flexible linter/formatter suitable for Markdown, JS, TS, YAML, and JSON.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        exclude: ^jad/openapi/
        additional_dependencies:
          - prettier@3.1.0

  # TypeScript type-checking — catches type errors in source files before commit
  - repo: local
    hooks:
      - id: tsc-ui
        name: TypeScript (UI)
        language: system
        entry: bash -c 'cd ui && npx tsc --noEmit --project tsconfig.build.json'
        files: ^ui/src/.*\.(ts|tsx)$
        pass_filenames: false

  # ESLint — catches type errors and code-quality issues pre-push
  - repo: local
    hooks:
      - id: eslint-ui
        name: ESLint (UI)
        language: system
        entry: bash -c 'cd ui && npx next lint --max-warnings 55'
        files: ^ui/src/.*\.(ts|tsx)$
        pass_filenames: false

  # Unit tests — ensure tests pass before push
  - repo: local
    hooks:
      - id: vitest-ui
        name: Vitest (UI)
        language: system
        entry: bash -c 'cd ui && npx vitest run --bail 1'
        files: ^ui/(src|__tests__)/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [pre-push]

  # Secret scanning — gitleaks on staged diff (BSI C5 DEV-08)
  # A finding fails the commit. The entry used to be `gitleaks ... && ... || echo`,
  # so a finding fell through to the echo and the hook passed (2026-10-03).
  # Catches tokens/passwords before they reach CI or remote.
  # Requires: brew install gitleaks
  - repo: local
    hooks:
      - id: gitleaks
        name: Secret Scan (gitleaks)
        language: system
        entry: 'bash -c ''if ! command -v gitleaks >/dev/null 2>&1; then echo "[WARN] gitleaks not installed, skipping (brew install gitleaks)"; exit 0; fi; gitleaks git --pre-commit --staged --redact --no-banner'''
        pass_filenames: false
        stages: [pre-commit]

  # Static analysis (Semgrep CE): the registry rule sets for TypeScript,
  # Next.js, React and secrets, plus .semgrep/ (request input must reach Cypher
  # as a parameter). Scans the staged files only, a few seconds. CodeQL runs on
  # GitHub for what needs data flow across files. Suppress a finding with
  # `// nosemgrep: <rule-id> -- <reason>` on the line above.
  # Requires: brew install semgrep
  - repo: local
    hooks:
      - id: semgrep
        name: Static analysis (Semgrep)
        language: system
        entry: 'bash -c ''if ! command -v semgrep >/dev/null 2>&1; then echo "[WARN] semgrep not installed, skipping (brew install semgrep)"; exit 0; fi; semgrep scan --metrics=off --quiet --error --config .semgrep/cypher.yml --config p/typescript --config p/nextjs --config p/react --config p/secrets "$@"'' --'
        files: ^(ui/src|services/[^/]+/src|scripts)/.*\.(ts|tsx|js|mjs|sh|py)$
        stages: [pre-commit]
      - id: semgrep-rule-tests
        name: Semgrep rule tests (.semgrep/)
        language: system
        entry: 'bash -c ''if ! command -v semgrep >/dev/null 2>&1; then echo "[WARN] semgrep not installed, skipping (brew install semgrep)"; exit 0; fi; semgrep --metrics=off --test --config .semgrep/cypher.yml .semgrep/cypher.ts'''
        files: ^\.semgrep/
        pass_filenames: false
        stages: [pre-commit]

  # Broken link checker for Markdown files
  # Checks that local links, images, and anchors resolve to real files/paths.
  # Requires: npm i -g markdown-link-check  (or: brew install lychee)
  - repo: local
    hooks:
      - id: check-broken-links-md
        name: Broken links (Markdown)
        language: system
        entry: 'bash -c ''if command -v lychee >/dev/null 2>&1; then lychee --no-progress --offline "$@"; elif command -v markdown-link-check >/dev/null 2>&1; then for f in "$@"; do markdown-link-check --quiet "$f" || exit 1; done; else echo "[WARN] Neither lychee nor markdown-link-check installed"; fi'' --'
        files: \.(md|markdown)$
        stages: [pre-commit]

      - id: check-no-screenshot-imports
        name: No screenshot images in doc pages
        language: system
        entry: 'bash -c ''if grep -rl "images/screenshots" --include="*.tsx" ui/src/app/docs/ 2>/dev/null; then echo "ERROR: Doc pages must not reference screenshot images"; exit 1; fi'''
        files: ^ui/src/app/docs/.*\.tsx$
        pass_filenames: false
        stages: [pre-commit]

  # OpenAPI spec vs implemented routes (#338, Phase 2 of discussion #110).
  # Ratcheted against docs/api-spec-drift-allowlist.txt: the existing backlog
  # is tolerated, a new undocumented route is not.
  - repo: local
    hooks:
      - id: api-spec-drift
        name: API spec covers every route
        language: system
        entry: python3 scripts/check-api-spec-drift.py
        files: ^(ui/src/app/api/.*route\.ts|ui/public/openapi\.yaml|docs/api-spec-drift-allowlist\.txt)$
        pass_filenames: false
        stages: [pre-commit]

      # Covering a route is not the same as describing it correctly. The spec
      # said /api/graph returns `edges` while the hub returned `links`, and
      # the drift check above reported no drift the whole time (#338).
      - id: api-spec-shapes
        name: API spec describes the shape the hub answers with
        language: system
        entry: python3 scripts/check-openapi-shapes.py
        files: ^(ui/public/openapi\.yaml|ui/public/mock/.*\.json|ui/src/lib/api\.ts|docs/openapi-shape-allowlist\.txt)$
        pass_filenames: false
        stages: [pre-commit]

  # The /docs pages read their facts (routes, hooks, services, ADRs, test
  # counts) and each page's last-updated date from docs-facts.json, derived
  # from the code. This refreshes it; when it changes the file the commit
  # fails, like Prettier: stage it and commit again. The PR Gate runs
  # --check, which also refuses a docs page changed without its date.
  - repo: local
    hooks:
      - id: docs-facts
        name: Docs facts and last-updated dates
        language: python
        additional_dependencies: [pyyaml]
        entry: python3 scripts/gen-docs-facts.py
        files: ^(ui/src/app/.*(page|route)\.tsx?|ui/src/app/docs/.*|ui/src/components/Navigation\.tsx|ui/public/openapi\.yaml|ui/__tests__/.*|ui/vitest\.config\.ts|ui/package\.json|services/neo4j-proxy/.*\.test\.ts|\.pre-commit-config\.yaml|docker-compose(\.jad)?\.yml|jad/init-postgres\.sql|docs/ADRs/ADR-.*\.md|scripts/compliance-baseline\.json|scripts/gen-docs-facts\.py|\.github/workflows/(test|compliance|security-scan|pr-gate|deploy-azure)\.yml)$
        pass_filenames: false
        stages: [pre-commit]

  # Bruno collection vs implemented routes (#349, ADR-032). Ratcheted against
  # docs/bruno-coverage-allowlist.txt, and it also refuses a request that
  # carries neither an assert nor a test (ADR-031).
  - repo: local
    hooks:
      - id: bruno-coverage
        name: API collection covers every route, and can fail
        language: system
        entry: python3 scripts/check-bruno-coverage.py
        files: ^(ui/src/app/api/.*route\.ts|bruno/MVHDv2/.*|docs/bruno-coverage-allowlist\.txt)$
        pass_filenames: false
        stages: [pre-commit]

      # A 2xx request that only checks a container type passes when the hub
      # answers with nothing. More than half the collection was in that state
      # when this was added (#375); the allowlist is the ratchet.
      - id: bruno-strength
        name: A successful request cannot pass on an empty answer
        language: system
        entry: python3 scripts/check-bruno-strength.py
        files: ^(bruno/MVHDv2/.*|docs/bruno-soft-assertion-allowlist\.txt)$
        pass_filenames: false
        stages: [pre-commit]

      # A workflow whose paths filter misses a script it runs stops re-running
      # when that script is fixed, and the last, stale, result stands.
      - id: workflow-paths
        name: Workflows re-run when what they run changes
        language: system
        entry: python3 scripts/check-workflow-paths.py .github/workflows/bruno-smoke.yml .github/workflows/catalog-crawler.yml .github/workflows/compliance.yml .github/workflows/demo-smoke.yml .github/workflows/security-scan.yml
        files: ^(\.github/workflows/.*\.ya?ml|scripts/.*|jad/.*|ui/scripts/.*)$
        pass_filenames: false
        stages: [pre-commit]

  # npm dependency audit — HIGH/CRITICAL CVEs on pre-push (BSI C5 DEV-05)
  # Requires: node/npm in PATH. Strict except for the advisories listed, with
  # a reason, an issue and an expiry date, in docs/npm-audit-exceptions.json
  # (#435: an advisory with no patched version blocked every push).
  - repo: local
    hooks:
      - id: npm-audit-ui
        name: npm audit (UI — HIGH+)
        language: system
        entry: python3 scripts/check-npm-audit.py ui --omit=dev
        pass_filenames: false
        stages: [pre-push]

  # GitHub Actions workflow linting.
  # The ignore list suppresses shellcheck style/info codes that the existing
  # workflows use pervasively (SC2129 grouped redirects, SC2086 word splitting
  # in trusted literals, SC2209 literal assignment, SC2034 unused loop var).
  # With those ignored the repo is at zero findings, so this hook is adoptable
  # as a blocking gate without a cleanup backlog — keep it that way.
  # Requires: brew install actionlint
  - repo: local
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        language: system
        entry: bash -c 'if command -v actionlint >/dev/null 2>&1; then actionlint -ignore SC2129 -ignore SC2086 -ignore SC2209 -ignore SC2001 -ignore SC2016 -ignore SC2034 -ignore SC2012 "$@"; else echo "[WARN] actionlint not installed — skipping (brew install actionlint)"; fi' --
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-commit]

      # The CVE scan matrix in security-scan.yml duplicates the compose image
      # list because an Actions matrix cannot read docker-compose.yml. Without
      # this check, bumping an image tag in compose leaves the scan pinned to
      # the old image and still reporting green.
      - id: image-scan-coverage
        name: CVE scan covers every compose image
        language: system
        entry: ./scripts/check-image-scan-coverage.sh
        files: ^(docker-compose.*\.yml|\.github/workflows/security-scan\.yml)$
        pass_filenames: false
        stages: [pre-commit]
