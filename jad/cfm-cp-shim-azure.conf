# =============================================================================
# CFM agent -> EDC control plane Management API shim, Azure edition (#318)
# =============================================================================
# Same job as jad/cfm-cp-shim.conf, different target. The CFM agents pinned for
# this stack have `v5alpha` compiled into controlplane.HttpManagementAPIClient
# and expose only `controlplane.url`, so the version cannot be configured out
# (#181). The local stack runs EDC 0.18 and serves v5beta; the image deployed
# on Azure serves **v4alpha**.
#
# Measured from inside the ACA environment on 2026-09-29 with a provisioner
# token, which is the only way to see it. Without a token every path under
# /api/mgmt answers 401 before routing, so an unauthenticated probe says 401 to
# versions that do not exist and tells you nothing:
#
#   with a valid token        v4alpha  -> answers
#                             v5alpha  -> 404
#                             v5beta   -> 404
#                             vBOGUS   -> 404
#   with no token             all four -> 401
#
# The 404 on a bogus version is what makes the others meaningful: this server
# does route on the version segment, it just does not have the ones the agents
# were built against.
#
# Delete this file and its Container App once CFM is rebuilt against the EDC
# version this control plane runs, and repoint controlplane.url at
# http://mvhd-controlplane:8081/api/mgmt.
# =============================================================================

server {
  listen 8081;

  # Rewrite only the version segment; everything else passes through unchanged.
  #
  # `rewrite ... break` plus a proxy_pass with NO variables and NO URI part is
  # deliberate. A proxy_pass containing a variable makes nginx resolve the
  # upstream per request, which needs a `resolver` directive; without one it
  # accepts the connection and then hangs, which is what the first deployment
  # did: the access log showed the request arriving and a 499 when the client
  # gave up. Variable-free, nginx resolves mvhd-controlplane once at startup.
  location ~ ^/api/mgmt/v5alpha/ {
    rewrite ^/api/mgmt/v5alpha/(.*)$ /api/mgmt/v4alpha/$1 break;
    proxy_pass http://mvhd-controlplane:8081;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_headers on;
  }

  # Anything not version-prefixed goes straight through, so the shim can never
  # hide a path the control plane really does not serve.
  location / {
    proxy_pass http://mvhd-controlplane:8081;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_headers on;
  }
}
