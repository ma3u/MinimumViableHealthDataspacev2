# =============================================================================
# CFM agent -> EDC control plane Management API compatibility shim (issue #181)
# =============================================================================
# EDC 0.18 renamed the Management API segment v5alpha -> v5beta (issue #97
# Phase B). The CFM agents pinned to the working 2026-03-09 build have
# `v5alpha` compiled into controlplane.HttpManagementAPIClient and expose only
# `controlplane.url`, so the version cannot be configured out. Without this
# rewrite every vpa.deploy fails with:
#
#   cannot create participant context in control plane: received status code 404
#
# Delete this file, its compose service, and repoint jad/edcv-agent-config.yaml
# at http://controlplane:8081/api/mgmt once CFM is rebuilt against EDC 0.18.
# =============================================================================

server {
  listen 8081;

  # Rewrite only the version segment; everything else passes through unchanged.
  location ~ ^/api/mgmt/v5alpha/(?<rest>.*)$ {
    proxy_pass http://controlplane:8081/api/mgmt/v5beta/$rest$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_headers on;
  }

  # Anything the agent sends that is not version-prefixed goes straight through,
  # so the shim can never hide a path the control plane really does not serve.
  location / {
    proxy_pass http://controlplane:8081;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_headers on;
  }
}
