# Health Dataspace UI — OrbStack Kubernetes Deployment
#
# Deploys the Next.js UI with Phase 19/20 (role-aware nav + patient portal)
# to the local OrbStack k8s cluster.
#
# Deploy:
#   docker build -t health-dataspace-ui:2.0.0 ./ui
#   kubectl apply -f k8s/health-dataspace-ui.yaml
#
# Access (checked 2026-11-01, #782): OrbStack's Kubernetes has no ingress
# controller, so the Ingress below routes nothing until one is installed.
# Keycloak accepts sign-in redirects to localhost:3000 and :3003 only
# (jad/keycloak-realm.json), so stop the Compose UI and forward :3003:
#   docker stop health-dataspace-ui
#   kubectl -n health-dataspace port-forward svc/health-dataspace-ui 3003:3000
#       → http://localhost:3003, and the journeys and Bruno run against it
#         (NEXTAUTH_SECRET=<the value below> ./scripts/run-api-tests.sh Local)
#   docker start health-dataspace-ui   # afterwards
#
# Neo4j must be reachable from the cluster. The Docker Compose neo4j container
# is accessible from OrbStack k8s pods via host.docker.internal (or the bridge IP).

---
apiVersion: v1
kind: Namespace
metadata:
  name: health-dataspace
  labels:
    app.kubernetes.io/part-of: health-dataspace-v2

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-dataspace-config
  namespace: health-dataspace
data:
  # Neo4j — connect to the Docker Compose instance via OrbStack bridge
  NEO4J_URI: "bolt://host.docker.internal:7687"
  NEO4J_USER: "neo4j"
  # Keycloak — connect to Docker Compose Keycloak if running, else skip auth
  # The realm and client of jad/keycloak-realm.json, as docker-compose.yml.
  KEYCLOAK_ISSUER: "http://host.docker.internal:8080/realms/edcv"
  KEYCLOAK_INTERNAL_URL: "http://host.docker.internal:8080"
  KEYCLOAK_PUBLIC_URL: "http://localhost:8080/realms/edcv"
  KEYCLOAK_CLIENT_ID: "health-dataspace-ui"
  NEXT_PUBLIC_KEYCLOAK_PUBLIC_URL: "http://localhost:8080/realms/edcv"
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "health-dataspace-ui"
  # EDC-V APIs (via host.docker.internal — Docker Compose JAD stack ports)
  EDC_MANAGEMENT_URL: "http://host.docker.internal:11003"
  IDENTITYHUB_URL: "http://host.docker.internal:11005"
  ISSUER_SERVICE_URL: "http://host.docker.internal:10013"
  TENANT_MANAGER_URL: "http://host.docker.internal:11006"
  PROVISION_MANAGER_URL: "http://host.docker.internal:11007"
  NEO4J_PROXY_URL: "http://host.docker.internal:9090"
  NEXTAUTH_URL: "http://localhost:3003"
  NEXT_PUBLIC_STATIC_EXPORT: "false"
  NODE_ENV: "production"
  # Force Next.js standalone to listen on all interfaces.
  # k8s injects HOSTNAME=<pod-name> by default, which Next.js binds to,
  # making port-forwards / NodePorts unable to reach the server.
  HOSTNAME: "0.0.0.0"

---
apiVersion: v1
kind: Secret
metadata:
  name: health-dataspace-secrets
  namespace: health-dataspace
type: Opaque
stringData:
  # The local dev defaults of docker-compose.yml; never for a real deployment.
  NEO4J_PASSWORD: "healthdataspace"
  KEYCLOAK_CLIENT_SECRET: "health-dataspace-ui-secret"
  KEYCLOAK_ACCOUNT_SERVICE_SECRET: "dev-account-service-secret"
  NEXTAUTH_SECRET: "health-dataspace-dev-secret-change-in-prod"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-dataspace-ui
  namespace: health-dataspace
  labels:
    app: health-dataspace-ui
    version: phase20
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-dataspace-ui
  template:
    metadata:
      labels:
        app: health-dataspace-ui
    spec:
      # Pod-level security context (KSV-0118 / BSI C5 DEV-07)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # above 10000 so no host account can collide (trivy KSV-0020); the image's files are world-readable
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          # Production: pin to registry digest, e.g. ghcr.io/ma3u/health-dataspace-ui@sha256:...
          image: health-dataspace-ui:2.0.0 # the version in ui/package.json; build with  docker build -t health-dataspace-ui:2.0.0 ui
          imagePullPolicy: IfNotPresent
          # Container-level security context (KSV-0014 / DS-0002)
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: health-dataspace-config
            - secretRef:
                name: health-dataspace-secrets
          # Writable volumes required when readOnlyRootFilesystem=true
          # Next.js standalone server writes to /tmp and .next/cache
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      # emptyDir volumes to satisfy readOnlyRootFilesystem (KSV-0014)
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: health-dataspace-ui
  namespace: health-dataspace
  labels:
    app: health-dataspace-ui
spec:
  selector:
    app: health-dataspace-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP

---
# NetworkPolicy — deny-all + allow-list (kubescape NSA C-0013/C-0014 / BSI C5 COS-04)
# Production: tighten cidrBlocks to specific ranges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: health-dataspace-ui
  namespace: health-dataspace
spec:
  podSelector:
    matchLabels:
      app: health-dataspace-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP traffic from the ingress controller and port-forward
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Keycloak (OIDC token exchange) — host.docker.internal:8080
    - ports:
        - protocol: TCP
          port: 8080
    # Allow Neo4j (bolt) — host.docker.internal:7687
    - ports:
        - protocol: TCP
          port: 7687
    # Allow Neo4j HTTP API — host.docker.internal:7474
    - ports:
        - protocol: TCP
          port: 7474
    # Allow neo4j-proxy — host.docker.internal:9090
    - ports:
        - protocol: TCP
          port: 9090
    # Allow CFM Tenant/Provision Manager + EDC Management + IdentityHub +
    # IssuerService (Docker Compose JAD stack ports)
    - ports:
        - protocol: TCP
          port: 11003 # EDC controlplane management
        - protocol: TCP
          port: 11005 # IdentityHub
        - protocol: TCP
          port: 11006 # Tenant Manager
        - protocol: TCP
          port: 11007 # Provision Manager
        - protocol: TCP
          port: 10013 # IssuerService

---
# OrbStack Ingress — provides http://health-dataspace.orbstack.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-dataspace-ui
  namespace: health-dataspace
  annotations:
    # OrbStack uses its own ingress controller that handles .orbstack.local domains
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
    - host: health-dataspace.orbstack.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: health-dataspace-ui
                port:
                  number: 3000
