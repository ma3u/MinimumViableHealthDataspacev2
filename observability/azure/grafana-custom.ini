; Grafana settings of mvhd-observability (ADR-045, #418), read as
; conf/custom.ini. The deployment adds only what differs per environment:
; the Keycloak URLs, root_url and the client secret (GF_* variables).

[server]
; Every other address (the app's *.azurecontainerapps.io name) is redirected
; to root_url before sign-in starts: the OAuth state cookie belongs to the
; address the flow began on, and a flow begun on the ACA name and returned to
; grafana.ehds.mabu.red failed with "Provided state does not match stored state".
enforce_domain = true

[dashboards]
; Open on the audit trail, not on an empty "Welcome to Grafana".
default_home_dashboard_path = /otel-lgtm/mvhd-dashboards/ehds-audit-trail.json

[auth.anonymous]
; Never anonymous: the base image would make anonymous visitors Admin.
enabled = false

[auth]
disable_login_form = true

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false

; Sign-in through Keycloak only (realm edcv, client mvhd-grafana). Who gets in
; is the realm role: EDC_ADMIN administers, HDAB_AUTHORITY and
; TRUST_CENTER_OPERATOR read; any other role gets no access at all (strict).
[auth.generic_oauth]
enabled = true
name = Keycloak
client_id = mvhd-grafana
scopes = openid profile email
use_pkce = true
auto_login = true
login_attribute_path = preferred_username
role_attribute_path = contains(roles[*], 'EDC_ADMIN') && 'Admin' || contains(roles[*], 'HDAB_AUTHORITY') && 'Viewer' || contains(roles[*], 'TRUST_CENTER_OPERATOR') && 'Viewer'
role_attribute_strict = true
allow_assign_grafana_admin = false
