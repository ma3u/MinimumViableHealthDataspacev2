# gitleaks configuration for this repository.
#
# The default rule set is kept in full; this file only adds what the default
# misses. Added 2026-09-26 (#349): a forged NextAuth session cookie sat in
# bruno/MVHDv2/environments/Azure-Dev.bru from 2026-05-09 until it was removed,
# and no scan objected. A NextAuth JWE is a five-part compact token whose first
# part decodes to {"alg":"dir","enc":"A256GCM"}, which the generic high-entropy
# rules do not recognise, so it needs a rule of its own.

title = "MinimumViableHealthDataspacev2"

[extend]
useDefault = true

[[rules]]
id = "nextauth-session-jwe"
description = "NextAuth session cookie (JWE, dir + A256GCM)"
# The header of every token ui/scripts/forge-bruno-session.mjs produces, in the
# base64url form it takes in a cookie, followed by the rest of the compact
# serialisation. Sessions are forged per run by scripts/run-api-tests.sh; one
# in a file is a credential someone committed.
regex = '''eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0\.\.[A-Za-z0-9_-]{8,}'''
keywords = ["eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0"]
tags = ["session", "nextauth", "jwe"]

# The generated analyte dictionary (ADR-033, clients/ios) keys every coding by
# its label folded to lowercase letters and digits, `labelKey:
# "systolischerblutdruck24hmittel"`, and the generic-api-key rule reads a long
# one as a credential. They are words from lab sheets, never secrets. Scoped
# to that one file and that one field, so a real key anywhere else, or in any
# other field of the file, is still found.
[[allowlists]]
description = "Normalised analyte labels in the generated dictionary"
condition = "AND"
paths = ['''clients/ios/Sources/Shared/Analytes\.generated\.swift''']
regexTarget = "line"
regexes = ['''labelKey: "[a-z0-9]+"''']

[[allowlists]]
description = "The compose stack's IdentityHub superuser key: a published development default for the local JAD stack only; Azure takes its keys from Vault (ADR-046). Found by scripts/security/scan-repo.sh on 2026-10-15."
paths = ['''jad/issuerservice\.env''']

[[allowlists]]
description = "The AWMF guideline register's public search key, embedded in its own public web page; it grants read access any browser already has. Found by scripts/security/scan-repo.sh on 2026-10-15."
paths = ['''scripts/leitlinien/fetch_index\.py''']
regexes = ['''AWMF_PUBLIC_API_KEY''']

# The German wallet backend overlay (#182) supplies the OpenAPI example
# constants the upstream mirror references but never declares. Each is a
# placeholder: a JWT whose payload is `{}` and whose signature is the word
# PLACEHOLDER, or the base64 of "PLACEHOLDER-...". Scoped to those files and to
# exactly those two shapes, so a real token in an example is still found.
[[allowlists]]
description = "Placeholder OpenAPI examples in the wallet backend overlay"
condition = "AND"
paths = ['''services/eudi-wallet-backend/overlay/src/main/kotlin/.*/ApiDocsStubs\.kt''']
regexTarget = "line"
regexes = ['''_EXAMPLE = "(eyJ[A-Za-z0-9_-]+\.e30\.PLACEHOLDER|UExBQ0VIT0xERVI[A-Za-z0-9]*)"''']
