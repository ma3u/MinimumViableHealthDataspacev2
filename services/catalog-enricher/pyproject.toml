[project]
name = "catalog-enricher"
version = "0.1.0"
description = "Consumes raw DSP catalog JSON-LD from NATS and upserts HealthDCAT-AP nodes into Neo4j"
requires-python = ">=3.12"
dependencies = [
  "nats-py==2.16.0",
  "neo4j==6.3.1",
  "pydantic==2.13.5",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
