# ---------------------------------------------------------------------------
# Protocol Compliance — Health Dataspace v2
# ---------------------------------------------------------------------------
# Runs DSP 2025-1 TCK, DCP v1.0, and EHDS domain compliance tests.
#
# Triggers:
#   - Push to main
#   - Weekly Monday 6am UTC
#   - Manual dispatch
# ---------------------------------------------------------------------------
name: Protocol Compliance

on:
  push:
    branches: [main]
    # Keep this covering everything the suites actually run.
    # scripts/check-workflow-paths.py asserts it, in pre-commit: it follows
    # every script reference from this file, transitively, and fails when one
    # of them would not re-trigger the workflow. The filter used to name only
    # scripts/run-*.sh, so a push to main fixing a seed script left the last,
    # red, result standing.
    paths:
      - "scripts/*.sh"
      - "scripts/*.py"
      - "scripts/lib/**"
      - "scripts/compliance-baseline.json"
      - "scripts/azure/env.sh"
      - "scripts/azure/05-cp-participants.sh"
      - "scripts/azure/compliance-runner/**"
      - "scripts/azure/08-compliance-runner.sh"
      - "ui/scripts/forge-bruno-session.mjs"
      - "bruno/MVHDv2/**"
      # The collection's subject, #371. This workflow is the only place the
      # full 149-request Local run happens; bruno-smoke runs the 30 fixture
      # requests of Static-mock. Without these, an API route change regresses
      # the suite and nothing re-runs it, so the last result stands. They are
      # what the collection exercises, not something this workflow executes,
      # which is why check-workflow-paths.py cannot derive them.
      - "ui/src/app/api/**"
      - "ui/src/lib/**"
      - "ui/Dockerfile"
      - "jad/**"
      - "neo4j/**"
      - "docker-compose.jad.yml"
      - ".github/workflows/compliance.yml"
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Run suites against local JAD stack or the Azure demo env"
        required: true
        default: local
        type: choice
        options:
          - local
          - azure

# id-token for azure/login's OIDC flow, used by the compliance-azure job.
permissions:
  id-token: write
  contents: read

env:
  REPORT_DIR: test-results

jobs:
  # -----------------------------------------------------------------------
  # Image platforms (#380)
  # -----------------------------------------------------------------------
  # The CI stack started `tenant-manager` from an image with only a
  # linux/arm64 manifest. Docker printed the mismatch and said "Started"
  # anyway; the container never served, and the suite stayed green because
  # /api/admin/tenants backfills from Neo4j when CFM is unreachable. CFM has
  # therefore never run here, and nothing said so.
  #
  # This asks the registries what platforms each compose image really has, in
  # a few seconds and without pulling anything. It does not fail the run: the
  # DSP and DCP suites do not need CFM, and blocking every compliance run on
  # an upstream image nobody in this repository builds would trade one silent
  # state for a stuck one. It annotates instead, so the state is on the run
  # rather than in someone's memory.
  image-platforms:
    name: Image platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ask each registry which platforms it serves
        run: |
          set +e
          python3 scripts/check-image-platforms.py \
            docker-compose.yml docker-compose.jad.yml > platforms.txt 2> platforms.err
          code=$?
          cat platforms.txt
          cat platforms.err >&2

          {
            echo "### Compose image platforms"
            echo ""
            echo '```'
            cat platforms.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$code" in
            0) echo "every compose image serves linux/amd64" ;;
            1)
              while read -r ref; do
                echo "::warning title=Image cannot run on this runner::${ref} has no linux/amd64 manifest. Compose will report it Started and it will never serve (#380)."
              done < <(grep -oE 'ghcr\.io/[^ ]+|[a-z0-9._/-]+@sha256:[a-f0-9]{64}' platforms.err | sort -u)
              echo "::warning title=CFM is not exercised here::The CFM images are linux/arm64 only, so the Tenant Manager does not serve on this runner and /api/admin/tenants answers from the Neo4j backfill (#380)."
              ;;
            *)
              echo "::warning title=Image platforms unverified::A registry could not be asked, so this run proves nothing about image platforms."
              ;;
          esac

  # -----------------------------------------------------------------------
  # DSP 2025-1 Technology Compatibility Kit
  # -----------------------------------------------------------------------
  dsp-tck:
    name: DSP 2025-1 TCK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'local'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start JAD infrastructure
        run: |
          docker compose -f docker-compose.jad.yml up -d --timeout 120
        continue-on-error: true
        env:
          COMPOSE_PROJECT_NAME: health-dataspace

      - name: Wait for services
        run: |
          # Probe the Management API, which is what the suite actually needs.
          # The old probe called /api/check/readiness on 11003, but 11003 maps
          # to the container's 8081, which serves /api/mgmt; the health context
          # is on 8080 and docker-compose does not publish it. So the probe
          # could only ever 404, and every run waited the full five minutes and
          # then said "proceeding anyway" — including runs where the stack was
          # healthy in 26 seconds. Same family as #307.
          #
          # 401 counts as ready: it means the API is listening and asking for a
          # token, which is all this needs to know.
          echo "Waiting for the Control Plane Management API..."
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              http://localhost:11003/api/mgmt/v5beta/participants 2>/dev/null || echo 000)
            if [ "$CODE" != "000" ]; then
              echo "Control Plane Management API answering (HTTP $CODE, attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Control Plane Management API silent after 5 min — proceeding anyway"
            fi
            sleep 5
          done

      # The ephemeral stack comes up empty: this workflow starts it with
      # `docker compose up -d` and never runs jad/seed-all.sh, so the control
      # plane has no participant contexts and every participant-scoped check
      # ends at "Missing required participant contexts" (#316). The suites have
      # said so out loud since #314; before that they said nothing at all.
      #
      # Seeding the contexts directly through the Management API is enough for
      # the suites, and far cheaper than the full seven-phase JAD seed, which
      # wants 8 GB of Docker and does not fit a standard runner.
      #
      # provisioner, not admin: the two clients carry the same six scopes and
      # differ only in a `role` claim, and the control plane refuses a
      # participant-context create from `admin` with HTTP 403 "Required user
      # role not satisfied". Measured on the live control plane, #316.
      #
      # Hard-fails since #349: this has been seen to work, and a seed that
      # silently does nothing is exactly what #316 is about. If it breaks, the
      # run should stop here rather than let the suites report a number that
      # measures the seeding instead of the platform.
      - name: Seed participant contexts on the control plane (#316)
        run: |
          TOKEN=$(curl -sS --max-time 20 -X POST \
            "http://localhost:8080/realms/edcv/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=provisioner&client_secret=provisioner-secret" \
            2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))" \
            2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            echo "::warning::No Keycloak token, so the participant contexts cannot be seeded. The suites will report an empty control plane (#316)."
            exit 1
          fi
          CP=http://localhost:11003/api/mgmt TOKEN="$TOKEN" \
            bash scripts/azure/05-cp-participants.sh

      - name: Run DSP TCK
        run: |
          chmod +x scripts/run-ehds-dataspace-checks.sh
          REPORT_DIR=${{ env.REPORT_DIR }}/dsp-tck \
          KEYCLOAK_URL=http://localhost:8080 \
          EDC_MANAGEMENT_URL=http://localhost:11003/api/mgmt \
            ./scripts/run-ehds-dataspace-checks.sh
        continue-on-error: true

      - name: Upload TCK results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsp-tck-results
          path: test-results/dsp-tck/
          retention-days: 30

      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.jad.yml down -v

  # -----------------------------------------------------------------------
  # DCP v1.0 Compliance
  # -----------------------------------------------------------------------
  dcp-compliance:
    name: DCP v1.0 Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'local'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start JAD infrastructure
        run: |
          docker compose -f docker-compose.jad.yml up -d --timeout 120
        continue-on-error: true
        env:
          COMPOSE_PROJECT_NAME: health-dataspace

      - name: Wait for services
        run: |
          echo "Waiting for IdentityHub..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:11005/api/identity >/dev/null 2>&1; then
              echo "IdentityHub ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "IdentityHub not ready after 5 min — proceeding anyway"
            fi
            sleep 5
          done

      # The ephemeral stack comes up empty: this workflow starts it with
      # `docker compose up -d` and never runs jad/seed-all.sh, so the control
      # plane has no participant contexts and every participant-scoped check
      # ends at "Missing required participant contexts" (#316). The suites have
      # said so out loud since #314; before that they said nothing at all.
      #
      # Seeding the contexts directly through the Management API is enough for
      # the suites, and far cheaper than the full seven-phase JAD seed, which
      # wants 8 GB of Docker and does not fit a standard runner.
      #
      # provisioner, not admin: the two clients carry the same six scopes and
      # differ only in a `role` claim, and the control plane refuses a
      # participant-context create from `admin` with HTTP 403 "Required user
      # role not satisfied". Measured on the live control plane, #316.
      #
      # Hard-fails since #349: this has been seen to work, and a seed that
      # silently does nothing is exactly what #316 is about. If it breaks, the
      # run should stop here rather than let the suites report a number that
      # measures the seeding instead of the platform.
      - name: Seed participant contexts on the control plane (#316)
        run: |
          TOKEN=$(curl -sS --max-time 20 -X POST \
            "http://localhost:8080/realms/edcv/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=provisioner&client_secret=provisioner-secret" \
            2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))" \
            2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            echo "::warning::No Keycloak token, so the participant contexts cannot be seeded. The suites will report an empty control plane (#316)."
            exit 1
          fi
          CP=http://localhost:11003/api/mgmt TOKEN="$TOKEN" \
            bash scripts/azure/05-cp-participants.sh

      # #345. The control-plane seed above populates participant CONTEXTS on
      # the connector; IdentityHub is a different store and has always been
      # empty here. Locally it is filled by jad/seed-health-tenants.sh via the
      # CFM TenantManager, which does not fit a standard runner, so this talks
      # to the Identity API directly.
      #
      # Not continue-on-error. Before #341 an empty IdentityHub scored 14
      # passed / 0 failed, so a silent seeding failure is exactly the thing
      # that hid this for months. If the seed cannot run, the job should say
      # so here rather than three suites later.
      - name: Seed IdentityHub participants (#345)
        run: |
          KEYCLOAK_URL=http://localhost:8080 \
          EDC_IDENTITY_URL=http://localhost:11005/api/identity \
            ./scripts/seed-identityhub-participants.sh

      # #345. CI's IssuerService has never had an identity: no participant
      # context, no signing key loaded, no DID. Locally bootstrap-jad.sh gives it
      # one (vault-bootstrap sidecar, jad-seed Step 2, seed-issuer-identity.sql
      # plus a restart); jad-seed cannot run here because it waits for CFM.
      # This reproduces those pieces and reads the DID document back. Every
      # issuer seed below depends on it, and the 401/404 pair the first runs
      # produced was this missing.
      - name: Give the issuer its identity (#345)
        run: |
          KEYCLOAK_URL=http://localhost:8080 \
            ./scripts/seed-issuer-identity.sh

      # #345. Asserts the property the issuer seeds need, "a token this client
      # obtains is accepted by the issuer admin API", and on timeout prints the
      # answer body plus token kid vs JWKS kids. The first run after the realm
      # fix got 401 for the `issuer` client while `admin` was accepted on the
      # same stack: the issuer's own participant context did not exist yet, so
      # the token's participant_context_id=issuer pointed at nothing. That is
      # what the step above creates. continue-on-error so the suite still runs
      # and ISS-4.3 stays the assertion; the diagnostic is what this is for.
      - name: Wait until the issuer accepts Keycloak tokens (#345)
        run: |
          KC_HOST=http://localhost:8080 \
          ISSUER_API=http://localhost:10013 \
          TIMEOUT=120 \
            bash scripts/lib/wait-for-issuer-auth.sh

      # ISS-4.3 asserts the issuer defines an EHDS credential type. This seed
      # needs only Keycloak and the IssuerService, no CFM. The `issuer` client
      # #345. The issuer only issues to a DID in its holders registry; CFM
      # registers them locally, nothing did here. Mirrors the same control-plane
      # participants the IdentityHub seed used, so all three stores agree.
      - name: Register participants as holders on the issuer (#345)
        run: |
          KEYCLOAK_URL=http://localhost:8080 \
          EDC_ISSUER_URL=http://localhost:10013/api/admin \
          EDC_MANAGEMENT_URL=http://localhost:11003/api/mgmt \
            ./scripts/seed-issuer-holders.sh

      # #345. The first run after the realm fix got a token and then 401 on
      # every write: the issuer had cached JWKS from a Keycloak still importing
      # the realm. A health endpoint cannot see that, so this asserts the
      # property the seeds need, and on timeout prints token kid vs JWKS kids.
      # continue-on-error so the suite still runs and ISS-4.3 stays the
      # it logs in as arrives with the realm import since #345.
      - name: Seed issuer credential definitions (#345)
        run: |
          KC_HOST=http://localhost:8080 \
          ISSUER_API=http://localhost:10013 \
            bash jad/seed-issuer-defs.sh

      # #345. VC-3.2/3.3 want credentials on the participants. The issuer does
      # not issue on admin command; a credential arrives when the holder's
      # IdentityHub requests it over DCP. So this asks, then waits for it to
      # land, and prints the hub's errorDetail if it gives up. First place CI
      # exercises DCP as a protocol between two services. continue-on-error on
      # Hard-fails since #349; it has been seen to work.
      - name: Request participant credentials over DCP (#345)
        run: |
          KEYCLOAK_URL=http://localhost:8080 \
          EDC_IDENTITY_URL=http://localhost:11005/api/identity \
          EDC_MANAGEMENT_URL=http://localhost:11003/api/mgmt \
          WAIT_SECONDS=120 \
            ./scripts/request-participant-credentials.sh

      - name: Run DCP compliance suite
        run: |
          chmod +x scripts/run-ehds-identity-checks.sh
          REPORT_DIR=${{ env.REPORT_DIR }}/dcp \
          KEYCLOAK_URL=http://localhost:8080 \
          EDC_IDENTITY_URL=http://localhost:11005/api/identity \
          EDC_ISSUER_URL=http://localhost:10013/api/admin \
          EDC_MANAGEMENT_URL=http://localhost:11003/api/mgmt \
            ./scripts/run-ehds-identity-checks.sh
        continue-on-error: true

      - name: Upload DCP results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcp-compliance-results
          path: test-results/dcp/
          retention-days: 30

      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.jad.yml down -v

  # -----------------------------------------------------------------------
  # EHDS Health Domain
  # -----------------------------------------------------------------------
  ehds-compliance:
    name: EHDS Health Domain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'local'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start full stack (JAD + Neo4j)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.jad.yml up -d --timeout 120
        continue-on-error: true
        env:
          COMPOSE_PROJECT_NAME: health-dataspace

      - name: Wait for Neo4j
        run: |
          echo "Waiting for Neo4j..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7474 >/dev/null 2>&1; then
              echo "Neo4j ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Neo4j not ready after 5 min — proceeding anyway"
            fi
            sleep 5
          done

      - name: Initialize Neo4j schema
        run: |
          # Redirect rather than `cat |`: CI's actionlint runs shellcheck at a
          # stricter level than a local one and fails the gate on SC2002.
          docker exec -i health-dataspace-neo4j \
            cypher-shell -u neo4j -p healthdataspace \
            < neo4j/init-schema.cypher || true

      # #345. The schema step creates constraints and indexes and no data, so
      # every EHDS domain check that asks Neo4j for an HDABApproval, a
      # HealthDataset or an EEHRxF profile found nothing: 13 failures, one
      # cause. docs/developer-guide.md's quick start seeds a minimal stack with
      # init-schema.cypher and then insert-synthetic-schema-data.cypher, so CI
      # now seeds what the documentation says a minimal stack has, plus the
      # EEHRxF profiles the EEHR-3.x rows need, plus seed-compliance-matrix,
      # which adds the GRANTS_ACCESS_TO edge the synthetic set leaves out and
      # ART53-1.4's full access chain needs. All three are MERGE-only;
      # verified on a fresh neo4j:5.26.28: 141 nodes, and 141 again after a
      # second run. The count read-back is the assertion (ADR-031): a seed
      # that ran is not a seed that seeded.
      #
      # Hard-fails since #349: the seed has been seen to work, and its count
      # read-back is the assertion.
      - name: Seed Neo4j with the documented minimal data set (#345)
        run: |
          set -euo pipefail
          for f in neo4j/insert-synthetic-schema-data.cypher neo4j/register-eehrxf-profiles.cypher neo4j/seed-compliance-matrix.cypher neo4j/seed-persona-overview.cypher; do
            echo "== $f"
            docker exec -i health-dataspace-neo4j \
              cypher-shell -u neo4j -p healthdataspace < "$f"
          done
          counts=$(docker exec -i health-dataspace-neo4j \
            cypher-shell -u neo4j -p healthdataspace --format plain \
            "MATCH (n) WITH count(n) AS total
             OPTIONAL MATCH (a:HDABApproval) WITH total, count(a) AS approvals
             OPTIONAL MATCH (d:HealthDataset) WITH total, approvals, count(d) AS datasets
             OPTIONAL MATCH (e:EEHRxFProfile) WITH total, approvals, datasets, count(e) AS profiles
             OPTIONAL MATCH (o:OMOPPerson)
             RETURN total, approvals, datasets, profiles, count(o) AS omop" | tail -1 | tr -d '"')
          echo "nodes total, HDABApproval, HealthDataset, EEHRxFProfile, OMOPPerson = ${counts}"
          IFS=', ' read -r total approvals datasets profiles omop <<<"${counts}"
          if [ "${approvals:-0}" -eq 0 ] || [ "${datasets:-0}" -eq 0 ] || [ "${profiles:-0}" -eq 0 ]; then
            echo "::error::Neo4j seed ran but the graph lacks approvals, datasets or EEHRxF profiles (#345)"
            exit 1
          fi

      # The ephemeral stack comes up empty: this workflow starts it with
      # `docker compose up -d` and never runs jad/seed-all.sh, so the control
      # plane has no participant contexts and every participant-scoped check
      # ends at "Missing required participant contexts" (#316). The suites have
      # said so out loud since #314; before that they said nothing at all.
      #
      # Seeding the contexts directly through the Management API is enough for
      # the suites, and far cheaper than the full seven-phase JAD seed, which
      # wants 8 GB of Docker and does not fit a standard runner.
      #
      # provisioner, not admin: the two clients carry the same six scopes and
      # differ only in a `role` claim, and the control plane refuses a
      # participant-context create from `admin` with HTTP 403 "Required user
      # role not satisfied". Measured on the live control plane, #316.
      #
      # Hard-fails since #349: this has been seen to work, and a seed that
      # silently does nothing is exactly what #316 is about. If it breaks, the
      # run should stop here rather than let the suites report a number that
      # measures the seeding instead of the platform.
      - name: Seed participant contexts on the control plane (#316)
        run: |
          TOKEN=$(curl -sS --max-time 20 -X POST \
            "http://localhost:8080/realms/edcv/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=provisioner&client_secret=provisioner-secret" \
            2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))" \
            2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            echo "::warning::No Keycloak token, so the participant contexts cannot be seeded. The suites will report an empty control plane (#316)."
            exit 1
          fi
          CP=http://localhost:11003/api/mgmt TOKEN="$TOKEN" \
            bash scripts/azure/05-cp-participants.sh

      - name: Run EHDS compliance tests
        run: |
          chmod +x scripts/run-ehds-tests.sh
          REPORT_DIR=${{ env.REPORT_DIR }}/ehds \
          NEO4J_URL=http://localhost:7474 \
          KEYCLOAK_URL=http://localhost:8080 \
          EDC_MANAGEMENT_URL=http://localhost:11003/api/mgmt \
            ./scripts/run-ehds-tests.sh
        continue-on-error: true

      - name: Upload EHDS results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ehds-compliance-results
          path: test-results/ehds/
          retention-days: 30

      - name: Stop infrastructure
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.jad.yml down -v

  # -----------------------------------------------------------------------
  # Bruno API collection — the persona-organised collection a partner uses to
  # rehearse against this hub (ADR-032, #349). It runs against the same
  # ephemeral stack as the other suites, with one forged NextAuth session per
  # EHDS persona, and writes a result file the baseline gate reads.
  # -----------------------------------------------------------------------
  bruno-api:
    name: EHDS API Collection (Bruno)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'local'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # next-auth, for ui/scripts/forge-bruno-session.mjs.
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Start full stack (JAD + Neo4j + UI)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.jad.yml up -d --timeout 120
        continue-on-error: true
        env:
          COMPOSE_PROJECT_NAME: health-dataspace

      - name: Wait for Neo4j and the hub
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:7474 >/dev/null 2>&1 && break
            [ "$i" -eq 60 ] && echo "Neo4j not ready after 5 min, proceeding"
            sleep 5
          done
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health >/dev/null 2>&1 && break
            [ "$i" -eq 60 ] && echo "the hub did not answer /api/health after 5 min, proceeding"
            sleep 5
          done
          # The proxy was missing from this list until 2026-09-28, and thirteen
          # requests depend on it: the whole 11 Platform folder plus every UI
          # route that forwards to port 9090. Run 36418922439 scored 138/13
          # against a commit whose re-run scored 149/2, because the proxy had
          # not started accepting connections yet. It logged a clean build and
          # a clean start, so the failure looked like a mass regression in the
          # hub rather than a race. Waiting costs nothing when it is already up.
          for i in $(seq 1 60); do
            curl -sf http://localhost:9090/health >/dev/null 2>&1 && break
            [ "$i" -eq 60 ] && echo "the neo4j-proxy did not answer /health after 5 min, proceeding"
            sleep 5
          done

      - name: Seed Neo4j with the documented minimal data set
        run: |
          set -euo pipefail
          docker exec -i health-dataspace-neo4j \
            cypher-shell -u neo4j -p healthdataspace < neo4j/init-schema.cypher || true
          # seed-persona-overview.cypher carries patient P1 (Maria Schmidt) with
          # her conditions and medications. Without it every request in the
          # collection's Patient folder answered 404 on CI while passing locally,
          # because only a fully seeded laptop had her (#349).
          for f in neo4j/insert-synthetic-schema-data.cypher \
                   neo4j/register-eehrxf-profiles.cypher \
                   neo4j/seed-compliance-matrix.cypher \
                   neo4j/participant-source-init.cypher \
                   neo4j/seed-persona-overview.cypher; do
            echo "== $f"
            docker exec -i health-dataspace-neo4j \
              cypher-shell -u neo4j -p healthdataspace < "$f"
          done

      # Folder "10 Connecting partner" speaks to the EDC layer, which is empty
      # on a fresh stack until the seven identity steps have run (#345).
      - name: Seed the identity layer (#345)
        run: |
          KEYCLOAK_URL=http://localhost:8080 \
          EDC_MANAGEMENT_URL=http://localhost:11003/api/mgmt \
          EDC_IDENTITY_URL=http://localhost:11005/api/identity \
          EDC_ISSUER_URL=http://localhost:10013/api/admin \
            bash scripts/seed-identity-layer.sh

      # The suite step reports either way; the baseline gate in compliance-report
      # is the assertion (ADR-031).
      - name: Run the Bruno API collection
        continue-on-error: true
        run: |
          BRUNO_REPORT_DIR=${{ env.REPORT_DIR }}/bruno \
          BRUNO_UI_CONTAINER=health-dataspace-ui \
            ./scripts/run-api-tests.sh Local

      - name: Upload Bruno results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bruno-api-results
          path: test-results/bruno/
          retention-days: 30

      - name: Stop infrastructure
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.jad.yml down -v

  # -----------------------------------------------------------------------
  # Azure Demo — launches the in-cluster mvhd-compliance-runner ACA Job
  # (built by scripts/azure/08-compliance-runner.sh) and tails logs until
  # it finishes. Authenticates with OIDC, whose federated credential is bound
  # to the main branch — a dispatch from a topic branch will not get a token.
  # -----------------------------------------------------------------------
  compliance-azure:
    name: Azure Demo Compliance (ACA Job)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'azure'
    env:
      RG: rg-mvhd-dev
      COMPLIANCE_JOB: mvhd-compliance-runner
    steps:
      - uses: actions/checkout@v4
      # OIDC, as every other Azure workflow here does. This was the last
      # `creds: AZURE_CREDENTIALS` in the repository and that secret no longer
      # exists, so the job died on "Not all values are present. Ensure
      # 'client-id' and 'tenant-id' are supplied" before reaching Azure.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - name: Build + deploy + start runner job
        run: |
          chmod +x scripts/azure/08-compliance-runner.sh
          ./scripts/azure/08-compliance-runner.sh
      - name: Wait for job execution
        run: |
          set -e
          for i in $(seq 1 60); do
            latest=$(az containerapp job execution list \
              --name "$COMPLIANCE_JOB" --resource-group "$RG" \
              --query "[0]" -o json)
            status=$(echo "$latest" | jq -r '.properties.status // "Unknown"')
            name=$(echo "$latest" | jq -r '.name // "-"')
            echo "[$i] $name: $status"
            case "$status" in
              Succeeded) echo "runner finished successfully"; exit 0 ;;
              Failed)    echo "runner failed — check logs in Azure portal"; exit 1 ;;
            esac
            sleep 20
          done
          echo "timeout waiting for runner"
          exit 1

  # -----------------------------------------------------------------------
  # Aggregate Results
  # -----------------------------------------------------------------------
  compliance-report:
    name: Compliance Report
    runs-on: ubuntu-latest
    needs: [dsp-tck, dcp-compliance, ehds-compliance, bruno-api]
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.target == 'local')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Generate compliance summary
        run: |
          echo "# Compliance Report — $(date -u +%Y-%m-%d)" > compliance-report.md
          echo "" >> compliance-report.md
          echo "| Suite | Status |" >> compliance-report.md
          echo "| ----- | ------ |" >> compliance-report.md

          for suite in dsp-tck-results dcp-compliance-results ehds-compliance-results bruno-api-results; do
            if [ -d "test-results/${suite}" ]; then
              latest=$(ls -t test-results/${suite}/*.json 2>/dev/null | head -1) || true
              if [ -n "$latest" ]; then
                passed=$(jq '.summary.passed // 0' "$latest")
                failed=$(jq '.summary.failed // 0' "$latest")
                total=$(jq '.summary.total // 0' "$latest")
                status="✅ ${passed}/${total} passed"
                if [ "$failed" -gt 0 ]; then
                  status="❌ ${failed} failed / ${total} total"
                fi
              else
                status="⚠️ No results"
              fi
            else
              status="⏭️ Not run"
            fi
            echo "| ${suite} | ${status} |" >> compliance-report.md
          done

          cat compliance-report.md

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report.md
          retention-days: 90

      # Phase 0 of #338. Every suite step above is continue-on-error, so until
      # now a green run meant only that the workflow finished. This step is the
      # one that can say no.
      #
      # It gates on a recorded baseline rather than on green. The suites do not
      # pass today, so gating on green would block every merge until an
      # unbounded remediation finishes; gating on nothing is where we came in.
      # A suite that scores worse than it did fails the build. A suite with no
      # recorded baseline is reported and not failed, so the first run records
      # real numbers instead of a guess.
      #
      # Deliberately last: the report artifact uploads first, so a red build
      # still leaves the evidence behind.
      - name: Compliance baseline (blocking)
        run: |
          set -euo pipefail
          python3 scripts/check-compliance-baseline.py --results test-results \
            | tee -a "$GITHUB_STEP_SUMMARY"
