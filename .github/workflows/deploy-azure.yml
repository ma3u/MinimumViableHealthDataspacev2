name: Deploy to Azure Container Apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Concurrency is per job, not per workflow. A workflow-wide group made each
# deploy wait for the previous run's E2E job (about 19 minutes against the
# live site), although that run's site had been live for 15 of them. Deploys
# still run one at a time and in order; an E2E run is cancelled when a newer
# deploy brings its own, since it would only be testing a version that is
# already gone.
env:
  ACR_NAME: acrmvhdehds
  ACR_LOGIN_SERVER: acrmvhdehds.azurecr.io
  RESOURCE_GROUP: rg-mvhd-dev
  ACA_ENV: mvhd-env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.auth.outputs.live }}
    concurrency:
      group: "azure-deploy"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      # The default "docker" driver cannot export a build cache; this builder
      # can. The cache lives in ACR as a :buildcache tag per image, so the
      # npm ci layer is reused whenever package-lock.json has not changed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Build custom images (amd64) ──────────────────────────
      # BUILD_CHANNEL=release so the Azure demo never shows "+local" in the
      # build-info badge. BUILD_SHA + BUILD_TIME feed the commit link.
      - name: Build & push UI image
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg BUILD_CHANNEL=release \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t ${{ env.ACR_LOGIN_SERVER }}/mvhd-ui:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/mvhd-ui:latest \
            --cache-from type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/mvhd-ui:buildcache \
            --cache-to type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/mvhd-ui:buildcache,mode=max \
            --push ./ui

      - name: Build & push Neo4j Proxy image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ env.ACR_LOGIN_SERVER }}/mvhd-neo4j-proxy:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/mvhd-neo4j-proxy:latest \
            --cache-from type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/mvhd-neo4j-proxy:buildcache \
            --cache-to type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/mvhd-neo4j-proxy:buildcache,mode=max \
            --push ./services/neo4j-proxy

      # ── Deploy to Azure Container Apps ───────────────────────
      # DEPLOYMENT_TARGET=azure flips /api/admin/components to render
      # the Azure Container Apps cost estimator instead of the StackIT
      # one. Without it, the Azure demo incorrectly shows the STACKIT
      # panel (see issue #17).
      - name: Deploy UI
        run: |
          az containerapp update \
            --name mvhd-ui \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/mvhd-ui:${{ github.sha }} \
            --set-env-vars \
              "DEPLOYMENT_TARGET=azure" \
              "EUDI_VERIFIER_BASE_URL=https://verifier-backend.eudiw.dev" \
              "EUDI_VERIFIER_SCHEME=openid4vp://" \
              "EUDI_VERIFIER_PROFILE=openid4vp" \
              "EUDI_PID_DOCTYPE=eu.europa.ec.eudi.pid.1" \
              "EUDI_REQUEST_URI_METHOD=get" \
              "EUDI_RESPONSE_MODE=direct_post" \
              "AUDIT_CALLBACK_URL=http://mvhd-neo4j-proxy/audit/dsp" \
              "CFM_DID_BASE=did:web:mvhd-identityhub%3A7083"

      - name: Deploy Neo4j Proxy
        run: |
          az containerapp update \
            --name mvhd-neo4j-proxy \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/mvhd-neo4j-proxy:${{ github.sha }}

      # The off-hours jobs download scripts/azure/offhours.sh and the scripts
      # it calls at REPO_REF (ADR-058, #595), so they run the code just
      # deployed. Before 18-offhours-jobs.sh has created them there is nothing
      # to point, and the deploy goes on.
      - name: Point the off-hours jobs at this commit
        run: |
          if az containerapp job show -n mvhd-offhours-stop -g ${{ env.RESOURCE_GROUP }} -o none 2>/dev/null; then
            for job in mvhd-offhours-stop mvhd-offhours-start mvhd-offhours-check; do
              az containerapp job update -n "$job" -g ${{ env.RESOURCE_GROUP }} \
                --set-env-vars "REPO_REF=${{ github.sha }}" -o none ||
                echo "::warning::could not point $job at ${{ github.sha }}"
            done
            echo "off-hours jobs run ${GITHUB_SHA:0:7}"
          else
            echo "::warning::the off-hours jobs do not exist yet (scripts/azure/18-offhours-jobs.sh, ADR-058)"
          fi

      - name: Verify deployments
        id: verify
        run: |
          echo "=== Deployment Status ==="
          for app in mvhd-ui mvhd-neo4j-proxy; do
            status=$(az containerapp show --name $app --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.runningStatus" -o tsv 2>/dev/null || echo "unknown")
            fqdn=$(az containerapp show --name $app --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "n/a")
            echo "$app: status=$status fqdn=$fqdn"
          done
          UI_FQDN=$(az containerapp show --name mvhd-ui --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "ui_url=https://${UI_FQDN}" >> "$GITHUB_OUTPUT"

      # ── Wait for new revision to be healthy ──────────────────
      - name: Wait for UI to respond
        run: |
          echo "Waiting for ${{ steps.verify.outputs.ui_url }} ..."
          for i in $(seq 1 30); do
            code=$(curl -sf -o /dev/null -w "%{http_code}" "${{ steps.verify.outputs.ui_url }}" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "UI is healthy (HTTP 200)"
              exit 0
            fi
            echo "  attempt $i: HTTP $code"
            sleep 10
          done
          echo "::warning::UI did not return 200 within 5 minutes"

      # The home page returning 200 is not the same as the deployment working.
      # On 2026-09-30 this job was green, and so was "E2E Tests (Azure)", over
      # a stack where every sign-in had been returning 500 for an hour: the
      # home page renders for an anonymous visitor, and all three E2E steps
      # below carry continue-on-error, so the job reports success whatever the
      # tests do. That is the shape ADR-031 exists to prevent.
      #
      # This step carries no continue-on-error on purpose. It asks the one
      # question the others do not: can anybody actually log in. Exit 2 means
      # Keycloak is up but its database is gone, which is a Postgres problem
      # and not a realm one (docs/gotchas.md, 2026-09-30).
      #
      # Exit 4 means Keycloak's Container App is stopped. That passes only
      # when the UI says the demo is offline outside office hours (ADR-053),
      # as Demo Smoke reads it: then there is no login to test, and the E2E
      # job skips. A stopped Keycloak behind a UI that claims to be up is
      # still red (2026-10-04: every weekend deploy failed on "realm 'edcv'
      # does not exist" while the realm was intact).
      - name: Auth is actually working
        id: auth
        env:
          KEYCLOAK_PUBLIC_URL: https://auth.ehds.mabu.red
          DEMO_URL: https://ehds.mabu.red
        run: |
          rc=0
          ./scripts/azure/check-keycloak-health.sh "$KEYCLOAK_PUBLIC_URL" edcv || rc=$?
          if [ "$rc" = "4" ]; then
            body=$(curl -s --max-time 60 "$DEMO_URL/api/graph" -w '\n%{http_code}' || true)
            code=$(echo "$body" | tail -n1)
            if [ "$code" = "503" ] && echo "$body" | grep -q '"staticSite"'; then
              echo "live=false" >> "$GITHUB_OUTPUT"
              echo "::notice::The stack is stopped outside office hours (ADR-053); the deploy is in place, auth and E2E not checked"
              echo "**Auth not checked:** the stack is stopped outside office hours (ADR-053)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Keycloak is stopped, but $DEMO_URL/api/graph answered $code, not the offline notice"
          fi
          [ "$rc" = "0" ] && echo "live=true" >> "$GITHUB_OUTPUT"
          exit "$rc"

  # -------------------------------------------------------------------
  # E2E Tests against live Azure deployment
  # -------------------------------------------------------------------
  e2e-azure:
    name: E2E Tests (Azure)
    needs: build-and-deploy
    # Off hours there is nothing live to test (see "Auth is actually working").
    if: needs.build-and-deploy.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: "azure-e2e"
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The browser download is keyed on the Playwright version in the lockfile;
      # the system libraries still come from apt on every run.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The custom domain, not the raw ACA FQDN (as reset-demo.yml already does).
      # mvhd-ui runs with NEXTAUTH_URL=https://ehds.mabu.red, so a sign-in started
      # on the ACA host sets its state cookie there and gets its callback on the
      # custom domain: "State cookie was missing", about 115 stack traces per run,
      # the largest single source of billed UI logs (#418, ADR-045).
      - name: Get Azure service URLs
        id: azure-url
        run: |
          resolve_host() {
            local app="$1"
            local custom
            custom=$(az containerapp show --name "$app" --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.customDomains[0].name" -o tsv 2>/dev/null || echo "")
            if [ -n "$custom" ] && [ "$custom" != "None" ]; then
              echo "$custom"
              return
            fi
            az containerapp show --name "$app" --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" -o tsv
          }
          UI_HOST=$(resolve_host mvhd-ui)
          KC_HOST=$(resolve_host mvhd-keycloak)
          echo "url=https://${UI_HOST}" >> "$GITHUB_OUTPUT"
          echo "keycloak_url=https://${KC_HOST}" >> "$GITHUB_OUTPUT"
          echo "Azure UI URL: https://${UI_HOST}"
          echo "Azure Keycloak URL: https://${KC_HOST}"

      # Public-page smoke only — running the full 1015-test suite against the
      # live WAN endpoint with workers=1 (CI default) cannot finish within the
      # 30-min job cap (≈1.8s/test budget is unsatisfiable). The full suite
      # already runs in pages.yml against the Docker stack.
      #
      # Scoped to the two role-navigation specs (sign-in persona cards, public
      # /graph + /docs/user-guide flows). Both are 100% green against
      # https://ehds.mabu.red and complete in <1 min with workers=4.
      #
      # Auth-gated specs (browser-errors, several persona-graphs cases) are
      # excluded: the Keycloak login flow times out in the headless runner
      # against the custom-domain redirect, which is a test-harness limitation,
      # not a deployment problem (humans log in fine on the live URL).
      - name: Run E2E smoke tests against Azure
        continue-on-error: true
        run: |
          npx playwright test \
            __tests__/e2e/16-role-navigation.spec.ts \
            __tests__/e2e/17-role-navigation-e2e.spec.ts \
            --project=chromium --workers=4 --reporter=line,html
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.azure-url.outputs.url }}
          KEYCLOAK_PUBLIC_URL: ${{ steps.azure-url.outputs.keycloak_url }}
          # #404 (ADR-044): /graph needs a session; the specs forge one with it.
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: WCAG accessibility audit (Azure)
        continue-on-error: true
        run: npx playwright test __tests__/e2e/journeys/27-wcag-accessibility.spec.ts --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.azure-url.outputs.url }}
          KEYCLOAK_PUBLIC_URL: ${{ steps.azure-url.outputs.keycloak_url }}
          # #404 (ADR-044): /graph needs a session; the specs forge one with it.
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Security tests (Azure)
        continue-on-error: true
        run: npx playwright test __tests__/e2e/journeys/28-security-pentest.spec.ts --project=chromium --grep-invert "SEC-4[1-9]|SEC-50"
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.azure-url.outputs.url }}
          KEYCLOAK_PUBLIC_URL: ${{ steps.azure-url.outputs.keycloak_url }}
          # #404 (ADR-044): /graph needs a session; the specs forge one with it.
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-azure-report
          path: ui/playwright-report/
          retention-days: 30

      - name: Test summary
        if: always()
        run: |
          echo "## E2E Test Results (Azure)" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ steps.azure-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-report/index.html ]; then
            echo "Full report available in the **playwright-azure-report** artifact." >> $GITHUB_STEP_SUMMARY
          fi
