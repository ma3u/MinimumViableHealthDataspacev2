# ---------------------------------------------------------------------------
# CFM forks: the patches still build and pass, at our tags and on upstream main
# ---------------------------------------------------------------------------
# The compose profile `cfm` runs eclipse-cfm v0.1.0 from our two forks,
# ma3u/cfm (pmanager) and ma3u/cfm-dataspace (Tenant Manager and agents), with
# six patches (ADR-102, ADR-088, #1285, sub-issues #1043 to #1047 and #1105).
# Every `fork` block in .github/upstream.json is one matrix entry. Three jobs:
#
# - "Fork at its tag": each fork's integration tag (fork.tag) passes its Go
#   tests, the Testcontainers ones included.
# - "Images": the eight images scripts/build-cfm-fork-images.sh builds from
#   both tags.
# - "Patches on upstream main": each upstream's current main merged into our
#   tag still merges and passes. A red run here means an upstream change,
#   released or not, touches what a patch changes: do the routine of
#   docs/knowledge/runbooks/cfm-fork.md before the next release forces it.
#   (The tag, not the patch branches one by one: two patches add a line to
#   the same copyright header, which the tag has already resolved.)
#
# Weekly, Monday after the upstream watch; on a change to the pins, the build
# script or this file; by hand. Nothing is pushed anywhere.
# ---------------------------------------------------------------------------
name: CFM forks

on:
  schedule:
    - cron: "47 2 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/upstream.json"
      - "scripts/build-cfm-fork-images.sh"
      - ".github/workflows/cfm-fork.yml"
  push:
    branches: [main]
    paths:
      - ".github/upstream.json"
      - "scripts/build-cfm-fork-images.sh"
      - ".github/workflows/cfm-fork.yml"

permissions:
  contents: read

concurrency:
  group: cfm-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forks:
    name: Read the forks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/upstream.json
          sparse-checkout-cone-mode: false
      - name: Every fork block in .github/upstream.json
        id: read
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          forks = [
              {"repo": e["fork"]["repo"], "tag": e["fork"]["tag"], "upstream": e["repo"], "name": e["fork"]["repo"].split("/")[1]}
              for e in json.load(open(".github/upstream.json"))["repos"] if "fork" in e
          ]
          print("matrix=" + json.dumps({"include": forks}))
          PY

  pinned:
    name: Fork at its tag (${{ matrix.name }})
    needs: forks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.forks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.tag }}
          path: fork
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: fork/go.mod
          cache-dependency-path: fork/go.sum

      - name: Go tests of the fork (Testcontainers included)
        working-directory: fork
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v /e2e)
          go test -timeout 25m "${pkgs[@]}"

  images:
    name: Images from the tags
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/upstream.json
            scripts/build-cfm-fork-images.sh
          sparse-checkout-cone-mode: false

      - name: Build the eight images from both forks' tags
        run: scripts/build-cfm-fork-images.sh "$RUNNER_TEMP/forks"

  upstream-main:
    name: Patches on upstream main (${{ matrix.name }})
    needs: forks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.forks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.tag }}
          path: fork
          fetch-depth: 0

      - name: Merge upstream main into the integration tag
        working-directory: fork
        env:
          UPSTREAM: ${{ matrix.upstream }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          git config user.name "cfm-fork check"
          git config user.email "cfm-fork-check@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --quiet upstream main
          echo "upstream main: $(git log --oneline -1 upstream/main)"
          echo "commits on upstream main since ${TAG}'s base: $(git rev-list --count HEAD..upstream/main)"
          git switch --quiet -c check/upstream-main
          if ! git merge --quiet --no-ff -m "check: ${UPSTREAM} main" upstream/main; then
            git diff --name-only --diff-filter=U | sed 's/^/conflict: /'
            git merge --abort
            echo "::error::${UPSTREAM} main no longer merges into ${TAG}; see docs/knowledge/runbooks/cfm-fork.md"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: fork/go.mod
          cache-dependency-path: fork/go.sum

      - name: Go tests with the patches on upstream main
        working-directory: fork
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v /e2e)
          go test -timeout 25m "${pkgs[@]}"
