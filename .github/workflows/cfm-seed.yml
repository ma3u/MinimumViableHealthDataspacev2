name: CFM Seed (cell + dataspace profile) (issue #203)

# Seeds the CFM control objects the /onboarding form reads before it can create
# anything: a cell, a dataspace profile with a deployment onto that cell, the
# five provisioning activity definitions, and the deploy/dispose orchestration.
#
# Why: POST /api/participants reads a cell and a profile from the TenantManager
# first. Both objects were only ever created by jad/seed-jad.sh against the local
# Docker stack, so on Azure those reads came back empty and onboarding died on a
# bare "Failed to create participant". ADR-024 Phase 3, issue #203.
#
# Architecture: both CFM managers are internal-ingress only, so the seed runs as
# a one-shot ACA Job inside the environment. The job inlines
# scripts/azure/05-cfm-seed.sh (the canonical source) — keep them in sync.
#
# Ceiling: this seeds control objects, not workers. The four CFM agents are not
# on Azure, so a new participant's VPAs stay pending. Separate work.
#
# Manual trigger only.

on:
  workflow_dispatch:
    inputs:
      cell_environment:
        description: "Value for the cell's environment property"
        type: string
        default: "health-dataspace-azure"
      keep_apps_warm:
        description: "Leave the CFM managers at min=1 after seeding (needed for onboarding to work)"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: "azure-cfm-seed"
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-mvhd-dev
  ACA_ENV: mvhd-env
  TM_APP: mvhd-tenant-mgr
  PM_APP: mvhd-provision-mgr
  # The seed reaches both managers the way mvhd-ui does (EDC_TENANT_URL in
  # 05-cfm-ui.sh): https on the internal-ingress FQDN, read from each app's
  # ingress at run time. Two forms that look right do not work:
  #   http://mvhd-tenant-mgr:8080  connects to nothing. Internal ingress
  #     listens on 80/443 of the FQDN only; the identity-hub seed's :7082
  #     works because that app carries an additional port mapping.
  #   http://mvhd-tenant-mgr  connects, then hangs: allowInsecure is off, and
  #     while a manager is crash-looping Envoy has no upstream to answer with.
  #     That hang is what looked like "the portless form never answers".

jobs:
  seed:
    name: Seed CFM cell + dataspace profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The TenantManager gets DATABASE_URL=.../cfm from 05-cfm-ui.sh, and that
      # database is created in phase 6 (06-post-deploy.sh). On the live
      # environment it is absent, and `az containerapp exec` could not create it
      # either: the first run of this workflow reported "still missing after
      # CREATE DATABASE". Phase 6 drives psql through the same exec, so either
      # the exec never worked or its tolerant `|| warn` hid the failure.
      #
      # So do not trust exec here. Print what it actually returns for the
      # diagnosis, then create the database from inside the environment with a
      # one-shot job on the postgres image, which reaches mvhd-postgres over the
      # internal TCP ingress and needs no exec shell at all.
      - name: Ensure the cfm database exists
        run: |
          PG_APP=mvhd-postgres
          PG_ADMIN=$(az containerapp show -n "$PG_APP" -g "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='POSTGRES_USER'].value" \
            -o tsv | head -1)
          PG_ADMIN="${PG_ADMIN:-mvhdadmin}"
          echo "postgres user: $PG_ADMIN"

          echo "=== diagnosis: what does containerapp exec return? ==="
          az containerapp exec -n "$PG_APP" -g "$RESOURCE_GROUP" \
            --command "psql -U ${PG_ADMIN} -d postgres -tAc \"SELECT datname FROM pg_database;\"" \
            2>&1 | tr -d '\r' | sed 's/^/  exec| /' | head -30 || true

          # The password is a secret on the app, so read it from the secret store
          # rather than the env var (which is a secretref, not a value).
          PG_PASSWORD=$(az containerapp secret show -n "$PG_APP" -g "$RESOURCE_GROUP" \
            --secret-name pg-password --query value -o tsv 2>/dev/null || echo "")
          if [ -z "$PG_PASSWORD" ]; then
            echo "::error::could not read the pg-password secret from $PG_APP"
            exit 1
          fi
          echo "read pg-password secret (${#PG_PASSWORD} chars)"

          ENV_ID=$(az containerapp env show -n "$ACA_ENV" -g "$RESOURCE_GROUP" --query "id" -o tsv)
          PG_IMAGE=$(az containerapp show -n "$PG_APP" -g "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "postgres image: $PG_IMAGE"

          REGISTRY=${PG_IMAGE%%/*}
          ACR_NAME=${REGISTRY%%.*}
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)

          cat > /tmp/pg-createdb-job.yaml <<EOF
          type: Microsoft.App/jobs
          properties:
            configuration:
              triggerType: Manual
              replicaTimeout: 300
              replicaRetryLimit: 0
              manualTriggerConfig:
                replicaCompletionCount: 1
                parallelism: 1
              registries:
                - server: ${REGISTRY}
                  username: ${ACR_NAME}
                  passwordSecretRef: acr-password
              secrets:
                - name: acr-password
                  value: ${ACR_PASSWORD}
                - name: pg-password
                  value: ${PG_PASSWORD}
            environmentId: ${ENV_ID}
            template:
              containers:
                - name: createdb
                  image: ${PG_IMAGE}
                  resources: { cpu: 0.25, memory: 0.5Gi }
                  env:
                    - { name: PGPASSWORD, secretRef: pg-password }
                    - { name: PGUSER,     value: "${PG_ADMIN}" }
                    - { name: PGHOST,     value: "${PG_APP}" }
                    - { name: PGPORT,     value: "5432" }
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      exec >/proc/1/fd/1 2>/proc/1/fd/2
                      set -x
                      echo "=== databases before ==="
                      psql -d postgres -tAc 'SELECT datname FROM pg_database ORDER BY datname'
                      for db in controlplane dataplane dataplane_omop identityhub issuerservice cfm; do
                        if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='\$db'" | grep -q 1; then
                          echo "\$db already present"
                        else
                          echo "creating \$db"
                          createdb "\$db" && echo "  created \$db" || echo "  FAILED \$db"
                        fi
                      done
                      echo "=== databases after ==="
                      psql -d postgres -tAc 'SELECT datname FROM pg_database ORDER BY datname'
                      psql -d postgres -tAc "SELECT 'CFM_PRESENT' FROM pg_database WHERE datname='cfm'"
                      # A container that exits within a second or two of starting
                      # can leave nothing in Log Analytics: the collector does not
                      # always pick its output up in time. Of the five executions
                      # of this job on 2026-09-17, all at one to two seconds, two
                      # logged nothing. Linger first.
                      sleep 20
          EOF

          if az containerapp job show -n mvhd-pg-createdb -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            az containerapp job delete -n mvhd-pg-createdb -g "$RESOURCE_GROUP" --yes -o none
          fi
          az containerapp job create -n mvhd-pg-createdb -g "$RESOURCE_GROUP" --yaml /tmp/pg-createdb-job.yaml -o none

          EXEC=$(az containerapp job start -n mvhd-pg-createdb -g "$RESOURCE_GROUP" --query "name" -o tsv)
          echo "started createdb exec: $EXEC"
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(az containerapp job execution show -n mvhd-pg-createdb -g "$RESOURCE_GROUP" \
              --job-execution-name "$EXEC" --query "properties.status" -o tsv 2>/dev/null || echo Pending)
            echo "[$i] createdb status: $STATUS"
            case "$STATUS" in
              Succeeded) break ;;
              Failed|Canceled) break ;;
            esac
            sleep 5
          done

          WS_ID=$(az containerapp env show -n "$ACA_ENV" -g "$RESOURCE_GROUP" \
                  --query "properties.appLogsConfiguration.logAnalyticsConfiguration.customerId" -o tsv 2>/dev/null)
          # Job console rows name the job in ContainerJobName_s and leave
          # ContainerAppName_s empty, so a query by app name finds nothing. Rows
          # from earlier executions stay under the same job name, so scope to
          # this one: its replica (ContainerGroupName_s) is named after it.
          if [ -n "$WS_ID" ]; then
            echo "=== createdb job logs ==="
            sleep 20
            az monitor log-analytics query -w "$WS_ID" --analytics-query \
              "ContainerAppConsoleLogs_CL | where ContainerJobName_s == 'mvhd-pg-createdb' | where ContainerGroupName_s startswith '$EXEC' | order by TimeGenerated asc | project TimeGenerated, Log_s | take 200" \
              -o tsv 2>&1 | head -200 || echo "(no logs returned)"
          fi

          az containerapp job delete -n mvhd-pg-createdb -g "$RESOURCE_GROUP" --yes -o none || true

          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::the createdb job did not succeed (status $STATUS)"
            exit 1
          fi
          echo "createdb job succeeded"

          # Succeeded only means the container exited 0, and the creates inside
          # it end in `|| echo FAILED`, so confirm from the logs that cfm is
          # really there before anything downstream depends on it.
          if [ -n "$WS_ID" ]; then
            for attempt in 1 2 3 4 5 6; do
              FOUND=$(az monitor log-analytics query -w "$WS_ID" --analytics-query \
                "ContainerAppConsoleLogs_CL | where ContainerJobName_s == 'mvhd-pg-createdb' | where ContainerGroupName_s startswith '$EXEC' | where Log_s contains 'CFM_PRESENT' | take 1" \
                -o tsv 2>/dev/null | head -5)
              if [ -n "$FOUND" ]; then
                echo "confirmed from logs: cfm database present"
                break
              fi
              echo "[$attempt] waiting for Log Analytics to ingest the job logs..."
              sleep 30
            done
            if [ -z "$FOUND" ]; then
              echo "::warning::could not confirm cfm from the job logs (ingestion lag). The seed below will show whether the manager can serve."
            fi
          fi

      # ADR-022 parked both managers at min-replicas=0. A scale-to-zero app does
      # cold-start on an internal request, but the seed's own probe loop would
      # then be racing the boot, and onboarding needs them warm afterwards
      # anyway, so bring them up explicitly and wait.
      - name: Scale the CFM managers up
        run: |
          SCALED=0
          for app in mvhd-tenant-mgr mvhd-provision-mgr; do
            if ! az containerapp show -n "$app" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
              echo "::error::$app does not exist in $RESOURCE_GROUP."
              echo "Run scripts/azure/05-cfm-ui.sh to create it (it creates both managers)."
              exit 1
            fi
            MIN=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" \
              --query "properties.template.scale.minReplicas" -o tsv)
            if [ "$MIN" != "1" ]; then
              echo "Scaling $app to min=1 (was $MIN)"
              az containerapp update -n "$app" -g "$RESOURCE_GROUP" \
                --min-replicas 1 --max-replicas 1 -o none
              SCALED=1
            else
              echo "$app already at min=1"
            fi
          done
          if [ "$SCALED" = "1" ]; then
            echo "Waiting 60s for the managers to boot..."
            sleep 60
          fi

      - name: Report manager health
        run: |
          for app in mvhd-tenant-mgr mvhd-provision-mgr; do
            STATUS=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" \
              --query "properties.runningStatus" -o tsv 2>/dev/null || echo unknown)
            echo "$app: runningStatus=$STATUS"
          done

      # The managers read a flat Viper file at /etc/appname/{tm,pm}.env, not the
      # DATABASE_URL env var 05-cfm-ui.sh passed, so the Tenant Manager has been
      # crash-looping since it was deployed:
      #   panic: ... missing parameters: tm.uri is empty, tm.bucket is empty ...
      # This mounts that file as a secret volume before anything tries to talk
      # to them. Pure ARM, so no TTY is needed.
      - name: Configure the CFM managers
        run: |
          python3 -m pip install --quiet pyyaml
          bash scripts/azure/05-cfm-configure.sh

      - name: Wait for the managers to come up clean
        run: |
          WS_ID=$(az containerapp env show -n "$ACA_ENV" -g "$RESOURCE_GROUP" \
                  --query "properties.appLogsConfiguration.logAnalyticsConfiguration.customerId" -o tsv 2>/dev/null)
          echo "giving the new revisions time to start..."
          sleep 90
          FAILED=0
          for app in mvhd-tenant-mgr mvhd-provision-mgr; do
            STATUS=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" \
              --query "properties.runningStatus" -o tsv 2>/dev/null || echo unknown)
            REV=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" \
              --query "properties.latestRevisionName" -o tsv 2>/dev/null || echo "")
            echo "$app: runningStatus=$STATUS latestRevision=${REV:-?}"

            # The replica's own state comes first: it has no ingestion lag, and
            # a manager whose launcher panics never becomes ready.
            REPLICAS=$(az containerapp replica list -n "$app" -g "$RESOURCE_GROUP" \
              --revision "$REV" \
              --query "[].[properties.containers[0].ready, properties.containers[0].restartCount]" \
              -o tsv 2>/dev/null || echo "")
            if [ -z "$REPLICAS" ]; then
              echo "::error::$app has no replica of $REV after 90s"
              FAILED=1
              continue
            fi
            while IFS=$'\t' read -r ready restarts; do
              [ -n "$ready" ] || continue
              echo "  replica: ready=$ready restarts=${restarts:-0}"
              case "$ready" in
                True|true) ;;
                *) echo "::error::$app: a replica of $REV is not ready"; FAILED=1 ;;
              esac
              if [ "${restarts:-0}" != "0" ]; then
                echo "::warning::$app: a replica of $REV restarted ${restarts} time(s)"
              fi
            done <<< "$REPLICAS"

            # Then the launcher's own words, from this revision only. Revisions
            # being deactivated keep logging their panics for a while, and the
            # run of 2026-09-17 18:44 failed on one of those while the new
            # revision had already started.
            if [ -z "$WS_ID" ]; then
              echo "  no Log Analytics workspace reachable; skipping the panic check"
              continue
            fi
            echo "  === $app, $REV, last 20 console lines ==="
            LOGS=$(az monitor log-analytics query -w "$WS_ID" --analytics-query \
              "ContainerAppConsoleLogs_CL | where ContainerAppName_s == '$app' | where RevisionName_s == '$REV' | where TimeGenerated > ago(15m) | order by TimeGenerated desc | project TimeGenerated, Log_s | take 20" \
              -o tsv 2>&1 | head -20)
            printf '%s\n' "${LOGS:-  (no logs ingested yet)}"
            if printf '%s' "$LOGS" | grep -q "missing parameters"; then
              echo "::error::$app is still missing its config parameters."
              FAILED=1
            fi
          done
          [ "$FAILED" = "0" ] || exit 1

      # If the TenantManager cannot serve, the seed below fails on a probe
      # timeout and says nothing about why. Its own logs do. The cfm database
      # was missing until minutes ago, so a crash-looping manager is the first
      # thing to rule out.
      - name: Show the TenantManager's recent logs
        run: |
          WS_ID=$(az containerapp env show -n "$ACA_ENV" -g "$RESOURCE_GROUP" \
                  --query "properties.appLogsConfiguration.logAnalyticsConfiguration.customerId" -o tsv 2>/dev/null)
          if [ -z "$WS_ID" ]; then
            echo "no Log Analytics workspace reachable; skipping"
            exit 0
          fi
          for app in mvhd-tenant-mgr mvhd-provision-mgr; do
            echo "=== $app (last 40 console lines) ==="
            az monitor log-analytics query -w "$WS_ID" --analytics-query \
              "ContainerAppConsoleLogs_CL | where ContainerAppName_s == '$app' | order by TimeGenerated desc | project TimeGenerated, RevisionName_s, Log_s | take 40" \
              -o tsv 2>&1 | head -40 || echo "(no logs returned)"
            echo ""
            echo "=== $app system logs (last 15) ==="
            az monitor log-analytics query -w "$WS_ID" --analytics-query \
              "ContainerAppSystemLogs_CL | where ContainerAppName_s == '$app' | order by TimeGenerated desc | project TimeGenerated, Log_s | take 15" \
              -o tsv 2>&1 | head -15 || echo "(no logs returned)"
            echo ""
          done

      - name: Run seed as one-shot ACA Job
        run: |
          ENV_ID=$(az containerapp env show -n "$ACA_ENV" -g "$RESOURCE_GROUP" \
                     --query "id" -o tsv)
          # The managers answer on https at their internal-ingress FQDN, the
          # address mvhd-ui uses too. The env block above lists the forms that
          # do not work.
          TM_FQDN=$(az containerapp ingress show -n "$TM_APP" -g "$RESOURCE_GROUP" --query fqdn -o tsv)
          PM_FQDN=$(az containerapp ingress show -n "$PM_APP" -g "$RESOURCE_GROUP" --query fqdn -o tsv)
          [ -n "$TM_FQDN" ] || { echo "::error::$TM_APP has no ingress FQDN"; exit 1; }
          [ -n "$PM_FQDN" ] || { echo "::error::$PM_APP has no ingress FQDN"; exit 1; }
          TM_INTERNAL_URL="https://${TM_FQDN}/api"
          PM_INTERNAL_URL="https://${PM_FQDN}/api"
          echo "TenantManager:    $TM_INTERNAL_URL"
          echo "ProvisionManager: $PM_INTERNAL_URL"
          # Same approach as edc-seed-participants.yml: inline the canonical
          # script via base64 and run it on Microsoft's azure-cli image, which
          # already has bash, curl and python3.
          SCRIPT_B64=$(base64 < scripts/azure/05-cfm-seed.sh | tr -d '\n')

          cat > /tmp/cfm-seed-job.yaml <<EOF
          type: Microsoft.App/jobs
          properties:
            configuration:
              triggerType: Manual
              replicaTimeout: 600
              replicaRetryLimit: 0
              manualTriggerConfig:
                replicaCompletionCount: 1
                parallelism: 1
            environmentId: ${ENV_ID}
            template:
              containers:
                - name: seed
                  image: mcr.microsoft.com/azure-cli:latest
                  resources: { cpu: 0.5, memory: 1Gi }
                  env:
                    - { name: TM,               value: "${TM_INTERNAL_URL}" }
                    - { name: PM,               value: "${PM_INTERNAL_URL}" }
                    - { name: CELL_ENVIRONMENT, value: "${{ github.event.inputs.cell_environment }}" }
                    - { name: SCRIPT_B64,       value: "${SCRIPT_B64}" }
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      # Unbuffered stdout, so a fast-failing container still
                      # leaves its output in Log Analytics.
                      exec >/proc/1/fd/1 2>/proc/1/fd/2
                      set -x
                      echo "=== cfm-seed env ==="
                      echo "TM=\$TM"
                      echo "PM=\$PM"
                      mkdir -p /tmp/seed
                      printf '%s' "\$SCRIPT_B64" | base64 -d > /tmp/seed/run.sh
                      chmod +x /tmp/seed/run.sh
                      head -3 /tmp/seed/run.sh
                      echo "=== running /tmp/seed/run.sh ==="
                      bash /tmp/seed/run.sh
                      EXIT=\$?
                      echo "=== cfm-seed exited with \$EXIT ==="
                      # A container that exits within a second or two of starting
                      # can leave nothing in Log Analytics: the collector does not
                      # always pick its output up in time. The execution of
                      # 2026-09-17 19:27 succeeded in under a second and logged
                      # nothing, while the failing ones, at 100 seconds each, all
                      # did. Linger first.
                      sleep 20
                      exit \$EXIT
          EOF

          if az containerapp job show -n mvhd-cfm-seed -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            az containerapp job delete -n mvhd-cfm-seed -g "$RESOURCE_GROUP" --yes -o none
          fi
          az containerapp job create -n mvhd-cfm-seed -g "$RESOURCE_GROUP" --yaml /tmp/cfm-seed-job.yaml -o none

          EXEC=$(az containerapp job start -n mvhd-cfm-seed -g "$RESOURCE_GROUP" --query "name" -o tsv)
          echo "started exec: $EXEC"
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(az containerapp job execution show -n mvhd-cfm-seed -g "$RESOURCE_GROUP" \
              --job-execution-name "$EXEC" --query "properties.status" -o tsv 2>/dev/null || echo Pending)
            echo "[$i] cfm-seed status: $STATUS"
            case "$STATUS" in
              Succeeded) echo "cfm-seed Succeeded"; break ;;
              Failed|Canceled) echo "cfm-seed $STATUS"; break ;;
            esac
            sleep 5
          done

          WS_ID=$(az containerapp env show -n "$ACA_ENV" -g "$RESOURCE_GROUP" \
                  --query "properties.appLogsConfiguration.logAnalyticsConfiguration.customerId" -o tsv 2>/dev/null)
          if [ -z "$WS_ID" ]; then
            WS_ID=$(az monitor log-analytics workspace list --query "[0].customerId" -o tsv 2>/dev/null)
          fi
          echo "Log Analytics workspace: ${WS_ID:-<not found>}"
          {
            echo "## CFM seed execution"
            echo ""
            echo "status: **${STATUS}**"
            echo ""
            if [ -n "$WS_ID" ]; then
              echo "## Container logs (Log Analytics)"
              echo ""
              echo '```'
              # Ingestion lags by a minute or more: the first run queried after
              # 15 seconds and printed an empty block, which is how a failing
              # seed managed to say nothing at all. Job rows name the job in
              # ContainerJobName_s and leave ContainerAppName_s empty, which
              # was the other way it said nothing. And rows from earlier
              # executions stay under the same job name, which is how a run
              # that succeeded printed the previous run's failure.
              LOGS=""
              for _ in 1 2 3 4 5 6; do
                sleep 30
                LOGS=$(az monitor log-analytics query -w "$WS_ID" --analytics-query \
                  "ContainerAppConsoleLogs_CL | where ContainerJobName_s == 'mvhd-cfm-seed' | where ContainerGroupName_s startswith '$EXEC' | order by TimeGenerated asc | project TimeGenerated, Log_s | take 300" \
                  -o tsv 2>&1 | head -300)
                [ -n "$LOGS" ] && break
              done
              printf '%s\n' "${LOGS:-(no logs returned after 3 minutes)}"
              echo '```'
            else
              echo '> No Log Analytics workspace reachable from the SP.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [ "$STATUS" = "Succeeded" ] || exit 1

      - name: Cleanup seed job
        if: always()
        run: |
          az containerapp job delete -n mvhd-cfm-seed -g "$RESOURCE_GROUP" --yes -o none || true

      # Onboarding calls the TenantManager on every request, so scaling back to
      # zero re-breaks it on the next cold start. Off only if explicitly asked.
      - name: Scale the CFM managers back to zero
        if: ${{ github.event.inputs.keep_apps_warm != 'true' }}
        run: |
          for app in mvhd-tenant-mgr mvhd-provision-mgr; do
            az containerapp update -n "$app" -g "$RESOURCE_GROUP" \
              --min-replicas 0 --max-replicas 1 -o none
            echo "$app scaled to min=0"
          done
