name: Bruno API Smoke

# Runs the bruno/MVHDv2 collection against either the GitHub Pages
# static-mock mirror (no auth) or the live Azure-Dev deployment (auth via
# a forged NextAuth session cookie). Pass-through for asserts and 5xx
# guards defined at the collection level.

on:
  push:
    branches: ["main"]
    paths:
      - "bruno/MVHDv2/**"
      - "ui/src/app/api/**"
      - "ui/scripts/forge-bruno-session.mjs"
      # The runner and the realm it signs in against, asserted by
      # scripts/check-workflow-paths.py.
      - "scripts/run-api-tests.sh"
      - "scripts/check-compliance-baseline.py"
      - "scripts/compliance-baseline.json"
      - "jad/seed-jad.sh"
      - "jad/keycloak-realm.json"
      - ".github/workflows/bruno-smoke.yml"
  pull_request:
    paths:
      - "bruno/MVHDv2/**"
      - "ui/src/app/api/**"
      - "ui/scripts/forge-bruno-session.mjs"
  workflow_dispatch:
    inputs:
      environment:
        description: "Bruno environment to run against"
        type: choice
        options: [Static-mock, Azure-Dev]
        default: Static-mock
      persona:
        description: "Persona for Azure-Dev session forge"
        type: choice
        options:
          [edcadmin, regulator, clinicuser, lmcuser, researcher, patient1]
        # edcadmin has the broadest role set so the smoke covers the most
        # endpoints with green status. Switch to a narrower persona when
        # explicitly testing role-based access control.
        default: edcadmin

permissions:
  contents: read
  pull-requests: write
  # dorny/test-reporter@v1 publishes a Check Run; needs checks:write to do so.
  # Without this the JUnit publish step fails with "Resource not accessible
  # by integration" even though fail-on-error is false.
  checks: write

concurrency:
  group: "bruno-smoke-${{ github.ref }}"
  cancel-in-progress: true

env:
  ENV_NAME: ${{ github.event.inputs.environment || 'Static-mock' }}
  PERSONA: ${{ github.event.inputs.persona || 'edcadmin' }}

jobs:
  smoke:
    name: Bruno smoke (${{ github.event.inputs.environment || 'Static-mock' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./ui/package-lock.json

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      # next-auth, for the session forge. Static-mock needs no session, but the
      # runner is the same entry point for both environments.
      - name: Install UI dependencies
        if: ${{ env.ENV_NAME == 'Azure-Dev' }}
        working-directory: ui
        run: npm ci

      # scripts/run-api-tests.sh forges one session per persona; this step only
      # proves the secret is present before the stack work starts.
      - name: Check the session secret is available
        if: ${{ env.ENV_NAME == 'Azure-Dev' }}
        working-directory: ui
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          if [ -z "$NEXTAUTH_SECRET" ]; then
            echo "::error::NEXTAUTH_SECRET secret not set; cannot forge a session for Azure-Dev"
            exit 1
          fi
          echo "NEXTAUTH_SECRET is set; the runner forges one session per persona"

      # No continue-on-error. The collection is organised by persona and every
      # request asserts a status and a body shape (ADR-032); a failure here is
      # a defect in the hub, not noise. The previous note about "7 known-fail
      # requests" described a collection whose only assertion was status < 500
      # (#349).
      - name: Run Bruno collection
        id: bru
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          BRUNO_REPORT_DIR: ${{ github.workspace }}/bruno-report
        run: |
          set -euo pipefail
          ./scripts/run-api-tests.sh "$ENV_NAME" | tee bru.log

      - name: Summarise Bruno result
        if: always()
        run: |
          {
            echo "## Bruno smoke (${ENV_NAME}) — persona \`${PERSONA}\`"
            echo ""
            if [ -f bru.log ]; then
              grep -E "Status|Requests|Tests|Assertions|Duration" bru.log \
                | sed -E 's/^[│ ]+//; s/[│ ]+$//' \
                | head -20 \
                | awk 'BEGIN{print "| Metric | Result |"; print "| --- | --- |"} {gsub(/  +/," "); split($0,a,"│"); if(a[1]&&a[2]){gsub(/^ +| +$/,"",a[1]);gsub(/^ +| +$/,"",a[2]);print "| "a[1]" | "a[2]" |"} else {gsub(/^ +| +$/,""); print "| "$0" | |"}}'
              echo ""
              echo "<details><summary>Failed request log</summary>"
              echo ""
              echo '```'
              grep -E "[45][0-9][0-9] " bru.log | head -30 || echo "(none)"
              echo '```'
              echo "</details>"
            else
              echo "_no log produced_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish JUnit results
        if: ${{ always() && hashFiles('bruno-report/*.xml') != '' }}
        uses: dorny/test-reporter@v2
        with:
          name: Bruno results (${{ env.ENV_NAME }})
          path: ${{ github.workspace }}/bruno-report/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload report artefact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bruno-report-${{ env.ENV_NAME }}
          path: ${{ github.workspace }}/bruno-report/
          retention-days: 14
          if-no-files-found: warn
