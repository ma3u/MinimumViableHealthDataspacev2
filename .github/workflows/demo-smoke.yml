# ---------------------------------------------------------------------------
# Demo Smoke — ehds.mabu.red
# ---------------------------------------------------------------------------
# Health checks for the public Azure demo:
#   - Bruno API collection (Azure-Dev env, the persona folders, ADR-032)
#   - Playwright public-route smoke (no auth)
#   - ZAP baseline (anonymous)
#
# Triggers:
#   - Daily 06:00 UTC
#   - Push to main when UI or workflows change
#   - Manual dispatch
# ---------------------------------------------------------------------------
name: Demo Smoke

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "bruno/**"
      # The runner and the floor it checks against, asserted by
      # scripts/check-workflow-paths.py.
      - "scripts/run-api-tests.sh"
      - "scripts/check-compliance-baseline.py"
      - "scripts/compliance-baseline.json"
      - ".github/workflows/demo-smoke.yml"
  workflow_dispatch:

env:
  DEMO_URL: https://ehds.mabu.red

# Read-only token unless a job asks for more (trivy-scan does, for SARIF).
permissions:
  contents: read

jobs:
  # Outside office hours the stack is stopped and every data route answers 503
  # with a pointer to the static site (ADR-053). A smoke run then has nothing
  # to test: it skips, and says so in the summary, rather than going red every
  # weekend or passing as if it had checked something.
  live:
    name: Is the live demo up?
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      up: ${{ steps.probe.outputs.up }}
    steps:
      - id: probe
        run: |
          body=$(curl -s --max-time 60 "$DEMO_URL/api/graph" -w '\n%{http_code}' || true)
          code=$(echo "$body" | tail -n1)
          if [ "$code" = "503" ] && echo "$body" | grep -q '"staticSite"'; then
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$DEMO_URL is offline outside office hours (ADR-053); smoke skipped"
            echo "**Skipped:** $DEMO_URL is offline outside office hours (ADR-053)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "up=true" >> "$GITHUB_OUTPUT"
            echo "$DEMO_URL/api/graph answered $code; running the smoke"
          fi

  bruno:
    name: Bruno API (Azure-Dev)
    needs: live
    if: needs.live.outputs.up == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # ui/node_modules, for the session forge (next-auth's own encode()).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # Until 2026-09-26 this step ran with no secret at all: every one of the
      # 49 requests answered 401 Unauthorized and the job was red every day for
      # weeks while the collection's only assertion (status < 500) passed
      # (#349). The forge needs the deployment's own NEXTAUTH_SECRET.
      # A missing secret is its own failure, and a hard one: without it every
      # request answers 401 and the collection measures nothing. Kept separate
      # from the run below so this message is what a reader sees.
      - name: The demo's signing secret must be present
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${NEXTAUTH_SECRET}" ]; then
            echo "::error::NEXTAUTH_SECRET is not set, so no persona can sign in and every request would answer 401. Set the repository secret to the value the deployment runs with."
            exit 1
          fi

      # The suite step reports either way; the baseline gate below is the
      # assertion (ADR-031), the same split compliance.yml uses. Until
      # 2026-09-28 this step failed the job on its own exit code, so the one
      # known-red request (#373) kept Demo Smoke red on every run while the
      # gate underneath it printed NO BASELINE and passed.
      - name: Run the Bruno API collection against the demo
        continue-on-error: true
        env:
          BRUNO_REPORT_DIR: ${{ github.workspace }}/test-results/bruno-api-azure-results
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          set -euo pipefail
          chmod +x scripts/run-api-tests.sh
          mkdir -p "$BRUNO_REPORT_DIR"
          ./scripts/run-api-tests.sh Azure-Dev
      # The floor lives in scripts/compliance-baseline.json under
      # bruno-api-azure-results, armed at 123/0 on 2026-09-28: the demo
      # answers every request in the collection, so any red is a regression.
      - name: Compliance baseline (Azure demo)
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/check-compliance-baseline.py --results test-results \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bruno-azure-dev
          path: test-results/bruno-api-azure-results/
          retention-days: 14

  playwright-public:
    name: Playwright public routes
    needs: live
    if: needs.live.outputs.up == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke against ${{ env.DEMO_URL }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.DEMO_URL }}
          # #404 (ADR-044): /graph needs a session. smoke.spec.ts forges one
          # with the live secret, and fails in CI without it rather than skip.
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: npx playwright test __tests__/e2e/smoke.spec.ts --project=chromium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-public
          path: ui/playwright-report/
          retention-days: 14

  zap-baseline:
    name: ZAP baseline (anonymous)
    needs: live
    if: needs.live.outputs.up == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.DEMO_URL }}
          cmd_options: "-m 2"
          rules_file_name: .zap/rules.tsv
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap_scan_${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline-${{ github.run_id }}
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30
