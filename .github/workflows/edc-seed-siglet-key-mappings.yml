name: Signing keys for token renewal on Azure (#888)

# siglet's access token lives one hour; the consumer's siglet then renews it
# with a proof it signs through Vault's transit engine, under a key id the
# provider finds in the consumer's DID document. Each participant context
# needs a transit key, its public half as a key pair in IdentityHub, and a
# signing-key mapping in siglet. This runs scripts/seed-siglet-key-mappings.sh
# inside the environment (Vault, IdentityHub and siglet's management API are
# internal) through scripts/azure/siglet-key-mappings-job.sh: `plan` reads
# back what is there per participant and changes nothing; `apply` creates what
# is missing, then reads back. Idempotent.
#
# Before `apply`: mvhd-siglet must run with SIGLET__VAULT__USE_HTTP_RESOLUTION
# (scripts/azure/17-siglet.sh), or the provider cannot read the DID document.
#
# The admin client secret is read from Keycloak's admin API and the Vault
# token from the control plane's ACA secret, both masked, and handed to the
# job as ACA secrets, as edc-reseed-identity-layer.yml does.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (read only) or apply"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  id-token: write
  contents: read

concurrency:
  group: "azure-identity-layer"
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-mvhd-dev
  ACA_ENV: mvhd-env
  JOB: mvhd-seed-siglet-keys
  KC_PUBLIC: https://auth.ehds.mabu.red

jobs:
  seed:
    name: Signing keys (${{ github.event.inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the credentials (masked)
        run: |
          set -euo pipefail
          KC_ADMIN_PASS=$(az containerapp secret show --name mvhd-keycloak --resource-group "$RESOURCE_GROUP" \
            --secret-name keycloak-admin-password --query value -o tsv)
          echo "::add-mask::$KC_ADMIN_PASS"
          MASTER=$(curl -sS --max-time 30 -X POST "${KC_PUBLIC}/realms/master/protocol/openid-connect/token" \
            --data-urlencode grant_type=password --data-urlencode client_id=admin-cli \
            --data-urlencode username=admin --data-urlencode "password=${KC_ADMIN_PASS}" | jq -r '.access_token // empty')
          [ -n "$MASTER" ] || { echo "::error::no Keycloak admin token"; exit 1; }
          echo "::add-mask::$MASTER"
          uuid=$(curl -sS -H "Authorization: Bearer $MASTER" "${KC_PUBLIC}/admin/realms/edcv/clients?clientId=admin" | jq -r '.[0].id // empty')
          ADMIN_SECRET=$(curl -sS -H "Authorization: Bearer $MASTER" "${KC_PUBLIC}/admin/realms/edcv/clients/${uuid}/client-secret" | jq -r '.value // empty')
          [ -n "$ADMIN_SECRET" ] || { echo "::error::could not read the admin client secret"; exit 1; }
          echo "::add-mask::$ADMIN_SECRET"
          VAULT_URL=$(az containerapp show -n mvhd-controlplane -g "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='EDC_VAULT_HASHICORP_URL'].value | [0]" -o tsv)
          # The rotated token is the control plane's ACA secret vault-token (#359);
          # before the rotation it is the plain env value.
          VAULT_TOKEN=$(az containerapp secret show -n mvhd-controlplane -g "$RESOURCE_GROUP" \
            --secret-name vault-token --query value -o tsv 2>/dev/null || true)
          [ -n "$VAULT_TOKEN" ] || VAULT_TOKEN=$(az containerapp show -n mvhd-controlplane -g "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='EDC_VAULT_HASHICORP_TOKEN'].value | [0]" -o tsv)
          if [ -z "$VAULT_URL" ] || [ -z "$VAULT_TOKEN" ]; then
            echo "::error::could not read Vault's address and token from mvhd-controlplane"; exit 1
          fi
          echo "::add-mask::$VAULT_TOKEN"
          {
            echo "ADMIN_SECRET=$ADMIN_SECRET"; echo "VAULT_URL=$VAULT_URL"; echo "VAULT_TOKEN=$VAULT_TOKEN"
          } >> "$GITHUB_ENV"
          echo "credentials read (admin ${#ADMIN_SECRET}, vault ${#VAULT_TOKEN} chars)"

      - name: Run the job
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          ENV_ID=$(az containerapp env show -n "$ACA_ENV" -g "$RESOURCE_GROUP" --query id -o tsv)
          LOCATION=$(az containerapp env show -n "$ACA_ENV" -g "$RESOURCE_GROUP" --query location -o tsv)
          export ENV_ID LOCATION
          tar -czf /tmp/scripts.tgz -C scripts/azure siglet-key-mappings-job.sh -C .. seed-siglet-key-mappings.sh
          SCRIPTS_TGZ_B64=$(base64 -w0 < /tmp/scripts.tgz)
          export SCRIPTS_TGZ_B64
          python3 - /tmp/job.yaml <<'PY'
          import os, sys, yaml
          out = sys.argv[1]
          e = os.environ
          env = {"MODE": e["MODE"], "KC_HOST": e["KC_PUBLIC"],
                 "IH": "http://mvhd-identityhub:7082/api/identity",
                 "SIGLET_MANAGEMENT_URL": "http://mvhd-siglet:8083",
                 "VAULT_ADDR": e["VAULT_URL"],
                 "SCRIPTS_TGZ_B64": e["SCRIPTS_TGZ_B64"]}
          secrets = {"admin-secret": e["ADMIN_SECRET"], "vault-token": e["VAULT_TOKEN"]}
          refs = {"KC_CLIENT_SECRET": "admin-secret", "VAULT_TOKEN": "vault-token"}
          body = ("set -u\napk add --no-cache bash curl jq python3 >/dev/null 2>&1\n"
                  "mkdir -p /tmp/s && echo \"$SCRIPTS_TGZ_B64\" | base64 -d | tar -xz -C /tmp/s\n"
                  "bash /tmp/s/siglet-key-mappings-job.sh; rc=$?\necho \"=== seed exited with $rc ===\"\nsleep 30\nexit $rc\n")
          doc = {"location": e["LOCATION"], "properties": {"environmentId": e["ENV_ID"],
            "configuration": {"triggerType": "Manual", "replicaTimeout": 900, "replicaRetryLimit": 0,
              "manualTriggerConfig": {"parallelism": 1, "replicaCompletionCount": 1},
              "secrets": [{"name": k, "value": v} for k, v in secrets.items()]},
            "template": {"containers": [{"name": "seed", "image": "docker.io/library/alpine:3.19",
              "command": ["/bin/sh", "-c"], "args": [body], "resources": {"cpu": 0.5, "memory": "1Gi"},
              "env": [{"name": k, "value": v} for k, v in env.items()]
                     + [{"name": k, "secretRef": v} for k, v in refs.items()]}]}}}
          yaml.safe_dump(doc, open(out, "w"), sort_keys=False)
          PY
          if az containerapp job show -n "$JOB" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            az containerapp job update -n "$JOB" -g "$RESOURCE_GROUP" --yaml /tmp/job.yaml -o none
          else
            az containerapp job create -n "$JOB" -g "$RESOURCE_GROUP" --yaml /tmp/job.yaml -o none
          fi
          rm -f /tmp/job.yaml
          EXEC=$(az containerapp job start -n "$JOB" -g "$RESOURCE_GROUP" --query name -o tsv)
          echo "EXEC=$EXEC" >> "$GITHUB_ENV"
          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(az containerapp job execution show -n "$JOB" -g "$RESOURCE_GROUP" \
              --job-execution-name "$EXEC" --query properties.status -o tsv 2>/dev/null || echo Pending)
            case "$STATUS" in Succeeded|Failed|Stopped) break ;; esac
            sleep 15
          done
          echo "STATUS=$STATUS" >> "$GITHUB_ENV"

      - name: Show the job log
        if: always()
        run: |
          WS=$(az containerapp env show -n "$ACA_ENV" -g "$RESOURCE_GROUP" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          sleep 60
          az monitor log-analytics query -w "$WS" --analytics-query \
            "ContainerAppConsoleLogs_CL | where ContainerGroupName_s startswith '${EXEC}' | order by TimeGenerated asc | project Log_s" \
            -o tsv 2>&1 | sed 's/\tPrimaryResult$//' | head -300

      - name: Verdict
        run: |
          echo "execution ${EXEC}: ${STATUS:-unknown}"
          [ "${STATUS:-}" = Succeeded ] || { echo "::error::the signing-key job did not succeed (${STATUS:-unknown})"; exit 1; }
