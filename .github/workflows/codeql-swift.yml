# ---------------------------------------------------------------------------
# CodeQL — Swift (the Klarbefund iPhone app)
# ---------------------------------------------------------------------------
# CodeQL cannot read Swift from source; it watches a real build on a macOS
# runner, which has taken up to the 90-minute limit (#765). So it runs weekly
# and by hand, and on a pull request only when this workflow or the local
# script changes, so a fix to the analysis shows on its own PR. A change to
# the app itself is checked before it leaves the laptop: the pre-push hook
# codeql-swift runs clients/ios/Scripts/codeql-swift.sh (#847).
#
# The build is the app scheme from project.yml (Sources/MeinBefund and
# Sources/Shared). The default setup this
# replaces used autobuild, which found only Package.swift: the .xcodeproj is
# generated by xcodegen and not committed, so the app was never analysed.
# Keep the build commands in step with the local script.
# ---------------------------------------------------------------------------
name: CodeQL (Swift)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/codeql-swift.yml"
      - "clients/ios/Scripts/codeql-swift.sh"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-26
    # The first run on main built for 43 minutes and hit a 45-minute limit
    # one minute into the analysis; the pull request run took 38. Runner
    # speed varies, so leave room.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: clients/ios
    steps:
      - uses: actions/checkout@v7

      - name: Install xcodegen
        run: brew install xcodegen

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # The same build as clients/ios/Scripts/codeql-swift.sh.
      # The app scheme compiles Sources/MeinBefund and Sources/Shared. The
      # Swift package build is left out: it compiled Shared a second time,
      # under the tracer, only to add the developer tools, which do not ship.
      #
      # One architecture. The generic simulator destination builds arm64 and
      # x86_64, so the tracer extracted every file twice for the same source.
      # The index store is off as well: CodeQL does not read it.
      #
      # One compile job at a time. The Swift extractor is an x86_64 binary
      # (codeql/swift/tools/osx64) and runs under Rosetta on the arm64
      # runner, which has 7.5 GB and three cores. Three frontends with three
      # extractors beside them (up to 860 MB each) and Rosetta's translator
      # filled 6.4 GB of swap by minute 16, and the runner stopped
      # answering: every run since 10-29 ended at the job limit with no log
      # (#845, diagnosed with a memory watchdog on the runner).
      #
      # The step has its own limit, below the job's, so a slow build ends the
      # step while the runner still answers, and its log is kept.
      - name: Build the app
        timeout-minutes: 70
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project MeinBefund.xcodeproj -scheme MeinBefund \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" -jobs 1 \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO SWIFT_ENABLE_BATCH_MODE=NO \
            'OTHER_SWIFT_FLAGS=$(inherited) -j1' \
            clean build -quiet

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
