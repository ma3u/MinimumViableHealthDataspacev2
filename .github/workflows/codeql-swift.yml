# ---------------------------------------------------------------------------
# CodeQL — Swift (the Klarbefund iPhone app)
# ---------------------------------------------------------------------------
# CodeQL cannot read Swift from source; it watches a real build, which needs a
# macOS runner and about 17 minutes. So this runs only when clients/ios
# changes, plus weekly so new queries reach unchanged code. Before pushing
# iOS changes, run the same thing locally: clients/ios/Scripts/codeql-swift.sh.
#
# The build is the app scheme from project.yml (Sources/MeinBefund and
# Sources/Shared). The default setup this
# replaces used autobuild, which found only Package.swift: the .xcodeproj is
# generated by xcodegen and not committed, so the app was never analysed.
# Keep the build commands in step with the local script.
# ---------------------------------------------------------------------------
name: CodeQL (Swift)

on:
  push:
    branches: [main]
    paths:
      - "clients/ios/**"
      - ".github/workflows/codeql-swift.yml"
  pull_request:
    branches: [main]
    paths:
      - "clients/ios/**"
      - ".github/workflows/codeql-swift.yml"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-26
    # The first run on main built for 43 minutes and hit a 45-minute limit
    # one minute into the analysis; the pull request run took 38. Runner
    # speed varies, so leave room.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: clients/ios
    steps:
      - uses: actions/checkout@v7

      - name: Install xcodegen
        run: brew install xcodegen

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # The same build as clients/ios/Scripts/codeql-swift.sh.
      # The app scheme compiles Sources/MeinBefund and Sources/Shared. The
      # Swift package build is left out: it compiled Shared a second time,
      # under the tracer, only to add the developer tools, which do not ship.
      - name: Build the app
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project MeinBefund.xcodeproj -scheme MeinBefund \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO clean build -quiet

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
