name: ACA Off-Hours Scale (Mon-Fri 07-20 Europe/Berlin)

# ADR-022/023: re-enable the off-hours schedule for cost optimisation.
# ADR-027: extend it to the full EDC stack. ADR-042 recorded which apps
# stopped and in which order; ADR-047 took Vault out of the stop. ADR-053
# (2026-10-04) supersedes both: the stop stops every app and the database, and
# the UI shows an offline notice that links the static site.
#
# ADR-058 (2026-10-07, #595): Azure triggers the stop and the start, not this
# workflow. GitHub's scheduler dropped every scheduled run of this repository
# on 2026-10-06, so the stack neither started nor stopped. The ACA jobs
# mvhd-offhours-stop (18:13 UTC) and mvhd-offhours-start (05:17 UTC, Mon-Fri)
# run scripts/azure/offhours.sh as the managed identity id-mvhd-offhours
# (scripts/azure/18-offhours-jobs.sh). This workflow runs the same script:
#   - workflow_dispatch: a start or stop by hand;
#   - the crons below, an hour after the jobs, as a fallback. When the job did
#     its work they find nothing to do ("Determine Action"); when it did not,
#     and GitHub fires them, they do it.
#
# The schedule was introduced by ADR-016, disabled by ADR-018, and reinstated
# by ADR-022/023. Since ADR-041 Postgres is a Flexible Server; since ADR-053 it
# is stopped with everything else.
on:
  schedule:
    # UTC; CEST (summer) = UTC+2. The jobs run at 18:13 and 05:17.
    - cron: "13 19 * * *" # stop fallback:  21:13 Berlin (CEST)
    - cron: "17 6 * * 1-5" # start fallback: 08:17 Berlin (CEST), Mon-Fri
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        type: choice
        options: [start, stop]
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: "azure-schedule"
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-mvhd-dev
  PG_FLEX_NAME: mvhd-pg-b53a0449
  # A working session at night or at the weekend without a commit: every stop
  # before this instant is skipped. The Azure job cannot read a repository
  # variable; the tag live-demo-hold-until on mvhd-ui holds both
  # (docs/knowledge/runbooks/live-demo-off-hours.md).
  LIVE_DEMO_HOLD_UNTIL: ${{ vars.LIVE_DEMO_HOLD_UNTIL }}

jobs:
  determine-action:
    name: Determine Action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.decide.outputs.action }}
    steps:
      - name: Checkout
        if: github.event_name == 'schedule'
        uses: actions/checkout@v7

      # Only a scheduled run asks Azure what state the stack is in; a manual
      # dispatch does what it is told.
      - name: Azure Login (OIDC)
        if: github.event_name == 'schedule'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 6 * * 1-5" ]; then
            echo "action=$(./scripts/azure/offhours.sh decide start)" >> "$GITHUB_OUTPUT"
          else
            echo "action=$(./scripts/azure/offhours.sh decide stop)" >> "$GITHUB_OUTPUT"
          fi

  stop:
    name: Stop Everything
    needs: determine-action
    if: needs.determine-action.outputs.action == 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # UI offline first, then every other app, then Postgres (ADR-053); it
      # fails the run unless the UI is offline and Postgres Stopped.
      - name: Stop (scripts/azure/offhours.sh)
        run: ./scripts/azure/offhours.sh stop

      - name: Stop summary
        if: always()
        run: |
          {
            echo "## Off-Hours Stop (ADR-053, ADR-058)"
            echo ""
            echo "**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Trigger:** ${{ github.event_name }} (the ACA job mvhd-offhours-stop is the scheduled path)"
            echo "**Result:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  start:
    name: Scale Up (Start)
    needs: determine-action
    if: needs.determine-action.outputs.action == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Postgres first, the apps in order, the realm restored, the UI online
      # last; it fails the run when Keycloak cannot serve a login (2026-09-30).
      - name: Start (scripts/azure/offhours.sh)
        run: ./scripts/azure/offhours.sh start

      - name: Start summary
        if: always()
        run: |
          {
            echo "## On-Hours Start (ADR-053, ADR-058)"
            echo ""
            echo "**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Trigger:** ${{ github.event_name }} (the ACA job mvhd-offhours-start is the scheduled path)"
            echo "**Result:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
