name: ACA Off-Hours Scale (Mon-Fri 07-20 Europe/Berlin)

# ADR-022/023: re-enable the off-hours schedule for cost optimisation.
# ADR-027: extend it to the full EDC stack. ADR-024 provisioned the 8 EDC
# apps at min=1 (24/7) but this schedule still only covered the 7 "healthy"
# apps — so the EDC stack billed nights + weekends, the cost surge flagged by
# FinOps in May 2026. The schedule now scales 17 of the 21 Container Apps;
# ADR-042 records which, which never stop and why, and the start order;
# ADR-047 takes Vault out of the stop. ADR-053 (2026-10-04) supersedes both:
# the stop now stops every app and the database, and the UI shows an offline
# notice that links the static site.
#
# INF-STG-EU_EHDS no longer requires 24/7 — the public ehds.mabu.red demo is
# documented as a weekday-hours service in the README, so off-hours
# scale-down is non-disruptive. Stop saves ~€250-300/mo by halting every app
# overnight + weekends (apps run ~65h/week instead of 168h).
#
# The schedule was originally introduced by ADR-016 and disabled by ADR-018
# when the subscription changed; ADR-022/023 reinstated it under the
# Workaround-B (Postgres-on-ACA) model. Since ADR-041 (2026-10-02) Postgres is
# a Flexible Server; since ADR-053 it is stopped with everything else.
on:
  schedule:
    # Cron is UTC; CEST (summer) = UTC+2, CET (winter) = UTC+1.
    # Operating window is "07:00–20:00 Europe/Berlin local"; we set the cron
    # at the CEST boundaries (05:00/18:00 UTC) and accept ±1 h drift in
    # winter, same as the original ADR-016 schedule.
    - cron: "0 5 * * 1-5" # start: Mon–Fri 07:00 Europe/Berlin (CEST)
    - cron: "0 18 * * *" # stop:  daily 20:00 Europe/Berlin (CEST)
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        type: choice
        options: [start, stop]
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: "azure-schedule"
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-mvhd-dev
  # Dates (Europe/Berlin) on which the evening stop is skipped, so the stack
  # runs through the night into the next scheduled stop. One reason per date:
  #   2026-10-14  HL7 AI Challenge Winners Showcase webinar, 11:00 EDT
  #               (17:00 Berlin), and the demo must still answer at 20:00 EDT
  #               (02:00 Berlin, 15 Oct) for anyone who opens it afterwards.
  #               The next stop is 15 Oct 18:00 UTC as usual.
  KEEP_UP_DATES: "2026-10-14"
  # ADR-041: Postgres is Azure Database for PostgreSQL Flexible Server.
  # ADR-053: stopped last in the evening, started first in the morning.
  PG_FLEX_NAME: mvhd-pg-b53a0449

jobs:
  determine-action:
    name: Determine Action
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      action: ${{ steps.decide.outputs.action }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 5 * * 1-5" ]; then
            # Skip the morning scale-up on Berlin public holidays — otherwise a
            # weekday holiday (e.g. Ostermontag, Christi Himmelfahrt) would run
            # the full stack 07:00–20:00 for nobody. subdiv='BE' = Land Berlin
            # (includes Internationaler Frauentag, which most states lack).
            # The evening stop cron still runs, so the stack stays at 0.
            TODAY=$(TZ=Europe/Berlin date +%F)
            python3 -m pip install --quiet holidays
            HOL=$(python3 -c "import holidays, datetime as t; print(1 if t.date.fromisoformat('$TODAY') in holidays.Germany(subdiv='BE') else 0)")
            if [ "$HOL" = "1" ]; then
              echo "Berlin public holiday ($TODAY) — skipping scale-up"
              echo "action=noop" >> "$GITHUB_OUTPUT"
            else
              echo "action=start" >> "$GITHUB_OUTPUT"
            fi
          else
            # A date on the keep-up list skips the evening stop: the stack
            # stays up until the next scheduled stop, which is the following
            # evening. A manual "stop" dispatch still works on such a day.
            #
            # LIVE_DEMO_HOLD_UNTIL, a repository variable, does the same for a
            # working session at night or at the weekend without a commit:
            #   gh variable set LIVE_DEMO_HOLD_UNTIL --body 2026-10-10T22:00Z
            # Every stop before that instant is skipped. See
            # docs/knowledge/runbooks/live-demo-off-hours.md.
            TODAY=$(TZ=Europe/Berlin date +%F)
            HOLD_UNTIL="${{ vars.LIVE_DEMO_HOLD_UNTIL }}"
            if [ -n "$HOLD_UNTIL" ] && HOLD_TS=$(date -u -d "$HOLD_UNTIL" +%s 2>/dev/null) &&
               [ "$(date -u +%s)" -lt "$HOLD_TS" ]; then
              echo "Held until $HOLD_UNTIL (LIVE_DEMO_HOLD_UNTIL) — skipping the stop"
              echo "action=noop" >> "$GITHUB_OUTPUT"
            elif [[ " $KEEP_UP_DATES " == *" $TODAY "* ]]; then
              echo "Keep-up date ($TODAY) — skipping the evening stop"
              echo "action=noop" >> "$GITHUB_OUTPUT"
            else
              echo "action=stop" >> "$GITHUB_OUTPUT"
            fi
          fi

  stop:
    name: Stop Everything
    needs: determine-action
    if: needs.determine-action.outputs.action == 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # ADR-053: every Container App except the UI, and the database after
      # them. Keycloak, Vault, the federation gateway and the old Postgres
      # container stopped running overnight on 2026-10-04; until then they
      # were kept up (ADR-042, ADR-047), see the ADR for what that costs.
      BACKEND_APPS: >-
        mvhd-catalog-enricher mvhd-neo4j-proxy mvhd-neo4j
        mvhd-cfm-obagent mvhd-cfm-regagent mvhd-cfm-edcvagent mvhd-cfm-kcagent
        mvhd-cfm-cp-shim
        mvhd-provision-mgr mvhd-tenant-mgr mvhd-issuerservice mvhd-identityhub
        mvhd-dp-omop mvhd-dp-fhir mvhd-controlplane
        mvhd-nats mvhd-claude-federation mvhd-keycloak mvhd-vault
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # First, so no visitor reaches a page whose backend is going away. The UI
      # is the one app that stays reachable: at min=0 a visitor wakes it, it
      # answers every page with the offline notice and every data route with a
      # 503 (ui/src/lib/offline-mode.ts), and it scales back to zero after the
      # cooldown. One update, so one new revision, carries the flag and the
      # scale together.
      - name: Put the UI into offline mode
        run: |
          az containerapp update \
            --name mvhd-ui --resource-group "$RESOURCE_GROUP" \
            --min-replicas 0 --max-replicas 1 \
            --set-env-vars LIVE_DEMO_OFFLINE=true \
            -o none
          flag=$(az containerapp show --name mvhd-ui \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='LIVE_DEMO_OFFLINE'].value | [0]" -o tsv)
          min=$(az containerapp show --name mvhd-ui \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.scale.minReplicas" -o tsv)
          if [ "$flag" != "true" ] || [ "$min" != "0" ]; then
            echo "::error::mvhd-ui LIVE_DEMO_OFFLINE=$flag minReplicas=$min (expected true, 0)"
            exit 1
          fi
          echo "mvhd-ui is in offline mode at min=0."

      # A stop, not min=0. Scale-to-zero only reaches zero for an app nobody
      # calls, and here nearly everything is called by something: the EDC
      # services poll Vault, the enricher holds a NATS connection, the crawler
      # reached Neo4j and the UI every five minutes. That is why nights and
      # weekends billed about as much as office hours (PR #482). A stopped app
      # has no replica whatever calls it, and keeps its revision and scale, so
      # the start brings back exactly this. Consumers first, dependencies last.
      - name: Stop every other Container App
        run: |
          # shellcheck disable=SC2086 # BACKEND_APPS is a word list
          ./scripts/azure/set-app-power.sh stop $BACKEND_APPS

      # Last, because Keycloak, Vault and the EDC services hold connections to
      # it until they stop. Azure starts a stopped Flexible Server by itself
      # after seven days; the longest off period here is a long weekend.
      - name: Stop the database
        run: |
          state=$(az postgres flexible-server show --name "$PG_FLEX_NAME" \
            --resource-group "$RESOURCE_GROUP" --query state -o tsv)
          echo "  $PG_FLEX_NAME: $state"
          if [ "$state" = "Ready" ]; then
            az postgres flexible-server stop --name "$PG_FLEX_NAME" \
              --resource-group "$RESOURCE_GROUP" -o none
          fi
          state=$(az postgres flexible-server show --name "$PG_FLEX_NAME" \
            --resource-group "$RESOURCE_GROUP" --query state -o tsv)
          if [ "$state" != "Stopped" ]; then
            echo "::error::$PG_FLEX_NAME is '$state' after the stop (expected Stopped)"
            exit 1
          fi
          echo "$PG_FLEX_NAME stopped."

      - name: Stop summary
        if: always()
        run: |
          {
            echo "## Off-Hours Stop (ADR-053)"
            echo ""
            echo "**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**UI:** offline notice, min=0, links the static site"
            echo "**Stopped:** $(echo "$BACKEND_APPS" | wc -w) Container Apps and $PG_FLEX_NAME"
            echo "**Next start:** Monday-Friday 05:00 UTC, except Berlin public holidays"
          } >> "$GITHUB_STEP_SUMMARY"

  start:
    name: Scale Up (Start)
    needs: determine-action
    if: needs.determine-action.outputs.action == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Needed for scripts/azure/restore-keycloak-realm.sh and the realm file
      # it imports. The stop job needs no checkout and does not have one.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start Postgres first
        run: |
          # Keycloak, Vault (ADR-046) and the EDC services crash-loop if their
          # database is unavailable on boot. The evening stop stops the
          # Flexible Server last (ADR-053), so it is started here before any
          # app, and nothing else starts until it is Ready: a stack without
          # its database is better left showing the offline notice.
          state=$(az postgres flexible-server show --name "$PG_FLEX_NAME" \
            --resource-group "$RESOURCE_GROUP" --query state -o tsv 2>/dev/null || echo "unknown")
          echo "  $PG_FLEX_NAME: $state"
          if [ "$state" = "Stopped" ]; then
            az postgres flexible-server start --name "$PG_FLEX_NAME" \
              --resource-group "$RESOURCE_GROUP" -o none
          fi
          for _ in $(seq 1 30); do
            state=$(az postgres flexible-server show --name "$PG_FLEX_NAME" \
              --resource-group "$RESOURCE_GROUP" --query state -o tsv 2>/dev/null || echo "unknown")
            [ "$state" = "Ready" ] && break
            sleep 10
          done
          if [ "$state" != "Ready" ]; then
            echo "::error::$PG_FLEX_NAME is '$state', not Ready; the stack stays offline"
            exit 1
          fi
          echo "$PG_FLEX_NAME is Ready."

      # Before any app starts. A start brings back every active revision, and
      # an old one without traffic still runs replicas: on 2026-10-04 an old
      # mvhd-neo4j revision held the store lock, so the one with the traffic
      # crash-looped and the graph was down, and two April data-plane
      # revisions billed two replicas each. Not fatal: a stack that starts
      # with a stale revision is what ran before this step existed.
      - name: Retire revisions that serve nothing
        run: |
          ./scripts/azure/retire-stale-revisions.sh ||
            echo "::warning::A stale revision could not be deactivated, see above"

      - name: Restore Container App scale profiles
        run: |
          # The evening stop stops these (ADR-053); a stop keeps their scale,
          # so the updates below are a safety net, not what brings them up.
          # Vault and Keycloak need Postgres, which is Ready by now.
          ./scripts/azure/set-app-power.sh start \
            mvhd-vault mvhd-keycloak mvhd-claude-federation \
            mvhd-neo4j mvhd-nats mvhd-neo4j-proxy mvhd-catalog-enricher ||
            echo "::warning::Not every core app reported running, see above"
          echo "=== Restoring Container App replica profiles ==="
          # min=1 max=1 (singleton stateful / small services)
          for app in mvhd-neo4j mvhd-keycloak mvhd-vault mvhd-catalog-enricher \
                     mvhd-claude-federation; do
            echo "  $app -> 1/1"
            az containerapp update \
              --name "$app" --resource-group "$RESOURCE_GROUP" \
              --min-replicas 1 --max-replicas 1 \
              -o none || echo "::warning::Failed to scale $app"
          done
          # A scale change is a template change, so the update above can make a
          # new Neo4j revision, after "Retire revisions that serve nothing" ran.
          # The old one would keep the store lock (docs/gotchas.md, 2026-10-04).
          ./scripts/azure/retire-stale-revisions.sh mvhd-neo4j ||
            echo "::warning::A stale mvhd-neo4j revision could not be deactivated, see above"
          # min=1 max=2 (auto-scalable read services)
          for app in mvhd-neo4j-proxy; do
            echo "  $app -> 1/2"
            az containerapp update \
              --name "$app" --resource-group "$RESOURCE_GROUP" \
              --min-replicas 1 --max-replicas 2 \
              -o none || echo "::warning::Failed to scale $app"
          done
          # The UI leaves offline mode last, in "Take the UI out of offline
          # mode", once everything it reads is up.
          # NATS — started here with the core apps so JetStream is ready
          # before the EDC controlplane comes up in the next step.
          echo "  mvhd-nats -> 1/1"
          az containerapp update \
            --name mvhd-nats --resource-group "$RESOURCE_GROUP" \
            --min-replicas 1 --max-replicas 1 \
            -o none || echo "::warning::Failed to scale mvhd-nats"
          # The 7 remaining EDC apps (controlplane, data planes, identity hub,
          # issuer service, CFM tenant/provision managers) are restored after
          # the stateful wait below — see "Restore EDC stack" (ADR-024/027).

      - name: Wait for stateful services to be reachable
        run: |
          echo "Waiting 75s for Neo4j + Vault pods to start..."
          sleep 75

      # The `edcv` realm does not survive this stop/start cycle. It has gone
      # missing twice on 2026-09-14 alone: once found during demo prep, and
      # again within minutes of the stack restarting after a deploy. Keycloak
      # is configured with KC_DB=postgres, so it is meant to persist, and why
      # it does not is still open. Until that is answered, the realm is checked
      # and re-imported on every start, because the failure mode is that every
      # sign-in on the live UI breaks and nothing says so until someone tries.
      # continue-on-error: a realm that cannot be restored must not stop the
      # rest of the start. The first run of this step failed on a Key Vault
      # permission and took the EDC stack, the Vault bootstrap and the UI
      # verification down with it, which is a worse outage than the one it was
      # added to fix. It still annotates loudly, because a silent failure here
      # means every sign-in is broken and nothing says so.
      - name: Ensure the Keycloak realm exists (gotcha, see runbook)
        continue-on-error: true
        env:
          KEYCLOAK_PUBLIC_HOSTNAME: auth.ehds.mabu.red
        run: |
          echo "Waiting for Keycloak to answer..."
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://${KEYCLOAK_PUBLIC_HOSTNAME}/realms/master/.well-known/openid-configuration" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          if ! ./scripts/azure/restore-keycloak-realm.sh; then
            echo "::error::Keycloak realm could not be restored, so every sign-in on ${KEYCLOAK_PUBLIC_HOSTNAME} will fail. If this is a Key Vault permission, grant the CI service principal the 'Key Vault Secrets User' role on the vault holding keycloak-admin-password."
            exit 1
          fi

      - name: Restore EDC stack (ADR-024)
        run: |
          # ADR-024 provisions the full EDC stack at min=1 during work hours;
          # ADR-027 scales it to 0 off-hours. Postgres (started first) and
          # NATS (started with the core apps) are reachable by now. The
          # controlplane needs both; the data planes, identity hub, issuer
          # service and CFM managers need Postgres.
          ./scripts/azure/set-app-power.sh start \
            mvhd-controlplane mvhd-dp-fhir mvhd-dp-omop \
            mvhd-identityhub mvhd-issuerservice \
            mvhd-tenant-mgr mvhd-provision-mgr ||
            echo "::warning::Not every EDC app reported running, see above"
          echo "=== Restoring 7 EDC Container Apps to 1/1 ==="
          for app in mvhd-controlplane mvhd-dp-fhir mvhd-dp-omop \
                     mvhd-identityhub mvhd-issuerservice \
                     mvhd-tenant-mgr mvhd-provision-mgr; do
            echo "  $app -> 1/1"
            az containerapp update \
              --name "$app" --resource-group "$RESOURCE_GROUP" \
              --min-replicas 1 --max-replicas 1 \
              -o none || echo "::warning::Failed to scale $app"
          done

      # The CFM provisioning agents and the shim they reach the control plane
      # through (#318). They were deployed on 2026-09-29 and added to neither
      # list here, so the evening stop left them running and no morning start
      # ever restored them.
      #
      # min=1 is not a preference. The four agents are NATS consumers with no
      # HTTP ingress, so nothing can wake them from zero: no request arrives
      # to trigger a scaler, and a participant onboarded while they are at
      # zero keeps all three activities pending for ever, which is the whole
      # of #318. They start after the EDC stack because the EDC-V agent wants
      # the identity hub and the control plane, and last of all so a slow
      # upstream does not leave an agent looping on a refused connection.
      - name: Restore CFM provisioning agents (#318)
        run: |
          ./scripts/azure/set-app-power.sh start \
            mvhd-cfm-cp-shim mvhd-cfm-kcagent mvhd-cfm-edcvagent \
            mvhd-cfm-regagent mvhd-cfm-obagent ||
            echo "::warning::Not every CFM app reported running, see above"
          echo "=== Restoring the shim and 4 CFM agents to 1/1 ==="
          for app in mvhd-cfm-cp-shim mvhd-cfm-kcagent mvhd-cfm-edcvagent \
                     mvhd-cfm-regagent mvhd-cfm-obagent; do
            echo "  $app -> 1/1"
            az containerapp update \
              --name "$app" --resource-group "$RESOURCE_GROUP" \
              --min-replicas 1 --max-replicas 1 \
              -o none || echo "::warning::Failed to scale $app"
          done

      - name: Re-bootstrap Vault (in-memory gotcha #1)
        run: |
          echo "=== Re-running bootstrap job (Vault secrets + keys) ==="
          az containerapp job start \
            --name mvhd-vault-bootstrap --resource-group "$RESOURCE_GROUP" \
            -o none || echo "::warning::Vault bootstrap job start failed"

      # Neo4j is now persistent on Azure Files (ADR-017). The seed job is no
      # longer required on every start — data survives the 0/0 → 1/1 cycle.
      # If the database is empty (fresh storage account) the one-time bootstrap
      # workflow `bootstrap-stateful.yml` should be run manually instead.

      # Last of the scale-ups, so a visitor sees the offline notice until
      # the stack behind the pages is up rather than a page of errors.
      - name: Take the UI out of offline mode
        run: |
          az containerapp update \
            --name mvhd-ui --resource-group "$RESOURCE_GROUP" \
            --min-replicas 1 --max-replicas 3 \
            --set-env-vars LIVE_DEMO_OFFLINE=false \
            -o none
          flag=$(az containerapp show --name mvhd-ui \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='LIVE_DEMO_OFFLINE'].value | [0]" -o tsv)
          if [ "$flag" != "false" ]; then
            echo "::error::mvhd-ui LIVE_DEMO_OFFLINE=$flag after the start (expected false)"
            exit 1
          fi

      - name: Verify UI is reachable
        id: verify
        run: |
          UI_FQDN=$(az containerapp show --name mvhd-ui \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "ui_url=https://${UI_FQDN}" >> "$GITHUB_OUTPUT"
          echo "Checking https://${UI_FQDN}..."
          for i in $(seq 1 30); do
            code=$(curl -sf -o /dev/null -w "%{http_code}" "https://${UI_FQDN}" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "UI is healthy (HTTP 200) after $((i * 10))s"
              exit 0
            fi
            echo "  attempt $i: HTTP $code"
            sleep 10
          done
          echo "::warning::UI did not return 200 within 300s — may need manual check"

      # The one step in this job that is allowed to fail the run.
      #
      # On 2026-09-30 the start job was green while every sign-in on the live
      # UI returned 500 and had done for over an hour. Three things hid it:
      # "Ensure the Keycloak realm exists" is continue-on-error, so its
      # failure is reported as `conclusion: success`; the script it calls read
      # discovery, which Keycloak serves from cache with the `realm` table
      # gone; and "Verify UI is reachable" only asks for the home page, which
      # renders fine when nobody can log in.
      #
      # This runs last and deliberately carries no continue-on-error. A stack
      # that cannot serve a login is not started, whatever the other steps
      # said, and the run must be red so someone looks. Exit 2 means Postgres,
      # not the realm: see docs/gotchas.md, 2026-09-30.
      - name: Keycloak can actually serve a login
        env:
          KEYCLOAK_PUBLIC_URL: https://auth.ehds.mabu.red
        run: ./scripts/azure/check-keycloak-health.sh "$KEYCLOAK_PUBLIC_URL" edcv

      - name: Start summary
        if: always()
        run: |
          {
            echo "## On-Hours Start"
            echo ""
            echo "**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Target:** ${{ steps.verify.outputs.ui_url }}"
            echo "**Status:** PostgreSQL started, 21 Container Apps started (8 core + 7 EDC + 5 CFM + UI), UI out of offline mode, Vault re-bootstrapped (ADR-053)"
            echo "**Next stop:** 18:00 UTC, unless LIVE_DEMO_HOLD_UNTIL is later (runbook live-demo-off-hours.md)"
          } >> "$GITHUB_STEP_SUMMARY"
