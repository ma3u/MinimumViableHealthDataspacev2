name: Security Scan (SBOM + CVE)

# Why this exists, on top of the existing `dependency-audit` job in test.yml:
#
#   * `npm audit` only sees npm packages. It cannot see Keycloak, Postgres,
#     Neo4j, NATS, Traefik, Vault, or the JAD/EDC images — which is most of the
#     attack surface in this stack.
#   * Dependabot reads Dockerfile FROM lines, not docker-compose*.yml, so the
#     infrastructure images pinned in compose are invisible to it too.
#
# This workflow closes both gaps: it produces a CycloneDX SBOM for the source
# trees and scans the container images from the compose files, publishing
# results to the GitHub Security tab.

on:
  schedule:
    # Monday 04:30 UTC — before the 05:15 demo reset, so a bad image is known
    # before the environment is rebuilt on it.
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      fail_on_severity:
        description: "Fail the run at this severity or above"
        type: choice
        options: [none, critical, high]
        default: none
  pull_request:
    paths:
      - "ui/package*.json"
      - "services/*/package*.json"
      - "**/Dockerfile"
      - "docker-compose*.yml"
      - ".github/workflows/security-scan.yml"

permissions:
  contents: read
  security-events: write
  id-token: write # Azure OIDC, for scanning the images actually deployed

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Source dependencies: SBOM + CVE ──
  source-sbom:
    name: Source SBOM & CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui
            path: ui
          - name: neo4j-proxy
            path: services/neo4j-proxy
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ matrix.path }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.name }}.cdx.json
          output-file: sbom-${{ matrix.name }}.cdx.json

      - name: Scan SBOM for vulnerabilities
        id: grype
        uses: anchore/scan-action@v6
        with:
          sbom: sbom-${{ matrix.name }}.cdx.json
          output-format: sarif
          # Report everything; gating is the explicit job below, so a new CVE
          # never silently turns the whole pipeline red mid-sprint.
          fail-build: false
          severity-cutoff: low

      - name: Upload SARIF to the Security tab
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-${{ matrix.name }}

  # ── Infrastructure images from docker-compose ──
  image-scan:
    name: Image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Kept in step with docker-compose*.yml — scripts/check-image-scan-coverage.sh
        # fails the build if an image is added there and not here. These are the
        # images npm audit and Dependabot cannot reach. ghcr.io/ma3u/* images are
        # omitted: they are built from this repo and covered by the source scan.
        image:
          - quay.io/keycloak/keycloak:26.6.4
          - postgres:17.7-alpine
          - neo4j:5.26.28-community
          - nats:2.14.3-alpine
          - traefik:v3.4
          - hashicorp/vault:2.0
          - curlimages/curl:8.21.0
          # JAD / EDC stack — tagged by upstream git SHA, not digest-pinned, so
          # the tag can move and these genuinely need scanning.
          - ghcr.io/metaform/jad/controlplane:4a7e5bd096c58814748e956cc9329586ad309698
          - ghcr.io/metaform/jad/dataplane:4a7e5bd096c58814748e956cc9329586ad309698
          - ghcr.io/metaform/jad/identity-hub:4a7e5bd096c58814748e956cc9329586ad309698
          - ghcr.io/metaform/jad/issuerservice:4a7e5bd096c58814748e956cc9329586ad309698
    steps:
      # Two runs on purpose, because the Security tab and a human reviewer want
      # different things from the same scan.
      #
      # CRITICAL-only goes to the Security tab. The first full HIGH+ upload put
      # 2,235 alerts there in one run — 872 from the neo4j image alone — which
      # buried the 9 source findings that a person could actually act on. Those
      # thousands are not thousands of actions: a third-party base image we do
      # not build has exactly one remediation, "move to a newer tag". Counting
      # them per-CVE in an alert list misrepresents that as a backlog.
      - name: Scan ${{ matrix.image }} — CRITICAL, for the Security tab
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # HIGH+ still gets measured — it just lands in the run summary instead of
      # the alert list, so the counts stay reviewable without drowning the tab.
      # Not an artifact: actions/upload-artifact@v4 needs `actions: write`, and
      # widening permissions on the security workflow is not worth it when the
      # summary already carries the same table (it returned 403 FinalizeArtifact
      # on the run that tried).
      - name: Scan ${{ matrix.image }} — CRITICAL,HIGH, for the run summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          output: trivy-table.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Derive a SARIF category
        id: cat
        run: echo "name=$(echo '${{ matrix.image }}' | tr '/:.' '___')" >> "$GITHUB_OUTPUT"

      - name: Publish counts to the run summary
        if: always() && hashFiles('trivy-table.txt') != ''
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo '```'
            head -c 60000 trivy-table.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to the Security tab
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ steps.cat.outputs.name }}

  # ── Images actually running on Azure ──
  # The matrix above scans what docker-compose *declares*. That is not what the
  # deployed environment runs: on 2026-09-08 compose pinned
  # ghcr.io/metaform/jad/controlplane:4a7e5bd while ACA ran
  # acrmvhdehds.azurecr.io/jad-controlplane:latest, an image built 2026-04-14.
  # Scanning only the compose list would report on images nobody is running.
  #
  # This job resolves the live image list from ACA at run time, so it cannot
  # drift and needs no maintenance when a deployment changes.
  deployed-image-scan:
    name: Deployed image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Azure OIDC only: the app registration has a single federated credential,
    # subject `repo:ma3u/MinimumViableHealthDataspacev2:ref:refs/heads/main`.
    # A pull_request run presents subject `...:pull_request` and a dispatch from
    # a topic branch presents that branch's ref, so `azure/login` fails for both.
    # Scheduled runs use the default branch and do match. Widening this needs a
    # new federated credential, not a workflow change.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployed images
        id: images
        run: |
          az containerapp list -g rg-mvhd-dev \
            --query "[].properties.template.containers[0].image" -o tsv \
            | sort -u > deployed-images.txt
          echo "Deployed images:"
          sed 's/^/  /' deployed-images.txt
          {
            echo "## Deployed images"
            echo ""
            echo '```'
            cat deployed-images.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ACR login
        run: az acr login --name acrmvhdehds

      - name: Install Trivy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Scan each deployed image
        run: |
          mkdir -p trivy-out
          fail=0
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            safe=$(echo "$img" | tr '/:.' '___')
            echo "::group::$img"
            # Keep going on a single image failure — one unpullable image must
            # not hide the results for every other image.
            trivy image --quiet --scanners vuln --severity CRITICAL,HIGH \
              --ignore-unfixed --format table "$img" || fail=1
            # CRITICAL only in SARIF — see the rationale on the image-scan job.
            trivy image --quiet --scanners vuln --severity CRITICAL \
              --ignore-unfixed --format sarif -o "trivy-out/${safe}.sarif" "$img" || fail=1
            echo "::endgroup::"
          done < deployed-images.txt
          [ "$fail" -eq 0 ] || echo "::warning::at least one deployed image could not be scanned"

      - name: Upload deployed-image SARIF
        if: always() && hashFiles('trivy-out/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-out
          category: trivy-deployed

  # ── Explicit gate ──
  # Separate from the scans so the reporting jobs always publish to the Security
  # tab even when the gate fails, and so the gate can be tightened without
  # touching scan configuration.
  gate:
    name: Severity gate
    needs: [source-sbom, image-scan, deployed-image-scan]
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.fail_on_severity != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on ${{ github.event.inputs.fail_on_severity }}+
        uses: anchore/scan-action@v6
        with:
          path: ui
          fail-build: true
          severity-cutoff: ${{ github.event.inputs.fail_on_severity }}

  summary:
    name: Summary
    needs: [source-sbom, image-scan, deployed-image-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## Security scan"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Source SBOM & CVEs | ${{ needs.source-sbom.result }} |"
            echo "| Declared image CVEs | ${{ needs.image-scan.result }} |"
            echo "| Deployed image CVEs | ${{ needs.deployed-image-scan.result }} |"
            echo ""
            echo "Findings are in the **Security → Code scanning** tab, grouped by"
            echo "\`grype-*\` (source) and \`trivy-*\` (images) categories."
            echo ""
            echo "SBOMs are attached to this run as artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
