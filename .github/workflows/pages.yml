name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  # A finished night publishes its reports straight away, not with the next
  # push to main, which can be a day or more later.
  workflow_run:
    workflows: ["Nightly"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # the site job fetches the last test run's reports artifact

# The site is built and published here (about 3 minutes). The tests that
# used to run beside it (unit tests with coverage, Playwright, the WCAG audit
# and the security tests) run once a night in nightly.yml (ADR-074, #847) and
# store their reports as the pages-test-reports artifact. Until 2026-10-03
# they ran before the site was built, so a change waited 24 minutes for a
# 6-second publish; until 2026-11-03 they ran beside it on every push.
#
# The reports on the site (/test-reports, /e2e-report, /ci-e2e-report) are
# therefore the ones from the last nightly run. A finished nightly run deploys
# the site again (workflow_run), so they appear when the night ends. Until
# 2026-11-08 they waited for the next push, and /e2e-report/ answered 404 the
# day #969 removed the committed copy.
#
# Concurrency is per job. Site builds are cancelled by a newer push; deploys
# run one at a time.

jobs:
  site:
    # A cancelled night leaves no new reports to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: "pages-site"
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ./ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./ui/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ui/.next/cache
          key: nextjs-site-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/src/**', 'ui/public/**') }}
          restore-keys: nextjs-site-${{ hashFiles('ui/package-lock.json') }}-

      # The static site serves the fixtures committed in ui/public/mock/. A
      # step here used to seed a Neo4j, build and start the server and run
      # scripts/refresh-mocks.sh against it, about 220 s of every deploy. Since
      # every API route needs a session (ADR-044, 2026-10-02) each of its 38
      # requests answered 401 and the step wrote nothing. Refresh fixtures by
      # hand against a stack you are signed in to (see the script).
      # --- Static Export for Pages ---
      - name: Disable API routes for static export
        run: mv src/app/api /tmp/api_disabled || true

      # npm run build: its prebuild writes the site search index into
      # public/pagefind/ (ADR-082), which the export copies to the site.
      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "true"

      # The reports of the most recent finished nightly run on the branch
      # being built (main, for every real deploy), so a test run on another
      # branch never reaches the site. Missing on the very first run, and then the
      # site goes out without them rather than not at all.
      - name: Add the latest test reports
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=pages-test-reports&per_page=50" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$BRANCH\")][0].workflow_run.id // empty" 2>/dev/null || true)
          if [ -z "$run_id" ]; then
            echo "::notice::No pages-test-reports artifact yet; publishing without test reports."
            exit 0
          fi
          echo "Using the test reports of run $run_id"
          # Into a scratch directory first: gh will not overwrite, and the
          # static export already holds public/test-reports/test-results.json.
          gh run download "$run_id" --repo "${{ github.repository }}" --name pages-test-reports --dir "$RUNNER_TEMP/test-reports"
          cp -r "$RUNNER_TEMP/test-reports/." out/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./ui/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: site
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
