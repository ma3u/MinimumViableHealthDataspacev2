name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # the site job fetches the last test run's reports artifact

# The site is built and published here (about 6 minutes). The tests that
# used to run beside it (unit tests with coverage, Playwright, the WCAG audit
# and the security tests) run once a night in nightly.yml (ADR-074, #847) and
# store their reports as the pages-test-reports artifact. Until 2026-10-03
# they ran before the site was built, so a change waited 24 minutes for a
# 6-second publish; until 2026-11-03 they ran beside it on every push.
#
# The reports on the site (/test-reports, /ci-e2e-report) are therefore the
# ones from the last nightly run, at most a day behind the site.
#
# Concurrency is per job. Site builds are cancelled by a newer push; deploys
# run one at a time.

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: "pages-site"
      cancel-in-progress: true
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/healthdataspace
          NEO4J_PLUGINS: "[]"
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p healthdataspace 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./ui/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ui/.next/cache
          key: nextjs-site-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/src/**', 'ui/public/**') }}
          restore-keys: nextjs-site-${{ hashFiles('ui/package-lock.json') }}-

      # ── Seed Neo4j and refresh mock fixtures ─────────────────────
      - name: Install cypher-shell
        working-directory: .
        run: |
          wget -q https://dist.neo4j.org/cypher-shell/cypher-shell-5.26.0.zip -O /tmp/cs.zip
          unzip -q /tmp/cs.zip -d /tmp/cs
          echo "/tmp/cs/cypher-shell-5.26.0/bin" >> "$GITHUB_PATH"

      - name: Seed Neo4j with schema and synthetic data
        working-directory: .
        run: |
          cypher-shell -u neo4j -p healthdataspace -a bolt://localhost:7687 < neo4j/init-schema.cypher
          cypher-shell -u neo4j -p healthdataspace -a bolt://localhost:7687 < neo4j/insert-synthetic-schema-data.cypher

      - name: Start Next.js server for mock generation
        run: |
          npx next build
          npx next start -p 3000 &
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/graph > /dev/null 2>&1 && break
            sleep 2
          done
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "false"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: healthdataspace
          NEXTAUTH_SECRET: ci-mock-generation
          NEXTAUTH_URL: http://localhost:3000

      - name: Refresh mock fixtures from live API
        working-directory: .
        run: ./scripts/refresh-mocks.sh http://localhost:3000

      - name: Stop Next.js server
        run: |
          # Kill anything still bound to :3000 — lsof alone is unreliable in CI.
          pkill -f "next-server" 2>/dev/null || true
          pkill -f "next start" 2>/dev/null || true
          fuser -k 3000/tcp 2>/dev/null || true
          lsof -t -i:3000 2>/dev/null | xargs -r kill -9 2>/dev/null || true

      # --- Static Export for Pages ---
      - name: Disable API routes for static export
        run: mv src/app/api /tmp/api_disabled || true

      - name: Build with Next.js
        run: npx next build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "true"

      # The reports of the most recent finished nightly run on the branch
      # being built (main, for every real deploy), so a test run on another
      # branch never reaches the site. Missing on the very first run, and then the
      # site goes out without them rather than not at all.
      - name: Add the latest test reports
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=pages-test-reports&per_page=50" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$BRANCH\")][0].workflow_run.id // empty" 2>/dev/null || true)
          if [ -z "$run_id" ]; then
            echo "::notice::No pages-test-reports artifact yet; publishing without test reports."
            exit 0
          fi
          echo "Using the test reports of run $run_id"
          # Into a scratch directory first: gh will not overwrite, and the
          # static export already holds public/test-reports/test-results.json.
          gh run download "$run_id" --repo "${{ github.repository }}" --name pages-test-reports --dir "$RUNNER_TEMP/test-reports"
          cp -r "$RUNNER_TEMP/test-reports/." out/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./ui/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: site
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
