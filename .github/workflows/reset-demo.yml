name: Weekly Demo Reset

on:
  # SCHEDULE DISABLED 2026-09-13. The stack stopped being a demo that could be
  # rebuilt at will: it now carries the Keycloak realm `edcv` with the
  # `meinbefund-ios` client and real user accounts (ADR-034), and the quota
  # counter that bounds paid inference (ADR-035). A weekly re-import of the
  # realm would delete the client the iPhone signs in with, and the app would
  # simply stop working every Monday morning with no failing test to say why.
  #
  # ADR-014 chose a weekly reset because drift in synthetic demo data was the
  # main risk. That reasoning has not changed for the demo data; what changed is
  # that state a person depends on now lives in the same cluster. Re-enable
  # only once the identity realm and the quota table are outside the blast
  # radius of this workflow.
  #
  #   schedule:
  #     - cron: "15 5 * * 1"   # Monday 05:15 UTC
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip post-reset smoke tests"
        type: boolean
        default: false
      force_reset:
        description: "Force full reset even if databases are clean"
        type: boolean
        default: false
      wipe_realm:
        description: "DESTRUCTIVE: delete and re-import the edcv realm, losing every client and user not in jad/keycloak-realm.json (meinbefund-ios, real accounts)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: "azure-reset"
  cancel-in-progress: false

env:
  ACR_NAME: acrmvhdehds
  ACR_LOGIN_SERVER: acrmvhdehds.azurecr.io
  RESOURCE_GROUP: rg-mvhd-dev
  ACA_ENV: mvhd-env

jobs:
  # ── Pre-flight: check if databases have user-created data ──
  check-dirty:
    name: Check if Reset Needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_reset: ${{ steps.check.outputs.needs_reset }}
      neo4j_dirty: ${{ steps.check.outputs.neo4j_dirty }}
      keycloak_realm: ${{ steps.check.outputs.keycloak_realm }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check database state
        id: check
        run: |
          # Force reset if manually requested
          if [ "${{ inputs.force_reset }}" = "true" ]; then
            echo "needs_reset=true" >> "$GITHUB_OUTPUT"
            echo "reason=Manual force reset requested" >> "$GITHUB_OUTPUT"
            echo "neo4j_dirty=unknown" >> "$GITHUB_OUTPUT"
            echo "keycloak_realm=unchecked" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Keycloak realm health ──
          # This check exists because "clean" is not the same as "healthy".
          # The dirty check used to look only at Neo4j, so on 2026-09-07 the
          # scheduled run found Neo4j clean, skipped reset-environment, and
          # therefore skipped Step 1b (the edcv realm re-import) — while the
          # realm was in fact missing after a Postgres replica replacement.
          # Every login served Keycloak's "Page not found" for a full day and
          # the only signal was a red smoke-test job. A missing realm is now
          # itself a reset trigger.
          KC_FQDN=$(az containerapp show --name mvhd-keycloak \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -n "$KC_FQDN" ]; then
            REALM_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${KC_FQDN}/realms/edcv/.well-known/openid-configuration" \
              2>/dev/null || echo "000")
            echo "Keycloak edcv realm: HTTP $REALM_CODE"
            echo "keycloak_realm=$REALM_CODE" >> "$GITHUB_OUTPUT"

            if [ "$REALM_CODE" != "200" ]; then
              echo "needs_reset=true" >> "$GITHUB_OUTPUT"
              echo "reason=Keycloak edcv realm unhealthy (HTTP $REALM_CODE) — logins are broken" >> "$GITHUB_OUTPUT"
              echo "neo4j_dirty=not-checked" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "keycloak_realm=unreachable" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not resolve mvhd-keycloak FQDN — skipping realm probe"
          fi

          # ── Neo4j dirty count ──
          # This used to POST to https://<neo4j-fqdn>:7474/db/neo4j/tx/commit.
          # mvhd-neo4j has TCP ingress on 7687 and nothing else, and the
          # ingress is internal, so the request could not succeed from a
          # runner on any port. Worse, it did not fail loudly: the pipeline's
          # exit status was jq's, jq exits 0 on empty stdin, the `|| echo -1`
          # fallback never fired, and the empty string fell through every
          # branch into "Databases are clean". The check reported clean on a
          # query that never ran, and the reset was skipped (run 34086755885,
          # 2026-09-07). Issue #304.
          #
          # neo4j-dirty-check.sh runs the query inside the environment as a
          # one-shot ACA job over Bolt and exits 0 for clean, 1 for dirty or
          # unknown. Unknown counts as dirty, which is the fail-closed bias
          # the old code intended and never had.
          set +e
          DIRTY_OUT=$(./scripts/azure/neo4j-dirty-check.sh)
          DIRTY_RC=$?
          set -e
          echo "$DIRTY_OUT"

          DIRTY_COUNT=$(printf '%s\n' "$DIRTY_OUT" | sed -n 's/^dirty_count=//p' | head -1)
          DIRTY_REASON=$(printf '%s\n' "$DIRTY_OUT" | sed -n 's/^reason=//p' | head -1)
          echo "neo4j_dirty=${DIRTY_COUNT:-unknown}" >> "$GITHUB_OUTPUT"

          if [ "$DIRTY_RC" = "0" ]; then
            echo "needs_reset=false" >> "$GITHUB_OUTPUT"
            echo "reason=${DIRTY_REASON:-Databases are clean}" >> "$GITHUB_OUTPUT"
          else
            echo "needs_reset=true" >> "$GITHUB_OUTPUT"
            echo "reason=${DIRTY_REASON:-Neo4j state could not be established, assuming dirty}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dirty-check summary
        if: always()
        run: |
          echo "## Pre-Reset Dirty Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Needs reset:** ${{ steps.check.outputs.needs_reset }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Neo4j dirty nodes:** ${{ steps.check.outputs.neo4j_dirty }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Keycloak edcv realm:** ${{ steps.check.outputs.keycloak_realm }} (200 = healthy)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Reason:** ${{ steps.check.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  reset-environment:
    name: Reset Demo Environment
    needs: check-dirty
    if: needs.check-dirty.outputs.needs_reset == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Step 1: Restart stateful services to clear runtime state ──
      - name: Restart stateful services
        run: |
          echo "=== Restarting stateful services ==="
          for app in mvhd-neo4j mvhd-postgres mvhd-vault mvhd-keycloak; do
            echo "Restarting $app..."
            az containerapp revision restart \
              --name "$app" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --revision "$(az containerapp revision list --name "$app" \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --query "[0].name" -o tsv)" 2>/dev/null || \
            az containerapp update --name "$app" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --set-env-vars "RESET_TRIGGER=$(date +%s)=secretref:reset-trigger" 2>/dev/null || true
          done

      - name: Wait for services to be ready
        run: |
          echo "Waiting 60s for services to initialize..."
          sleep 60
          # Wait for Neo4j to have a running replica.
          # This used to curl https://<neo4j-fqdn> with no port and break out
          # when the result was anything but "000". Two faults: there is no
          # HTTP endpoint on that app at all (#304), and `curl -sf` writes the
          # code via -w and *then* exits non-zero on an error status, so
          # `|| echo "000"` appended to it and $code became "404000". Not
          # "000", so the loop declared success on attempt 1 every time and
          # the reset carried on into a Neo4j that might still be starting
          # (run 34324347874: "Neo4j responding (HTTP 404000)").
          #
          # There is no route from a runner to this app on any port, so the
          # readiness signal has to come from ACA rather than from Neo4j.
          echo "Waiting for a running mvhd-neo4j replica..."
          NEO4J_REV=$(az containerapp revision list --name mvhd-neo4j \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?properties.active] | [0].name" -o tsv 2>/dev/null || echo "")
          if [ -z "$NEO4J_REV" ]; then
            echo "::warning::mvhd-neo4j has no active revision; continuing, the seed job will fail loudly if it is really down"
          else
            for i in $(seq 1 20); do
              RUNNING=$(az containerapp replica list --name mvhd-neo4j \
                --resource-group ${{ env.RESOURCE_GROUP }} --revision "$NEO4J_REV" \
                --query "length([?properties.runningState=='Running'])" -o tsv 2>/dev/null || echo "0")
              if [ "${RUNNING:-0}" -gt 0 ] 2>/dev/null; then
                echo "mvhd-neo4j has $RUNNING running replica(s) on $NEO4J_REV"
                break
              fi
              echo "  attempt $i: no running replica yet"
              sleep 10
            done
          fi

      # ── Step 1b: Re-import Keycloak `edcv` realm ──
      # The Postgres restart above wipes the Keycloak schema on the demo
      # environment (intentional — it lets us reset users/clients each
      # week to a clean state). Without this step the realm stays empty
      # and every login bounces to Keycloak's "Page not found" template.
      # The realm definition lives at jad/keycloak-realm.json.
      - name: Re-import Keycloak edcv realm
        run: |
          echo "=== Re-importing Keycloak edcv realm ==="
          KC_FQDN=$(az containerapp show --name mvhd-keycloak \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          KC="https://${KC_FQDN}"
          echo "Keycloak: $KC"

          # Wait for Keycloak's master realm to answer (it needs ~30-60s
          # after restart to finish initialising before /admin/* works).
          # `curl -s`, not `-sf`: with -f, curl writes the status via -w and
          # then exits non-zero on a 4xx/5xx, so the `|| echo "000"` fallback
          # appends and $code becomes "404000". This loop compares against
          # "200" so it only logged a nonsense code, but the same shape at the
          # Neo4j probe compared against "000" and broke out on attempt 1
          # every time (#304).
          echo "Waiting for Keycloak master realm to be reachable..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "$KC/realms/master/.well-known/openid-configuration" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "  Keycloak ready (HTTP $code)"
              break
            fi
            echo "  attempt $i: HTTP $code, retrying in 5s..."
            sleep 5
          done

          # Admin credentials come from the Keycloak container app itself,
          # never from a literal here. KEYCLOAK_ADMIN is a plain env var on the
          # app; KEYCLOAK_ADMIN_PASSWORD is a secretRef to the ACA secret
          # keycloak-admin-password, which 03-identity.sh populates from Key
          # Vault.
          #
          # This block read `admin` / `admin` until 2026-09-26. That matched
          # when it was written and stopped matching once the password was
          # rotated, and from then on every run burned six token attempts on
          # HTTP 400 `invalid_grant` and the realm was never re-imported (run
          # 34809610773, 2026-09-14). Reading it from the app means a rotation
          # cannot desynchronise it again.
          #
          # Read from the container app and not from Key Vault: the CI service
          # principal (mvhd-github-actions) is Contributor on the resource
          # group, which carries Microsoft.App/containerApps/listSecrets, but
          # it is not Key Vault Secrets User and the vault is RBAC-mode. A
          # direct `az keyvault secret show` fails here, which is exactly what
          # breaks the same lookup in aca-schedule.yml.
          KC_ADMIN_USER=$(az containerapp show --name mvhd-keycloak \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].env[?name=='KEYCLOAK_ADMIN'].value | [0]" \
            -o tsv 2>/dev/null || echo "")
          KC_ADMIN_USER="${KC_ADMIN_USER:-admin}"
          KC_ADMIN_PASS=$(az containerapp secret show --name mvhd-keycloak \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secret-name keycloak-admin-password --query value -o tsv 2>/dev/null || echo "")
          if [ -z "$KC_ADMIN_PASS" ]; then
            echo "::error::Could not read the ACA secret keycloak-admin-password on mvhd-keycloak. Check that the secret exists and that the CI service principal has Microsoft.App/containerApps/listSecrets/action (Contributor on the resource group covers it)."
            exit 1
          fi
          echo "::add-mask::$KC_ADMIN_PASS"
          echo "Admin user: ${KC_ADMIN_USER} (password read from the ACA secret, ${#KC_ADMIN_PASS} chars)"

          # A 200 on the master well-known endpoint does not guarantee the
          # token endpoint is serving yet (observed during ACA replica churn,
          # 2026-07-17: two consecutive one-shot failures while the endpoint
          # answered fine minutes later) — so retry the token call itself.
          TOKEN=""
          for i in $(seq 1 6); do
            # --data-urlencode, not one packed -d string: the password is no
            # longer a literal `admin` but a generated secret, and a rotation
            # that produced a `+`, `&` or `=` would otherwise be mangled into
            # a different password with no sign of why the login failed.
            http=$(curl -sS -o /tmp/kc-token.json -w "%{http_code}" -X POST \
              "$KC/realms/master/protocol/openid-connect/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "username=${KC_ADMIN_USER}" \
              --data-urlencode "password=${KC_ADMIN_PASS}" \
              -d "grant_type=password" -d "client_id=admin-cli" \
              || echo "000")
            TOKEN=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))" \
              < /tmp/kc-token.json 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then
              break
            fi
            # Say why, not just the status code. This printed a bare "HTTP 400"
            # until 2026-09-26, which is why a wrong password read as a flaky
            # endpoint for two weeks. A failed token response carries an error
            # code and description, no token and no credential.
            ERR=$(python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('error') or '') + ((': ' + d['error_description']) if d.get('error_description') else ''))" \
              < /tmp/kc-token.json 2>/dev/null || true)
            echo "  token attempt $i: HTTP $http${ERR:+ ($ERR)}, retrying in 10s..."
            sleep 10
          done
          rm -f /tmp/kc-token.json
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not obtain Keycloak admin token after 6 attempts (last HTTP $http${ERR:+, $ERR}). An invalid_grant here means the admin password on mvhd-keycloak does not match the ACA secret keycloak-admin-password."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "Got admin token (${#TOKEN} chars)"

          # This step used to DELETE the realm unconditionally and re-POST
          # jad/keycloak-realm.json over it. That is the exact operation the
          # schedule was disabled for on 2026-09-13: the realm now carries the
          # `meinbefund-ios` client and real user accounts (ADR-034) and the
          # quota counter (ADR-035), none of which are in the import file, so
          # the re-import does not put them back. The iPhone simply stops
          # signing in.
          #
          # Disabling the cron removed the weekly occurrence but left the
          # operation one `workflow_dispatch` away, and until #310 a stale
          # admin password happened to fail the login first, which hid it. So:
          # the default path never deletes, and the wipe is an explicit opt-in.
          REALM_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$KC/realms/edcv/.well-known/openid-configuration")

          if [ "${{ inputs.wipe_realm }}" != "true" ]; then
            if [ "$REALM_CODE" = "200" ]; then
              echo "Realm edcv is present (HTTP $REALM_CODE). Leaving it alone."
              echo "Re-run with wipe_realm=true to delete and re-import it, which"
              echo "removes every client and user that jad/keycloak-realm.json"
              echo "does not carry (ADR-034, ADR-035)."
              exit 0
            fi
            echo "Realm edcv is missing (HTTP $REALM_CODE). Importing it, no delete."
          else
            # Name what is about to be lost, in the log, before losing it.
            echo "::warning::wipe_realm=true: deleting and re-importing the edcv realm"
            LIVE=$(curl -sS "$KC/admin/realms/edcv/clients" \
              -H "Authorization: Bearer $TOKEN" \
              | python3 -c "import json,sys; print(' '.join(sorted(c.get('clientId','') for c in json.load(sys.stdin))))" \
              2>/dev/null || echo "")
            SHIPPED=$(python3 -c "import json; print(' '.join(sorted(c.get('clientId','') for c in json.load(open('jad/keycloak-realm.json')).get('clients', []))))")
            echo "  clients live now:        ${LIVE:-(could not list)}"
            echo "  clients the import has:  ${SHIPPED}"
            for c in $LIVE; do
              case " $SHIPPED " in
                *" $c "*) ;;
                *) echo "::warning::client '$c' is not in jad/keycloak-realm.json and will NOT come back" ;;
              esac
            done

            DEL=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
              "$KC/admin/realms/edcv" \
              -H "Authorization: Bearer $TOKEN")
            echo "DELETE /admin/realms/edcv → HTTP $DEL"
          fi

          # -o /dev/null + -w status on the calls above avoids leaking the
          # bearer token in any error body that might come back.
          POST=$(curl -sS -o /tmp/kc-import.out -w "%{http_code}" -X POST \
            "$KC/admin/realms" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @jad/keycloak-realm.json)
          echo "POST /admin/realms → HTTP $POST"
          if [ "$POST" != "201" ]; then
            echo "::error::Realm import failed"
            head -c 500 /tmp/kc-import.out || true
            exit 1
          fi

          # Confirm.
          VERIFY=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$KC/realms/edcv/.well-known/openid-configuration")
          if [ "$VERIFY" != "200" ]; then
            echo "::error::edcv realm not reachable after import (HTTP $VERIFY)"
            exit 1
          fi
          echo "edcv realm imported and reachable (HTTP $VERIFY)"

      # ── Step 1c: Verify the personas can actually authenticate ──
      # The import above proves the realm EXISTS (discovery answers 200). It
      # does not prove anyone can log in, and those are different things: on
      # 2026-09-08 the local realm answered discovery fine while missing three
      # users and three roles outright, and two more users carried only half
      # their roles. A realm that exists but cannot authenticate is exactly the
      # state that produced the login outage this workflow is meant to prevent.
      #
      # The import also logs `Referenced client scope 'offline_access' doesn't
      # exist`, so it is not a clean apply and should not be trusted on its own.
      #
      # provision-keycloak-sso.sh reconciles roles, users, passwords and role
      # mappings from jad/keycloak-realm.json, then obtains a token for every
      # account and exits non-zero if any cannot log in. That turns a silently
      # bad import into a failed reset instead of leaving it for the smoke job.
      - name: Verify demo logins work
        run: |
          KC_FQDN=$(az containerapp show --name mvhd-keycloak \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.customDomains[0].name" -o tsv 2>/dev/null || echo "")
          if [ -z "$KC_FQDN" ] || [ "$KC_FQDN" = "None" ]; then
            KC_FQDN=$(az containerapp show --name mvhd-keycloak \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" -o tsv)
          fi
          KC_HOST="https://${KC_FQDN}" \
          KC_ADMIN_USER=admin \
          KC_ADMIN_PASSWORD=admin \
            ./scripts/provision-keycloak-sso.sh

      # ── Step 2: Run Vault bootstrap job (Vault init + keys) ──
      # Job names must match scripts/azure/env.sh (NEO4J_SEED_JOB etc.) —
      # earlier revisions used phantom names (mvhd-bootstrap-job,
      # mvhd-schema-job, mvhd-seed-job) that never existed, so every step
      # silently "skipped" and Neo4j was never re-seeded (found 2026-07-17).
      - name: Run Vault bootstrap job
        run: |
          echo "=== Running Vault bootstrap job ==="
          az containerapp job start \
            --name mvhd-vault-bootstrap \
            --resource-group ${{ env.RESOURCE_GROUP }} || \
          echo "::warning::mvhd-vault-bootstrap start failed"

      - name: Wait for bootstrap
        run: sleep 30

      # ── Step 3: Run Neo4j seed job (schema + all seed cyphers) ──
      # mvhd-neo4j-seed applies init-schema.cypher first, then every seed
      # file (datasets, credentials, trust center, compliance matrix, NLQ
      # glossary) — there is no separate schema job.
      - name: Run Neo4j seed job
        run: |
          echo "=== Running Neo4j seed job ==="
          az containerapp job start \
            --name mvhd-neo4j-seed \
            --resource-group ${{ env.RESOURCE_GROUP }} || \
          echo "::warning::mvhd-neo4j-seed start failed"

      - name: Wait for seed completion
        run: |
          echo "Waiting for seed job to complete (up to 10 minutes)..."
          for i in $(seq 1 60); do
            status=$(az containerapp job execution list \
              --name mvhd-neo4j-seed \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "[0].properties.status" -o tsv 2>/dev/null || echo "unknown")
            if [ "$status" = "Succeeded" ]; then
              echo "Seed job completed successfully"
              break
            elif [ "$status" = "Failed" ]; then
              echo "::warning::Seed job failed"
              break
            fi
            echo "  attempt $i: status=$status"
            sleep 10
          done

      # ── Step 4: Run FHIR loader job (127 synthetic patients) ──
      - name: Run FHIR loader job
        run: |
          echo "=== Running FHIR loader job ==="
          az containerapp job start \
            --name mvhd-fhir-loader \
            --resource-group ${{ env.RESOURCE_GROUP }} || \
          echo "::warning::mvhd-fhir-loader start failed"

      - name: Wait for FHIR loader completion
        run: |
          echo "Waiting for FHIR loader to complete (up to 10 minutes)..."
          for i in $(seq 1 60); do
            status=$(az containerapp job execution list \
              --name mvhd-fhir-loader \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "[0].properties.status" -o tsv 2>/dev/null || echo "unknown")
            if [ "$status" = "Succeeded" ]; then
              echo "FHIR loader completed successfully"
              break
            elif [ "$status" = "Failed" ]; then
              echo "::warning::FHIR loader failed"
              break
            fi
            echo "  attempt $i: status=$status"
            sleep 10
          done

      # ── Step 5: Restart application services to pick up fresh data ──
      - name: Restart application services
        run: |
          echo "=== Restarting application services ==="
          for app in mvhd-ui mvhd-neo4j-proxy mvhd-controlplane mvhd-identityhub mvhd-issuerservice; do
            echo "Restarting $app..."
            az containerapp update --name "$app" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --set-env-vars "RESET_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>/dev/null || true
          done

      - name: Wait for services
        run: sleep 30

      # ── Step 6: Verify UI is healthy ──
      - name: Verify UI responds
        id: verify
        run: |
          UI_FQDN=$(az containerapp show --name mvhd-ui \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "ui_url=https://${UI_FQDN}" >> "$GITHUB_OUTPUT"
          echo "Checking https://${UI_FQDN}..."
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${UI_FQDN}" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "UI is healthy (HTTP 200)"
              exit 0
            fi
            echo "  attempt $i: HTTP $code"
            sleep 5
          done
          echo "::warning::UI did not return 200 after reset"

      - name: Reset summary
        if: always()
        run: |
          echo "## Weekly Demo Reset" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ steps.verify.outputs.ui_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All user data cleared. Environment restored to baseline seed state." >> $GITHUB_STEP_SUMMARY

  # ── Smoke tests — runs after reset, or as standalone health check when clean ──
  smoke-test:
    name: Post-Reset Smoke Tests
    needs: [check-dirty, reset-environment]
    if: ${{ always() && !inputs.skip_tests && (needs.reset-environment.result == 'success' || needs.check-dirty.outputs.needs_reset == 'false') }}
    runs-on: ubuntu-latest
    # Raised from 15: the specs now perform ~11 browser OIDC logins against a
    # remote environment (#142). The run that exposed the base-URL bug above
    # spent its whole budget on retries and was cancelled mid-suite, which is a
    # worse signal than a failure because it looks like an infrastructure blip.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Prefer the CUSTOM DOMAIN, not the raw ACA FQDN.
      #
      # mvhd-ui is deployed with NEXTAUTH_URL=https://ehds.mabu.red, so an OIDC
      # flow started on mvhd-ui.<hash>.azurecontainerapps.io sets its PKCE/state
      # cookies on the ACA host and then gets a callback on ehds.mabu.red — which
      # fails as `error=OAuthCallback`. That never mattered while no smoke test
      # logged in; it broke every authenticated test the moment #142 added
      # loginAs(), and the retries (CI sets retries: 2) then blew the job's
      # 15-minute budget, so the run reported "cancelled" rather than a failure.
      #
      # Falls back to the ingress FQDN when no custom domain is bound, so this
      # still works on an environment that has not had one attached.
      - name: Get Azure UI URL
        id: azure-url
        run: |
          resolve_host() {
            local app="$1"
            local custom fqdn
            custom=$(az containerapp show --name "$app" --resource-group rg-mvhd-dev \
              --query "properties.configuration.ingress.customDomains[0].name" -o tsv 2>/dev/null || echo "")
            if [ -n "$custom" ] && [ "$custom" != "None" ]; then
              echo "$custom"
              return
            fi
            fqdn=$(az containerapp show --name "$app" --resource-group rg-mvhd-dev \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "$fqdn"
          }
          UI_HOST=$(resolve_host mvhd-ui)
          KC_HOST=$(resolve_host mvhd-keycloak)
          echo "UI:       https://${UI_HOST}"
          echo "Keycloak: https://${KC_HOST}"
          echo "url=https://${UI_HOST}" >> "$GITHUB_OUTPUT"
          echo "keycloak_url=https://${KC_HOST}" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests
        run: |
          npx playwright test \
            __tests__/e2e/journeys/15-persona-graphs.spec.ts \
            __tests__/e2e/journeys/11-catalog-search-detail.spec.ts \
            --project=chromium --reporter=line
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.azure-url.outputs.url }}
          KEYCLOAK_PUBLIC_URL: ${{ steps.azure-url.outputs.keycloak_url }}

      - name: Smoke test result
        if: always()
        run: |
          echo "## Post-Reset Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "Target: ${{ steps.azure-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
