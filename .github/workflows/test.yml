# ---------------------------------------------------------------------------
# Test Suite — Health Dataspace v2
# ---------------------------------------------------------------------------
# Runs unit tests and API integration tests for the Next.js UI and the
# services, and one job of supply-chain and posture scans. Lint and the
# per-push gitleaks scan are PR Gate's (#847).
#
# Unit/API tests use vi.mock(): NO live Neo4j, EDC-V, or Keycloak needed.
# The Playwright E2E suite and the Lighthouse budget run once a night in
# nightly.yml (ADR-074, #847). An E2E copy that ran here had no Neo4j: 96
# minutes, a quarter of the tests failing, and continue-on-error on every
# step, so it could not fail.
#
# Triggers:
#   - Push to a branch without a slash (in practice main)
#   - Pull request to main
#   - Manual dispatch
# ---------------------------------------------------------------------------
name: Test Suite

on:
  push:
    branches: ["*"]
    paths:
      - "ui/**"
      - "services/neo4j-proxy/**"
      - "services/spe-loader/**"
      - "trustee/**"
      - "scripts/test-trustee-policies.sh"
      - "services/epa-ingest/**"
      - "clients/ios/**"
      # ui/__tests__/unit/docs/klarbefund-wallet-guide.test.ts reads these
      # two documents: a change to them alone must re-run it (#708).
      - "docs/klarbefund/**"
      - "docs/knowledge/runbooks/klarbefund-connect.md"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - "services/neo4j-proxy/**"
      - "services/spe-loader/**"
      - "trustee/**"
      - "scripts/test-trustee-policies.sh"
      - "services/epa-ingest/**"
      - "clients/ios/**"
      - "docs/klarbefund/**"
      - "docs/knowledge/runbooks/klarbefund-connect.md"
  workflow_dispatch:

env:
  NODE_VERSION: "22"

# Read-only token unless a job asks for more (trivy-scan does, for SARIF).
permissions:
  contents: read

# A newer commit on the same pull request replaces the older run. Every other
# run gets its own group, so each push to main still runs to the end and a red
# run names the commit that broke it.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # What changed: the iOS parity check needs a macOS runner, of which a
  # public repository gets five at a time, so it runs only when the Swift
  # package changes. analytes.ts reaches it through the generated Swift file,
  # which the epa-ingest drift check keeps current.
  # -----------------------------------------------------------------------
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff against the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          # A manual run, a new branch (before is all zeros) or a base that
          # is not in the clone: run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "ios=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base"...HEAD)
          if grep -qE '^(clients/ios/|\.github/workflows/test\.yml$)' <<<"$files"; then
            echo "ios=true" >>"$GITHUB_OUTPUT"
          else
            echo "ios=false" >>"$GITHUB_OUTPUT"
          fi

  # -----------------------------------------------------------------------
  # UI Unit + API Integration Tests (Vitest)
  # -----------------------------------------------------------------------
  ui-tests:
    name: UI Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage --reporter=verbose --reporter=json --outputFile=test-results.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-coverage
          path: |
            ui/coverage/
            ui/test-results.json
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          echo "## UI Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx vitest run --coverage 2>&1 | grep -A 50 "^-.*-$" | head -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------------------
  # Neo4j Query Proxy Tests (Vitest)
  # -----------------------------------------------------------------------
  proxy-tests:
    name: Neo4j Proxy Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/neo4j-proxy
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./services/neo4j-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage --reporter=verbose --reporter=json --outputFile=test-results.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proxy-coverage
          path: |
            services/neo4j-proxy/coverage/
            services/neo4j-proxy/test-results.json
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          echo "## Neo4j Proxy Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx vitest run --coverage 2>&1 | grep -A 10 "^-.*-$" | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------------------
  # SPE Loader Tests (Vitest)
  # The sealed extract, the key release and "no key, no data" (ADR-068,
  # ADR-069, #774). Pure unit tests: no Neo4j, no Trustee, no TEE.
  # -----------------------------------------------------------------------
  spe-loader-tests:
    name: SPE Loader Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/spe-loader
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./services/spe-loader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (src and tests)
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run --reporter=verbose

  # -----------------------------------------------------------------------
  # Trustee resource policies (opa test)
  # Who gets an SPE's extract key: the permit's workload on SEV-SNP with a
  # pinned measurement, nothing else (ADR-069). Pinned OPA image.
  # -----------------------------------------------------------------------
  trustee-policy-tests:
    name: Trustee Policy Tests (opa test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: opa test
        run: ./scripts/test-trustee-policies.sh

  # -----------------------------------------------------------------------
  # ePA Ingest Tests (Vitest)
  # Pre-ePA workbench: lab report → FHIR R4 with provenance (issue #182, W9).
  # Pure unit tests — the optional OCR/PDF dependencies are not exercised.
  # -----------------------------------------------------------------------
  epa-ingest-tests:
    name: ePA Ingest Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/epa-ingest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./services/epa-ingest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (src + eval harness)
        run: npm run typecheck

      # The Swift analyte table is generated from analytes.ts. A stale copy is
      # the silent divergence the shared repository was chosen to prevent.
      - name: Generated Swift analyte table is current
        run: npm run generate:swift -- --check

      - name: Run tests with coverage
        run: npx vitest run --coverage --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: epa-ingest-coverage
          path: services/epa-ingest/coverage/
          retention-days: 30

  # -----------------------------------------------------------------------
  # iOS Client — generated analyte table parity (Swift)
  # Proves the generated Swift BEHAVES like the TypeScript it came from: same
  # codings, same label/unit folding, same refusals. The drift check in
  # epa-ingest-tests proves the file is current; this proves it is correct.
  # macOS runners are free for public repos but scarce, so this runs only when
  # the changes job saw the Swift package change, and never gates the web or
  # service suites.
  # -----------------------------------------------------------------------
  ios-analyte-parity:
    name: iOS Analyte Parity (Swift)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./clients/ios
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Run parity check
        run: swift run AnalyteParity

  # -----------------------------------------------------------------------
  # Supply-chain and posture scans, in one job (#847)
  #
  # Trivy, Kubescape, npm audit, the CycloneDX SBOM and the licence check
  # were five jobs, each paying for its own runner, checkout and setup, for
  # about a minute of work each; on a free public repository that was five of
  # the twenty jobs that can run at once. Every step after a failed one still
  # runs (`!cancelled()`), so one red gate does not hide the others, and the
  # job is red if any of them is. Trivy runs first, on the clean checkout,
  # before npm ci puts node_modules in the tree. The job id stays trivy-scan:
  # the Security tab and its SARIF category know it by that id.
  #
  # Lint and the gitleaks scan left this workflow: PR Gate runs ESLint and
  # tsc through pre-commit and gitleaks over the pull request's commits, and
  # the full-history gitleaks scan runs in nightly.yml.
  # -----------------------------------------------------------------------
  trivy-scan:
    name: Supply-chain and posture scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # required to upload SARIF to Security tab
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Trivy 0.69.3 binary, pinned (CVE-2026-33634): do NOT use
      # aquasecurity/trivy-action or setup-trivy, whose tags were poisoned in
      # the March 2026 supply-chain attack (GHSA-69fq-xp46-6x23).
      # Install Trivy 0.69.3 binary directly — avoids compromised trivy-action
      # The install script is fetched from the official GitHub release, not Docker Hub.
      - name: Install Trivy 0.69.3 (pinned — CVE-2026-33634 safe)
        run: |
          TRIVY_VERSION="0.69.3"
          TRIVY_ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_ARCHIVE}" \
            -o "${TRIVY_ARCHIVE}"
          # Verify checksum from official release checksums file
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" \
            -o trivy_checksums.txt
          grep "${TRIVY_ARCHIVE}" trivy_checksums.txt | sha256sum -c -
          tar -xzf "${TRIVY_ARCHIVE}" trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy filesystem scan (HIGH+CRITICAL)
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-results.sarif \
            --exit-code 1 \
            .
        continue-on-error: true # upload report even on findings

      # The category is the one the separate trivy-scan job used, so the
      # Security tab keeps one Trivy analysis instead of starting a second.
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/test.yml:trivy-scan

      - name: Trivy summary table
        if: ${{ !cancelled() }}
        run: |
          echo "## Trivy Scan Results" >> $GITHUB_STEP_SUMMARY
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format table \
            . >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Fail on HIGH/CRITICAL findings
        continue-on-error: true # report findings without blocking the pipeline
        run: |
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --quiet \
            .

      # Kubescape: k8s/ manifests against the NSA and CIS frameworks,
      # statically, no cluster needed.
      # The upstream install script fails now and then (twice on 2026-11-03),
      # and in one job that would fail every scan, so it gets three tries.
      - name: Install kubescape
        if: ${{ !cancelled() }}
        run: |
          for attempt in 1 2 3; do
            if curl -sfL https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | /bin/bash; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            echo "kubescape install failed, attempt $attempt; retrying"
            sleep 10
          done
          echo "$HOME/.kubescape/bin" >> "$GITHUB_PATH"

      - name: Scan k8s manifests (NSA framework)
        if: ${{ !cancelled() }}
        run: |
          kubescape scan framework nsa \
            --severity-threshold critical \
            --format json \
            --output kubescape-nsa.json \
            k8s/

      # Kubescape's framework names change release-to-release. The old
      # cis-v1.23-t1.0.1 identifier returns `framework not found` on the
      # current binary. List frameworks first, match the current CIS
      # name, and only run the scan if it exists; otherwise just warn
      # and continue so the NSA scan still gates critical issues.
      - name: Scan k8s manifests (CIS benchmark)
        if: ${{ !cancelled() }}
        run: |
          CIS_FRAMEWORK=$(kubescape list frameworks 2>/dev/null \
            | grep -oE "cis-v[^ ]+" | head -1 || true)
          if [ -z "$CIS_FRAMEWORK" ]; then
            echo "::warning::No CIS framework available in this kubescape build — skipping. NSA scan is authoritative."
            echo '{"skipped":"no cis framework in kubescape"}' > kubescape-cis.json
            exit 0
          fi
          echo "Using CIS framework: $CIS_FRAMEWORK"
          kubescape scan framework "$CIS_FRAMEWORK" \
            --severity-threshold critical \
            --format json \
            --output kubescape-cis.json \
            k8s/

      - name: Kubescape summary
        if: always()
        run: |
          echo "## Kubescape K8s Posture" >> $GITHUB_STEP_SUMMARY
          kubescape scan framework nsa k8s/ --format pretty-printer 2>/dev/null \
            | tail -30 >> $GITHUB_STEP_SUMMARY || true

      - name: Upload kubescape reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kubescape-reports
          path: |
            kubescape-nsa.json
            kubescape-cis.json
          retention-days: 30

      # Node: npm audit, the SBOM and the licence check share one install.
      - name: Setup Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            ./ui/package-lock.json
            ./services/neo4j-proxy/package-lock.json

      # Same gate as the pre-push hook, over all dependencies: high and
      # critical fail unless excepted, with an expiry, in
      # docs/npm-audit-exceptions.json (#435).
      - name: Audit UI dependencies
        if: ${{ !cancelled() }}
        run: python3 scripts/check-npm-audit.py ui

      - name: Audit Neo4j proxy dependencies
        if: ${{ !cancelled() }}
        # Use --omit=dev to audit only production dependencies for the proxy
        run: python3 scripts/check-npm-audit.py services/neo4j-proxy --omit=dev
        continue-on-error: true

      - name: Audit summary
        if: always()
        # working-directory, not `cd ui && ... || true`: newer shellcheck flags
        # that as SC2015, which failed PR Gate for any PR touching this file.
        working-directory: ./ui
        run: |
          {
            echo "## Dependency Audit"
            echo "| Package | Severity |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --json 2>/dev/null | \
            node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            Object.values(d.vulnerabilities||{}).forEach(v=>
              process.stdout.write('| '+v.name+' | '+v.severity+' |\n')
            )" >> "$GITHUB_STEP_SUMMARY" || true

      # SBOM (CycloneDX): EU CRA Art. 13, SIMPL-Open.
      - name: Install dependencies (UI and Neo4j proxy)
        if: ${{ !cancelled() }}
        run: |
          npm ci --prefix ui
          npm ci --prefix services/neo4j-proxy

      - name: Generate CycloneDX SBOM (UI)
        if: ${{ !cancelled() }}
        working-directory: ./ui
        run: npx @cyclonedx/cyclonedx-npm --output-file ../sbom-ui.cdx.json --spec-version 1.5

      - name: Generate CycloneDX SBOM (Neo4j Proxy)
        if: ${{ !cancelled() }}
        working-directory: ./services/neo4j-proxy
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file ../../sbom-neo4j-proxy.cdx.json --spec-version 1.5

      - name: Upload SBOM artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom-ui.cdx.json
            sbom-neo4j-proxy.cdx.json
          retention-days: 90

      - name: SBOM summary
        if: ${{ !cancelled() }}
        run: |
          echo "## SBOM Generation" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Format | Spec |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ui | CycloneDX | 1.5 |" >> $GITHUB_STEP_SUMMARY
          echo "| neo4j-proxy | CycloneDX | 1.5 |" >> $GITHUB_STEP_SUMMARY

      # Licences: EU OSS Strategy, SIMPL-Open.
      # license-checker@25.0.1 (the original) is unmaintained and crashes
      # with TypeError: json.readme.toLowerCase is not a function on some
      # modern package.json shapes. license-checker-rseidelsohn is the
      # maintained fork and handles the same flags. Both ui/package.json
      # and services/neo4j-proxy/package.json carry
      # "license": "Apache-2.0" so the self-package passes its own
      # allowlist without needing a version-pinned excludePackages entry.
      # lightningcss (MPL-2.0) is the build-time CSS compiler; the image ships
      # .next/standalone, which does not contain it. It shows under --production
      # only because @unhead/bundler (via Scalar) declares it an optional peer,
      # which marks the dev install devOptional. Excluded by name, not by
      # adding MPL-2.0 to the allowlist.
      - name: Check licences (UI)
        if: ${{ !cancelled() }}
        working-directory: ./ui
        run: |
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages --excludePackagesStartingWith "lightningcss" --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;CC-BY-4.0;Unlicense;Python-2.0;BlueOak-1.0.0;LGPL-3.0-or-later" --summary

      - name: Check licences (Neo4j Proxy)
        if: ${{ !cancelled() }}
        working-directory: ./services/neo4j-proxy
        run: |
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;CC-BY-4.0;Unlicense;Python-2.0;BlueOak-1.0.0;LGPL-3.0-or-later" --summary

      - name: Licence summary
        if: always()
        run: |
          echo "## Licence Compliance" >> $GITHUB_STEP_SUMMARY
          echo "Allowlist: MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, CC-BY-4.0, Unlicense, Python-2.0, BlueOak-1.0.0" >> $GITHUB_STEP_SUMMARY
