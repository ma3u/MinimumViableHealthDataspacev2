name: EEHRxF validation

# What /eehrxf shows is a validation result (#1144): the HL7 FHIR Validator
# runs over what the hub takes in (the Klarbefund and epa-ingest FHIR writer's
# golden bundles, and a seeded Synthea sample) against the HL7 Europe
# profiles in scripts/eehrxf/profiles.json. The report is committed, and the
# graph seed and static mock are generated from it.
#
# This workflow fails when the committed report no longer matches a fresh
# run, so a change to the writer, the sample, the guides or the validator
# cannot change what the page claims without the claim changing in the same
# pull request. It also fails when the seed or mock were edited by hand.
#
# The same run checks the German profiles in profiles.json's national
# section (#1172): gematik ePA, KBV MIO and the MII Kerndatensatz. build.py
# writes the MII ones to their own seed and mock, never to the EEHRxF ones. A draft or
# ballot guide is report-only; a published one gates: validate.py exits 1
# when a gating profile fails more resources than the committed report
# records for it.
#
# Fixing a failure: run locally and commit the three generated files.
#   python3 scripts/eehrxf/validate.py
#   python3 scripts/eehrxf/build.py

on:
  pull_request:
    paths:
      - "scripts/eehrxf/**"
      # The Matchbox image: its config is generated here, its bake reads it (ADR-097).
      - "services/matchbox/**"
      # The proxy sends these with every $validate (generated, ADR-097).
      - "services/neo4j-proxy/src/fhir-extension-domains.ts"
      - "clients/ios/Tests/SharedTests/Fixtures/fhir-golden-bundle*.json"
      - "neo4j/register-eehrxf-profiles.cypher"
      - "ui/public/mock/eehrxf.json"
      - "neo4j/register-national-profiles.cypher"
      - "ui/public/mock/eehrxf_national.json"
      - "ui/public/eehrxf/validation/**"
      # The sample is cut to the loader's types with Synthea's own flags.
      - "scripts/load_fhir_neo4j.py"
      - "scripts/generate-synthea.sh"
      # The Layer 6 mapper links guidelines to these categories by id.
      - "scripts/leitlinien/category_mapper.py"
      - ".github/workflows/eehrxf-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/eehrxf/**"
      # The Matchbox image: its config is generated here, its bake reads it (ADR-097).
      - "services/matchbox/**"
      # The proxy sends these with every $validate (generated, ADR-097).
      - "services/neo4j-proxy/src/fhir-extension-domains.ts"
      - "clients/ios/Tests/SharedTests/Fixtures/fhir-golden-bundle*.json"
      - "neo4j/register-eehrxf-profiles.cypher"
      - "ui/public/mock/eehrxf.json"
      - "neo4j/register-national-profiles.cypher"
      - "ui/public/mock/eehrxf_national.json"
      - "ui/public/eehrxf/validation/**"
      # The sample is cut to the loader's types with Synthea's own flags.
      - "scripts/load_fhir_neo4j.py"
      - "scripts/generate-synthea.sh"
      # The Layer 6 mapper links guidelines to these categories by id.
      - "scripts/leitlinien/category_mapper.py"
      - ".github/workflows/eehrxf-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eehrxf-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: Seed and mock match the report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/eehrxf -p "test_*.py" -v
      - name: Generated files are current
        run: python3 scripts/eehrxf/build.py --check

  validate:
    name: Report matches a fresh validator run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # The validator jar (about 200 MB) and the FHIR packages it loads,
      # the German ones and their KBV and gematik dependencies included.
      # All are pinned in profiles.json, so the key is its hash.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mvhd
            ~/.fhir/packages
          key: eehrxf-${{ hashFiles('scripts/eehrxf/profiles.json') }}
      - name: Validate
        run: python3 scripts/eehrxf/validate.py --report "${RUNNER_TEMP}/validation-report.json" --details "${RUNNER_TEMP}/validation-details.json" --baseline scripts/eehrxf/validation-report.json
      - name: Compare with the committed report
        run: |
          set -euo pipefail
          if ! diff -u scripts/eehrxf/validation-report.json "${RUNNER_TEMP}/validation-report.json"; then
            echo "::error::The committed EEHRxF report differs from a fresh run. Run python3 scripts/eehrxf/validate.py and python3 scripts/eehrxf/build.py, then commit the report and the generated seeds and mocks (neo4j/register-eehrxf-profiles.cypher, neo4j/register-national-profiles.cypher, ui/public/mock/eehrxf.json, ui/public/mock/eehrxf_national.json)."
            exit 1
          fi
          # The viewer on /eehrxf shows these per-resource errors and warnings.
          if ! diff -q scripts/eehrxf/validation-details.json "${RUNNER_TEMP}/validation-details.json"; then
            echo "::error::The committed validation details differ from a fresh run. Run python3 scripts/eehrxf/validate.py and python3 scripts/eehrxf/build.py, then commit scripts/eehrxf/validation-details.json and ui/public/eehrxf/validation/."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eehrxf-validation-report
          path: |
            ${{ runner.temp }}/validation-report.json
            ${{ runner.temp }}/validation-details.json
          if-no-files-found: warn
