# Dependabot — automated dependency updates.
#
# Grouping rationale: this repo's pre-push gate is `npm audit --audit-level=high`,
# so a flood of individual PRs blocks pushes without fixing the gate. Patch and
# minor updates are therefore grouped into one PR per ecosystem per week, while
# major updates stay separate because they need their own test run.
#
# Security updates are exempt from the schedule — Dependabot raises those
# immediately regardless of the `interval` below.
version: 2

updates:
  # ── npm: UI (Next.js) ──
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      # vitest and @vitest/coverage-v8 pin each other as exact peers. Bumped
      # one at a time, npm ci fails with ERESOLVE and no test runs: Vitest 5
      # arrived as #416, #243 and #241, all red for that reason (#426). This
      # group comes first because a dependency joins the first group it matches,
      # and it has no update-types so majors travel together too.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      ui-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # React 19 is a deliberate hold — the UI targets React 18 (ui/package.json).
      # Remove this ignore when the React 19 migration is planned.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # Held majors (#426). Each needs a migration, not a merge; remove the
      # line in the PR that does it.
      # lucide-react 1.x renamed and removed icons; components render undefined (#195).
      - dependency-name: lucide-react
        update-types: [version-update:semver-major]
      # mermaid 12 pulls in elkjs (EPL-2.0), which the licence gate refuses (#194).
      - dependency-name: mermaid
        update-types: [version-update:semver-major]
      # Follows the Node runtime, which is 22 in the Dockerfiles and CI (#97).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # eslint 10 drops the eslintrc format (ui/.eslintrc.json), and the two
      # refuse each other as peers: eslint-config-next 16 needs a newer eslint
      # than 8, 15 refuses eslint 10. Each alone fails npm ci with ERESOLVE
      # (#525, #526). They move together with a flat-config migration.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      # Next 16 removed `next lint`, so the lint script needs the eslint CLI
      # and the flat config above; it also changes the request APIs (#609).
      # It moves with eslint-config-next 16 in the same migration.
      - dependency-name: next
        update-types: [version-update:semver-major]
    labels: [dependencies, ui]

  # ── npm: Neo4j proxy ──
  - package-ecosystem: npm
    directory: /services/neo4j-proxy
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      # Same reason as the ui vitest group above (#243 and #241, #426).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      proxy-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Follows the Node runtime, which is 22 in the Dockerfile and CI (#97, #426).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    labels: [dependencies, neo4j-proxy]

  # ── GitHub Actions ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    groups:
      # `update-types` is the important half. Without it this group swept every
      # major into one PR: #140 arrived as 15 major bumps at once (checkout
      # 4->7, setup-node 4->7, upload-artifact 4->7, azure/login 2->3,
      # test-reporter 1->3, the docker actions 3->4) and was unreviewable, so it
      # was closed unmerged. Majors now get an individual PR each.
      actions-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]

  # ── Container base images ──
  # Dependabot reads FROM lines in Dockerfiles. It does NOT read
  # docker-compose*.yml, so the infrastructure images pinned there
  # (keycloak, postgres, neo4j, the JAD/EDC images) are covered by the
  # scheduled Trivy scan in security-scan.yml instead.
  - package-ecosystem: docker
    directories:
      - /ui
      - /services/neo4j-proxy
      - /services/catalog-crawler
      - /services/catalog-enricher
      - /scripts/azure/compliance-runner
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    ignore:
      # The Node major moves the runtime, CI's NODE_VERSION and @types/node in
      # one change, by hand (#97). #240 and #242 offered 22 -> 26 alone (#426).
      - dependency-name: node
        update-types: [version-update:semver-major]
    labels: [dependencies, docker]

  # ── Python ──
  # Every Python manifest in the repo. `scripts/leitlinien` matters most: its
  # uv.lock carried 4 high + 1 medium advisory (docling, urllib3, soupsieve)
  # that nothing was watching until the Trivy scan surfaced them.
  - package-ecosystem: pip
    directories:
      - /scripts
      - /scripts/leitlinien
      - /services/catalog-crawler
      - /services/catalog-enricher
    schedule:
      interval: monthly
    groups:
      # This block was missing entirely, so Dependabot applied its own default
      # grouping and produced #139: a single PR mixing pytest 8->9 and
      # setuptools 81->83 with three harmless minors. Neither half could be
      # taken without the other, so it was closed and the minors lost a cycle.
      python-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, scripts]
