<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="780" viewBox="0 0 2400 780" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="2400" height="780" fill="#F7F9FB"/>
<rect x="50" y="40" width="2300" height="170" rx="16" fill="#EDF3F9" stroke="#2471A3" stroke-opacity="0.28" stroke-width="1.5"/>
<rect x="50" y="40" width="14" height="170" rx="7" fill="#2471A3"/>
<text x="110" y="112" font-size="42" fill="#16324F" font-weight="700" font-style="normal" text-anchor="start">European Union</text>
<text x="110" y="158" font-size="26" fill="#5A6B7B" font-weight="normal" font-style="normal" text-anchor="start">The Commission builds and runs the central platform.</text>
<text x="2290" y="110" font-size="30" fill="#2471A3" font-weight="700" font-style="normal" text-anchor="end">Closed by law</text>
<text x="2290" y="152" font-size="20" fill="#9AA7B3" font-weight="normal" font-style="normal" text-anchor="end">Catena-X: the Association and CSP-B</text>
<rect x="50" y="230" width="2300" height="170" rx="16" fill="#EBF6F2" stroke="#148F77" stroke-opacity="0.28" stroke-width="1.5"/>
<rect x="50" y="230" width="14" height="170" rx="7" fill="#148F77"/>
<text x="110" y="302" font-size="42" fill="#16324F" font-weight="700" font-style="normal" text-anchor="start">Member State</text>
<text x="110" y="348" font-size="26" fill="#5A6B7B" font-weight="normal" font-style="normal" text-anchor="start">The access body decides every permit, and enforces it.</text>
<text x="2290" y="300" font-size="30" fill="#148F77" font-weight="700" font-style="normal" text-anchor="end">Cannot be delegated</text>
<text x="2290" y="342" font-size="20" fill="#9AA7B3" font-weight="normal" font-style="normal" text-anchor="end">Catena-X: nothing. This is what EHDS adds.</text>
<rect x="50" y="420" width="2300" height="200" rx="16" fill="#FBEFE1" stroke="#CA6F1E" stroke-opacity="0.9" stroke-width="3"/>
<rect x="50" y="420" width="14" height="200" rx="7" fill="#CA6F1E"/>
<text x="110" y="498" font-size="48" fill="#16324F" font-weight="700" font-style="normal" text-anchor="start">The Operating Company</text>
<text x="110" y="548" font-size="26" fill="#5A6B7B" font-weight="normal" font-style="normal" text-anchor="start">Onboarding, the catalogue, the secure environment, incidents, support.</text>
<text x="2290" y="496" font-size="52" fill="#CA6F1E" font-weight="700" font-style="normal" text-anchor="end">OPEN</text>
<text x="2290" y="544" font-size="20" fill="#9AA7B3" font-weight="normal" font-style="normal" text-anchor="end">Catena-X: Cofinity-X</text>
<text x="1200" y="685" font-size="24" fill="#5A6B7B" font-weight="normal" font-style="normal" text-anchor="middle">serving health data holders   ·   researchers and regulators   ·   citizens</text>
<text x="1200" y="740" font-size="19" fill="#9AA7B3" font-weight="normal" font-style="normal" text-anchor="middle">Regulation (EU) 2025/327, Chapter IV   ·   detail in docs/ehds-operating-company.md</text>
</svg>
