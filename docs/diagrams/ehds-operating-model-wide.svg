<path d="M53 676 h-5 a8 8 0 0 0 -8 8 v134 a8 8 0 0 0 8 8 h5 z" fill="#7D3C98"/>
<text x="80.0" y="726.0" font-size="32" fill="#16324F" font-weight="700" font-style="normal" text-anchor="start">Who it serves</text>
<text x="2340.0" y="722.0" font-size="17" fill="#8FA0AE" font-weight="normal" font-style="normal" text-anchor="end">Catena-X: data provider and consumer</text>
<rect x="80.0" y="756" width="249.5" height="48" rx="24" fill="#FFFFFF" stroke="#7D3C98" stroke-opacity="0.45"/>
<text x="204.8" y="787.0" font-size="20" fill="#16324F" font-weight="600" font-style="normal" text-anchor="middle">Health data holders</text>
<rect x="345.5" y="756" width="323.0" height="48" rx="24" fill="#FFFFFF" stroke="#7D3C98" stroke-opacity="0.45"/>
<text x="507.0" y="787.0" font-size="20" fill="#16324F" font-weight="600" font-style="normal" text-anchor="middle">Researchers and regulators</text>
<rect x="684.5" y="756" width="134.0" height="48" rx="24" fill="#FFFFFF" stroke="#7D3C98" stroke-opacity="0.45"/>
<text x="751.5" y="787.0" font-size="20" fill="#16324F" font-weight="600" font-style="normal" text-anchor="middle">Citizens</text>
<text x="2340.0" y="787.0" font-size="18" fill="#7D3C98" font-weight="600" font-style="normal" text-anchor="end">Art. 58, 60, 61, 71</text>
<text x="40.0" y="862.0" font-size="16" fill="#8FA0AE" font-weight="normal" font-style="normal" text-anchor="start">Regulation (EU) 2025/327, Chapter IV, article numbers as adopted   ·   Catena-X operating model, catenax-ev.github.io   ·   detail in docs/diagrams/ehds-operating-model.svg</text>
