<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 912" width="1200" height="912" role="img" aria-labelledby="t d">
<title id="t">Health Knowledge Graph: Five-Layer Reference Architecture</title>
<desc id="d">Five layers in one Neo4j property graph: data access and governance (Dataspace Protocol, ODRL), metadata catalogue (HealthDCAT-AP), clinical data (HL7 FHIR R4), research data (OMOP CDM v5.4) and clinical terminologies (SNOMED CT, ICD-10, LOINC, RxNorm), with the relationships that connect them.</desc>
