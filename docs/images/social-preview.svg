<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">EHDS Integration Hub</title>
  <desc id="d">A reference implementation of the European Health Data Space: five layers in one Neo4j knowledge graph, from data access governance to clinical terminologies, with 127 synthetic patients and 5,300 graph nodes. Open source, Apache 2.0.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0d1b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#2471A3"/>
      <stop offset="0.25" stop-color="#148F77"/>
      <stop offset="0.5" stop-color="#1E8449"/>
      <stop offset="0.75" stop-color="#CA6F1E"/>
      <stop offset="1" stop-color="#7D3C98"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Top accent bar: the five layer colours -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- What it is, top right: the regulation, not a compliance claim -->
  <rect x="1036" y="24" rx="6" ry="6" width="220" height="32" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="1146" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#60c6ff" text-anchor="middle">Regulation (EU) 2025/327</text>

  <!-- Title -->
  <text x="640" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="700" fill="#f0f9ff" text-anchor="middle" filter="url(#glow)">EHDS Integration Hub</text>
  <rect x="220" y="188" width="840" height="4" rx="2" fill="url(#accent)"/>

  <!-- One sentence, not a list: the layers below carry the standards -->
  <text x="640" y="236" font-family="'Segoe UI', system-ui, sans-serif" font-size="23" fill="#94a3b8" text-anchor="middle">Five layers of the European Health Data Space in one Neo4j knowledge graph</text>
  <text x="640" y="268" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" fill="#64748b" text-anchor="middle">Reference implementation · 127 synthetic patients · 5,300 graph nodes · 7 personas · Apache 2.0</text>

  <!-- The five layers, named as in the architecture diagram -->
  <rect x="48" y="330" rx="12" ry="12" width="224" height="88" fill="#2471A3" fill-opacity="0.14" stroke="#2471A3" stroke-width="2"/>
  <text x="160" y="358" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#6CB4E4" text-anchor="middle" letter-spacing="1.5">LAYER 1</text>
  <text x="160" y="382" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#e6edf6" text-anchor="middle">Data Access &amp; Governance</text>
  <text x="160" y="403" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">Dataspace Protocol 2025-1 · ODRL 2.2</text>
  <text x="285" y="378" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="#475569" text-anchor="middle">→</text>

  <rect x="298" y="330" rx="12" ry="12" width="224" height="88" fill="#148F77" fill-opacity="0.14" stroke="#148F77" stroke-width="2"/>
  <text x="410" y="358" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#4FD1B5" text-anchor="middle" letter-spacing="1.5">LAYER 2</text>
  <text x="410" y="382" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#e6edf6" text-anchor="middle">Metadata Catalogue</text>
  <text x="410" y="403" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">HealthDCAT-AP · DCAT-AP 3</text>
  <text x="535" y="378" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="#475569" text-anchor="middle">→</text>

  <rect x="548" y="330" rx="12" ry="12" width="224" height="88" fill="#1E8449" fill-opacity="0.14" stroke="#1E8449" stroke-width="2"/>
  <text x="660" y="358" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#5FD38D" text-anchor="middle" letter-spacing="1.5">LAYER 3</text>
  <text x="660" y="382" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#e6edf6" text-anchor="middle">Clinical Data</text>
  <text x="660" y="403" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">HL7 FHIR R4 · Synthea patients</text>
  <text x="785" y="378" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="#475569" text-anchor="middle">→</text>

  <rect x="798" y="330" rx="12" ry="12" width="224" height="88" fill="#CA6F1E" fill-opacity="0.14" stroke="#CA6F1E" stroke-width="2"/>
  <text x="910" y="358" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F2A65A" text-anchor="middle" letter-spacing="1.5">LAYER 4</text>
  <text x="910" y="382" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#e6edf6" text-anchor="middle">Research Data</text>
  <text x="910" y="403" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">OHDSI OMOP CDM v5.4</text>
  <text x="1035" y="378" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="#475569" text-anchor="middle">→</text>

  <rect x="1048" y="330" rx="12" ry="12" width="184" height="88" fill="#7D3C98" fill-opacity="0.14" stroke="#7D3C98" stroke-width="2"/>
  <text x="1140" y="358" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#C39BD8" text-anchor="middle" letter-spacing="1.5">LAYER 5</text>
  <text x="1140" y="382" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#e6edf6" text-anchor="middle">Terminologies</text>
  <text x="1140" y="403" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">SNOMED CT · ICD-10 · LOINC</text>

  <!-- Built on: the things that are not a layer -->
  <text x="640" y="486" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Built on Neo4j 5 · Eclipse EDC-V · Keycloak · Next.js 15 · live on Azure Container Apps</text>

  <!-- Where -->
  <text x="640" y="590" font-family="'Segoe UI', monospace, sans-serif" font-size="14" fill="#475569" text-anchor="middle">github.com/ma3u/MinimumViableHealthDataspacev2 · ehds.mabu.red</text>
</svg>
