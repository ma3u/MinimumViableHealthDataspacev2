      tags: [Admin]
      summary: List CFM tenants (admin only)
      x-required-roles: [EDC_ADMIN]
      responses:
        "200": { description: Tenant list }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Needs EDC_ADMIN" }

  /api/admin/audit:
    get:
      tags: [Admin]
      summary: Admin audit log
      x-required-roles: [EDC_ADMIN, HDAB_AUTHORITY]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: >
            The audit trail (EHDS Art. 73), grouped by what is being audited.
            `type` echoes the filter in effect; `accesslogs` is present when
            that filter asks for it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      [
                        all,
                        transfers,
                        negotiations,
                        credentials,
                        accesslogs,
                        participants,
                        supervision,
                        spe,
                      ]
                  limit: { type: integer }
                  filters: { type: object }
                  summary: { type: object }
                  transfers:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/AuditEntry" },
                    }
                  negotiations:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/AuditEntry" },
                    }
                  credentials:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/AuditEntry" },
                    }
                  accesslogs: { type: array, items: { type: object } }
                  speEvents:
                    description: >
                      With `type=spe`: attestations, key releases and
                      refusals, workspaces loaded and destroyed, from the
                      ADR-045 chain (ADR-068, #774).
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        eventType:
                          type: string
                          enum:
                            [
                              spe.attestation,
                              spe.key_release,
                              spe.key_refused,
                              spe.workspace_loaded,
                              spe.workspace_destroyed,
                              spe.optout_synced,
                            ]
                        recorded: { type: [string, "null"] }
                        speId: { type: [string, "null"] }
                        permitId: { type: [string, "null"] }
                        policyHash: { type: [string, "null"] }
                        teeType: { type: [string, "null"] }
                        attestationScope: { type: [string, "null"] }
                        simulated: { type: [boolean, "null"] }
                        outcome: { type: [string, "null"] }
                        optOut:
                          description: >
                            spe.optout_synced only: the hub's Art. 71
                            opt-out labels pushed into the workspace, counts
                            only, never patient ids.
                          type: [object, "null"]
                          properties:
                            added: { type: [integer, "null"] }
                            removed: { type: [integer, "null"] }
                            inHub: { type: [integer, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Needs EDC_ADMIN or HDAB_AUTHORITY" }

  /api/admin/spe:
    get:
      tags: [Admin]
      summary: The confidential SPEs of ADR-068 (operator and access body)
      x-required-roles: [EDC_ADMIN, HDAB_AUTHORITY]
      description: >
        Passes the query proxy's `/spe/status` through (#774). When the proxy
        has none yet or cannot be reached, answers without asking the proxy
        anything else, with `fallback.reason`: SPE-1, and SPE-2 only when the
        UI's `NEO4J_SPE2_CONFIGURED` is "true" or "1", every SPE labelled
        "Simulated attestation", status "unreachable", nothing attested and
        `attestation: null`.
      responses:
        "200":
          description: Where each SPE runs, what proves it, and its permit
          content:
            application/json:
              schema:
                type: object
                required: [environment, trustee, spes, residualTrust]
                properties:
                  environment: { type: string, enum: [azure, local, static] }
                  trustee:
                    type: [object, "null"]
                    properties:
                      url: { type: [string, "null"] }
                      operator: { type: string }
                      verifier: { type: string }
                      reachable: { type: boolean }
                  spes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        holder: { type: string }
                        runsOn: { type: string }
                        teeType: { type: string }
                        attestationScope:
                          { type: string, enum: [node, workload, none] }
                        simulated: { type: boolean }
                        label:
                          type: string
                          enum:
                            [
                              "Simulated attestation",
                              "Attested: SEV-SNP node",
                              "Attested: confidential workload",
                            ]
                        attestedAt:
                          { type: [string, "null"], format: date-time }
                        keyReleasedAt:
                          { type: [string, "null"], format: date-time }
                        permitId: { type: [string, "null"] }
                        policyHash: { type: [string, "null"] }
                        policyCheckedByHardware: { type: boolean }
                        patients: { type: [integer, "null"] }
                        status:
                          type: string
                          enum: [ready, loading, refused, unreachable]
                        powerState:
                          description: >
                            ADR-072: the ACI group's power state on Azure
                            combined with the proxy's read; the read alone
                            elsewhere.
                          type: string
                          enum: [running, starting, stopped, unreachable]
                        armState:
                          type: [string, "null"]
                          description: The group's instanceView.state on Azure
                        lastQueriedAt:
                          type: [string, "null"]
                          format: date-time
                          description: The last federated query that asked it
                        attestation:
                          description: >
                            The evidence the Trustee verified; null in the
                            fallback and before the first attestation.
                          type: [object, "null"]
                          properties:
                            verifier: { type: [string, "null"] }
                            result:
                              {
                                type: [string, "null"],
                                enum: [pass, fail, null],
                              }
                            evidenceDigest: { type: [string, "null"] }
                            tokenIssuedAt:
                              { type: [string, "null"], format: date-time }
                            tokenExpiresAt:
                              { type: [string, "null"], format: date-time }
                            policyId: { type: [string, "null"] }
                            claims:
                              type: [object, "null"]
                              properties:
                                tee: { type: [string, "null"] }
                                measurement: { type: [string, "null"] }
                                reportedTcb: { type: [string, "null"] }
                                hostData: { type: [string, "null"] }
                                reportData: { type: [string, "null"] }
                                pcrs:
                                  type: [object, "null"]
                                  additionalProperties: { type: string }
                                vmId: { type: [string, "null"] }
                            refusalReason: { type: [string, "null"] }
                  residualTrust: { type: array, items: { type: string } }
                  fallback:
                    type: object
                    properties:
                      reason: { type: string }
                  power:
                    description: Whether this caller may start and stop the workspaces (ADR-072)
                    type: object
                    properties:
                      available: { type: boolean }
                      reason: { type: [string, "null"] }
                  permits:
                    description: >
                      The data permits (HDABApproval) the hub records a policy
                      hash or Trustee resource for (#833), read from the hub
                      graph, so a stopped workspace still shows its permit.
                      Empty when the hub does not answer within three seconds.
                    type: array
                    items:
                      type: object
                      properties:
                        permitId: { type: string }
                        name: { type: [string, "null"] }
                        status: { type: [string, "null"] }
                        policyHash:
                          type: [string, "null"]
                          description: The hash recorded last
                        policyHashBySpe:
                          type: object
                          description: Each workspace's hash, e.g. SPE-1 to sha256:...
                          additionalProperties: { type: string }
                        speWorkspaces: { type: array, items: { type: string } }
                        trusteeResources:
                          type: array
                          items: { type: string }
                          description: e.g. default/spe-1/extract-key
                        recordedAt:
                          { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Needs EDC_ADMIN or HDAB_AUTHORITY" }

  /api/admin/spe/power:
    post:
      tags: [Admin]
      summary: Start or stop the SPE workspaces (operator and access body)
      x-required-roles: [EDC_ADMIN, HDAB_AUTHORITY]
      description: >
        ADR-072. Starts or stops the ACI confidential container groups
        mvhd-spe-1 and mvhd-spe-2 with the UI's managed identity. A start takes
        about 3 to 4 minutes: attest to Trustee, release the key, load the
        sealed extract. 403 also when the hub's identity lacks the built-in
        "Azure Container Instances Contributor Role" on the groups; the body
        then names the role and the command an owner runs. 501 off Azure. The
        static demo answers 202 with `static: true` and starts nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, spe]
              properties:
                action: { type: string, enum: [start, stop] }
                spe: { type: string, enum: [SPE-1, SPE-2, all] }
      responses:
        "202":
          description: The start or stop is under way
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string, enum: [start, stop] }
                  static: { type: boolean }
                  spes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        group: { type: string }
                        state: { type: string, enum: [starting, stopped] }
                        etaSeconds: { type: integer }
        "400":
          description: Unknown action or workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The caller is not the operator or the access body, or the hub's
            identity lacks the role (then with `role` and `command`)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  role: { type: string }
                  command: { type: string }
        "404":
          description: The container group does not exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: Not the Azure deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: ARM refused for another reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/components:
