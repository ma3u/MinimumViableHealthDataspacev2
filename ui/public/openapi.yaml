  /api/participants:
    get:
      tags: [Participants]
      summary: List dataspace participants
      responses:
        "200":
          description: Participant list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Participant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Participants]
      summary: Create a new participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, role]
              properties:
                displayName: { type: string }
                organization: { type: string }
                role: { type: string }
                ehdsParticipantType: { type: string }
      responses:
        "201":
          description: Participant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: >-
            The CFM Tenant Manager did not answer, so nothing was registered.
            On the hosted demo the provisioning stack runs Monday to Friday,
            07:00 to 20:00 Europe/Berlin (ADR-042).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  detail: { type: string }
                  upstreamError: { type: string }

  /api/participants/{id}:
    patch:
      tags: [Participants]
      summary: Update a participant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                organization: { type: string }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Participants]
      summary: Remove a participant registered through /onboarding (EDC_ADMIN)
      x-required-roles: [EDC_ADMIN]
      description: >-
        Removes the issuer holder, the siglet transfer type mapping, the
        IdentityHub participant and the control plane context, the context
        last; with CFM_TENANT_URL set, the participant's CFM tenant and profile
        first (ADR-085). A participant without registeredAt, one of the seeded
        five, is refused with 409 and nothing is touched.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed; complete is false when a step failed
          content:
            application/json:
              schema:
                type: object
                required: [removed, did, complete, steps]
                properties:
                  removed: { type: string }
                  did: { type: string }
                  complete: { type: boolean }
                  steps:
                    type: array
                    items:
                      type: object
                      required: [step, ok]
                      properties:
                        step: { type: string }
                        ok: { type: boolean }
                        detail: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not an EDC_ADMIN }
        "404": { description: No context with this id }
        "409": { description: A seeded participant; nothing was removed }

  /api/participants/me:
    get:
      tags: [Participants]
      summary: Current authenticated participant profile
      responses:
        "200":
          description: The CFM tenants this login administers
