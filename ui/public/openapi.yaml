            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/participants/{id}/credentials:
    get:
      tags: [Participants]
      summary: List credentials for a participant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Credentials list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/tasks:
    get:
      tags: [Tasks]
      summary: Aggregated contract negotiation + transfer task list
      description: Scoped to the user's organisation; admins see all.
      responses:
        "200":
          description: Task list with per-state counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  counts:
                    type: object
                    description: How many tasks sit in each state.
                  source:
                    type: string
                    enum: [edc, store]
                    description: >-
                      Who answered: the connector's management API, or the
                      tasks the hub last synced to its store when the
                      connector could not be reached (#571).
                  backend:
                    type: object
                    description: What failed on the way, when `source` is not the connector.
                    properties:
                      edc: { type: string }
                      store: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: Neither the connector nor the task store answered; both errors in `backend`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  tasks: { type: array, items: {} }
                  counts: { type: object }
                  backend:
                    type: object
                    properties:
                      edc: { type: string }
                      store: { type: string }

  /api/trust-center:
    get:
      tags: [Trust Center]
      summary: Trust Center operator view
      x-required-roles: [EDC_ADMIN, TRUST_CENTER_OPERATOR]
      responses:
        "200": { description: Trust state }
        "403": { description: "Needs EDC_ADMIN or TRUST_CENTER_OPERATOR" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/federated:
    get:
      tags: [Federated]
      summary: Federated cross-site cohort query (k-anonymity)
      responses:
        "200": { description: Cohort summary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: >
            An SPE workspace is stopped or still starting (ADR-072); a
            stopped one has been started when the caller may
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeColdStart" }

  /api/nlq:
    get:
      tags: [NLQ]
      summary: List NLQ templates
      responses:
        "200": { description: Template list }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [NLQ]
      summary: Run a Text2Cypher natural language query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
                templateId: { type: string, default: auto }
                federated:
                  type: boolean
                  description: Ask every SPE workspace, not the hub graph
      responses:
        "200": { description: NLQ result }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: Proxy error }
        "503":
          description: >
            A federated question needs an SPE workspace that is stopped or
            still starting (ADR-072)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeColdStart" }

  /api/eehrxf:
    get:
      tags: [EEHRxF]
      summary: EEHRxF profile catalog (Layer 2b)
      responses:
        "200": { description: Profile list }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/analytics:
    get:
      tags: [Analytics]
