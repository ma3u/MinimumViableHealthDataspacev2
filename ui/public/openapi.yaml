openapi: 3.1.0
info:
  title: EHDS Integration Hub REST API
  version: "2.1.0"
  description: |
    REST API of the **EHDS Integration Hub** reference implementation:
    Regulation (EU) 2025/327 on a connector stack of Eclipse EDC 1.0
    (control plane, IdentityHub, IssuerService) with CFM for tenants.

    ## Sign in first

    Every route needs a session, except `/api/health`, the sign-in flows and
    the Klarbefund app's own account creation (ADR-044, ADR-054). Sign in to the hub in the browser (`/auth/signin`); the
    explorers on `/docs/developer/reference` and `/docs/developer/api` then
    send the session cookie with every request. Without a session a route
    answers `401 { "error": "Unauthorized" }`, with the wrong role
    `403 { "error": "Forbidden" }`.

    Start as `edcadmin`. The operator may call most operations. The ones
    that answer only another role carry `x-required-roles` and a `403`
    response that names the roles.

    | Sign in as | Role | Opens |
    | --- | --- | --- |
    | `edcadmin` | `EDC_ADMIN` | Start here: Admin, Participants, Assets, Catalog, Negotiations, Transfers, Trust Center, and every read but a patient's phone and wallet |
    | `regulator` | `HDAB_AUTHORITY` | Access Body: the clock, permits, findings, information requests. Admin: audit trail, retention, policies, secure processing environments |
    | `researcher` | `DATA_USER` | Access Body: applications, data requests, results. Negotiations, Transfers, Analytics and NLQ as a data user sees them: pseudonyms, nobody who opted out |
    | `clinicuser`, `lmcuser` | `DATA_HOLDER` | Catalog: publish and withdraw a dataset. Access Body: decide a data request |
    | `patient1`, `patient2` | `PATIENT` | Patient: the own record only, the opt-out, a consent per programme, the app pairing, the wallet link |
    | `edcadmin` | `TRUST_CENTER_OPERATOR` | Trust Center. No demo user holds this role; the operator may read it |

    The demo users are in `jad/keycloak-realm.json` (realm `edcv`); on the
    demo realm each one's password is its user name.

    ## What is behind it

    - **DSP 2025-1**: catalogue, contract negotiation and transfer, through
      the EDC 1.0 Management API (`/v5/participants/{context}/...`)
    - **DCP v1.0**: verifiable credentials, through IdentityHub and
      IssuerService (`/v1/participants/{context}/...`)
    - **FHIR R4** and **OMOP CDM v5.4**: clinical data and analytics, served
      by the Neo4j proxy
    - **HealthDCAT-AP Release 8**: dataset catalogue metadata (ADR-063)
    - **ODRL 2.2**: policies on data products
    - **GDPR Art. 15 to 22**: the patient's rights

    This document describes the hub's own API: the Next.js 15 App Router
    handlers under `ui/src/app/api/`. The connector's Management, Identity
    and Issuer APIs and the Neo4j proxy are not public; the hub calls them,
    and `bruno/MVHDv2/10 Connecting partner` and `11 Platform` exercise them
    on a local stack. In the static GitHub Pages export there are no API
    routes: requests fall back to the fixtures in `ui/public/mock/*.json`
    through `fetchApi()` in `ui/src/lib/api.ts`.
  contact:
    name: MVHDv2 Maintainers
    url: https://github.com/ma3u/MinimumViableHealthDataspacev2
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  # The explorer pages override this at run time with the origin the page
  # is served from, so every "Try it" request goes to the hub the reader is
  # signed in to. The order below only matters when a reader picks another
  # environment by hand or generates a client.
  - url: https://ehds.mabu.red
    description: Azure demo (stopped off hours, ADR-053)
  - url: http://localhost:3003
    description: Local JAD stack (docker-compose.jad.yml)
  - url: http://localhost:3000
    description: Local dev (npm run dev)
  - url: https://ma3u.github.io/MinimumViableHealthDataspacev2
    description: GitHub Pages static export (fixtures under /mock, no API routes)

tags:
  - name: Health
    description: The liveness and readiness probe. No session needed.
  - name: Auth
    description: >
      The sign-in flows: where Keycloak is, and the EUDI Wallet sign-in.
      They answer without a session, because they are how one starts.
  - name: Catalog
    description: >
      HealthDCAT-AP datasets. Any signed-in participant reads; publishing
      and withdrawing needs `DATA_HOLDER` (`clinicuser`) or `EDC_ADMIN`.
  - name: Graph
    description: The knowledge graph and the overview. Any signed-in participant; the role decides whether a patient shows as a name or a pseudonym.
  - name: Patient
    description: >
      A person's own record, opt-out, consents, phone and wallet. Sign in as
      `patient1` (`PATIENT`): a patient sees the own record only. `EDC_ADMIN`
      may name a record on most of them; the phone and the wallet link answer
      only the patient. The `/api/patient/app/...` routes take the
      Klarbefund app's token, not a session.
  - name: Compliance
    description: The compliance summary and the test suite results. Any signed-in participant.
  - name: Access Body
    description: >
      The procedures of Chapter IV of Regulation (EU) 2025/327: applications,
      data requests, permits, findings, information requests, results, and
      the public registers. Any signed-in participant reads. Filing needs
      `DATA_USER` (`researcher`) or `EDC_ADMIN`; deciding needs
      `HDAB_AUTHORITY` (`regulator`), which the operator does not hold.
  - name: Credentials
    description: Verifiable credentials through IdentityHub and IssuerService (DCP v1.0). Any signed-in participant.
  - name: Negotiations
    description: DSP 2025-1 contract negotiations through the EDC 1.0 Management API. Any signed-in participant.
  - name: Transfers
    description: DSP 2025-1 transfers and the import into a secure processing environment. Any signed-in participant; a transfer for secondary use needs a valid data permit.
  - name: Assets
    description: The connector's assets. Any signed-in participant.
  - name: Participants
    description: Participant contexts on the control plane and their CFM tenants. Any signed-in participant reads and registers; removing one needs `EDC_ADMIN`.
  - name: Tasks
    description: Open negotiations and transfers as one list. Any signed-in participant.
  - name: Trust Center
    description: Pseudonym resolution and SPE sessions. `TRUST_CENTER_OPERATOR` or `EDC_ADMIN`; no demo user holds the first, so sign in as `edcadmin`.
  - name: Federated
    description: The federated catalogue the crawler collects. Any signed-in participant.
  - name: NLQ
    description: Natural-language query. Any signed-in participant; a data user's query never reads a patient's identity.
  - name: EEHRxF
    description: The European EHR exchange format profiles. Any signed-in participant.
  - name: Analytics
    description: OMOP cohort statistics. Any signed-in participant; secondary-use roles and patients read them without anyone who opted out.
  - name: ODRL
    description: The ODRL scope a participant holds. Any signed-in participant.
  - name: Admin
    description: >
      Operating the dataspace. Sign in as `edcadmin` (`EDC_ADMIN`). The audit
      trail, its retention, the policies and the secure processing
      environments also answer `HDAB_AUTHORITY` (`regulator`).

components:
  securitySchemes:
    nextAuthSession:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        The NextAuth.js session cookie the hub sets after a Keycloak (realm
        `edcv`) or EUDI Wallet sign-in at `/auth/signin`. Over HTTPS its name
        is `__Secure-next-auth.session-token`. It is HttpOnly: a browser
        sends it by itself to the hub it signed in to, so the explorers need
        no value here. For curl or a generated client, copy the cookie from
        the browser's developer tools; it lasts eight hours.
    dspCatalogToken:
      type: http
      scheme: bearer
      description: |
        The machine credential of the catalogue crawler (ADR-020, ADR-036):
        `Authorization: Bearer <DSP_CATALOG_TOKEN>`. Only the demo DSP
        catalogue endpoint takes it, in place of a session.
    klarbefundAppToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Keycloak access token issued to the public client `klarbefund-app`
        by the device grant the patient screen starts (ADR-049, #473). Every
        call but registration also sends `X-Klarbefund-Device` naming a
        connected phone.

  schemas:
    OptOutState:
      type: object
      required: [patientId, optedOut, since, history, article]
      properties:
        patientId: { type: string }
        optedOut: { type: boolean }
        since: { type: [string, "null"] }
        history:
          type: array
          items:
            type: object
            required: [optOutId, optedOutAt]
            properties:
              optOutId: { type: string }
              optedOutAt: { type: string }
              source: { type: [string, "null"] }
              reversedAt: { type: [string, "null"] }
              reversalSource: { type: [string, "null"] }
        article: { type: string }
        message: { type: string }
    AppConnection:
      type: object
      required: [deviceId, deviceName, username, connectedAt]
      properties:
        deviceId: { type: string, format: uuid }
        deviceName: { type: string }
        username: { type: string }
        connectedAt: { type: string, format: date-time }
        lastSeenAt: { type: [string, "null"], format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SpeColdStart:
      description: >
        A federated query needs an SPE workspace that is not up (ADR-072).
        A stopped workspace is started when the caller may (EDC_ADMIN,
        HDAB_AUTHORITY, DATA_USER); `Retry-After` carries `spe.etaSeconds`.
      type: object
      required: [error, spe, spes, started]
      properties:
        error: { type: string }
        spe: { $ref: "#/components/schemas/SpeColdStartEntry" }
        spes:
          type: array
          items: { $ref: "#/components/schemas/SpeColdStartEntry" }
        started:
          type: boolean
          description: True when this request started at least one workspace
    SpeColdStartEntry:
      type: object
      required: [id, state, etaSeconds]
      properties:
        id: { type: string, enum: [SPE-1, SPE-2] }
        state: { type: string, enum: [starting, stopped] }
        etaSeconds: { type: integer, example: 240 }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        neo4j: { type: boolean }
        keycloak: { type: boolean }
        timestamp: { type: string, format: date-time }
    GraphResponse:
      type: object
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/GraphNode" }
        links:
          type: array
          items: { $ref: "#/components/schemas/GraphEdge" }
        persona: { type: string }
        question: { type: string }
        isolatedRemoved:
          type: integer
          description: Nodes dropped because the layer filter left them unconnected.
    GraphNode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        layer: { type: string, enum: [l1, l2, l3, l4, l5] }
        properties: { type: object, additionalProperties: true }
    GraphEdge:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        type: { type: string }
    HealthDataset:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        publisher: { type: string }
        license: { type: string, format: uri }
        datasetType: { type: string, format: uri }
        legalBasis: { type: string }
        recordCount: { type: [integer, "null"] }
        theme: { type: [string, "null"] }
        healthCategories:
          description: >
            Art. 51(1) categories as HealthDCAT-AP health-category codes
            (EHRS, MRMR, ...), as the data holder stated them in the editor.
          type: [array, "null"]
          items: { type: string }
        populationCoverage: { type: [string, "null"] }
        numberOfUniqueIndividuals: { type: [integer, "null"] }
        minTypicalAge: { type: [integer, "null"] }
        maxTypicalAge: { type: [integer, "null"] }
        translations:
          description: >
            Title, description and keywords in the languages the dataset has
            besides English (#782), keyed by ISO 639-1 code (de, fr, nl, es).
            English is title and description above; a missing text falls
            back to it.
          type: object
          additionalProperties:
            type: object
            properties:
              title: { type: string }
              description: { type: string }
              keywords:
                type: array
                items: { type: string }
        accessBody:
          description: The health data access body that governs the dataset.
          type: [string, "null"]
        accessBodyCountry:
          description: Its country, ISO 3166-1 alpha-2.
          type: [string, "null"]
        providers:
          type: array
          items: { type: string }
        consumers:
          type: array
          items: { type: string }
        transfers:
          type: array
          items: { type: object }
        fhirResources:
          type: array
          items: { type: string }
        conformsTo:
          type: array
          items: { type: string, format: uri }
    Jurisdiction:
      type: object
      required: [code, name, laws, milestones, accessBodies, participants]
      properties:
        code: { type: string, description: ISO 3166-1 alpha-2 }
        name: { type: string }
        nameNative: { type: string }
        languages:
          type: array
          items: { type: string }
        accessBodyRole:
          {
            type: string,
            description: The legal role,
            in the national language,
          }
        accessBodyRoleEn: { type: string }
        designationStatus: { type: string }
        optOutModel: { type: string }
        fees: { type: string }
        summary: { type: string }
        sources:
          type: array
          items: { type: string, format: uri }
        laws:
          type: array
          items:
            type: object
            properties:
              lawId: { type: string }
              title: { type: string }
              titleEn: { type: string }
              citation: { type: [string, "null"] }
              year: { type: [integer, "null"] }
              url: { type: [string, "null"], format: uri }
              status: { type: string, enum: [IN_FORCE, BILL, DRAFT] }
        milestones:
          type: array
          items:
            type: object
            properties:
              milestoneId: { type: string }
              date: { type: string }
              label: { type: string }
              scope: { type: string, enum: [EU, NATIONAL] }
              status: { type: string, enum: [DONE, PLANNED] }
        accessBodies:
          type: array
          items: { $ref: "#/components/schemas/ParticipantRef" }
        participants:
          type: array
          items: { $ref: "#/components/schemas/ParticipantRef" }
    ParticipantRef:
      type: object
      properties:
        participantId: { type: string }
        name: { type: string }
        type: { type: [string, "null"] }
    Patient:
      type: object
      properties:
        id: { type: string }
        resourceId: { type: string }
        name: { type: string }
        birthDate: { type: string, format: date }
        gender: { type: string }
        city: { type: string }
        country: { type: string }
    PatientIndex:
      type: object
      description: >
        What GET /api/patient answers. The session narrows it: a PATIENT sees
        only their own record with `restricted` true (EHDS Art. 3, GDPR
        Art. 15); any other authenticated participant sees the demo cohort.
      properties:
        patients:
          type: array
          items: { $ref: "#/components/schemas/Patient" }
        stats: { type: object }
        timeline: { type: array, items: { type: object } }
        restricted:
          type: boolean
          description: True when the list was narrowed to the caller's own record.
        lastEhrSync:
          type: [object, "null"]
          properties:
            at: { type: string, format: date-time }
            source: { type: string }

    PatientProfileIndex:
      type: object
      description: What GET /api/patient/profile answers without a patientId.
      properties:
        patients:
          type: array
          items: { $ref: "#/components/schemas/Patient" }

    Tenant:
      type: object
      description: A CFM tenant, as GET /api/participants/me lists them.
      properties:
        id: { type: string }
        version: { type: integer }
        properties: { type: object }
        participantProfiles: { type: array, items: { type: object } }
        provisioningStalled:
          type: boolean
          description: True when a VPA has been pending long enough to be stuck (#318).
        provisioningComplete:
          type: boolean
          description: >
            Without CFM, true when the participant's context holds its
            membership credential.
        provisioningFailed: { type: boolean }
        stalledReason:
          type: string
          description: Present when provisioningStalled is true.
        vpaSummary:
          type: object
          properties:
            total: { type: integer }
            pending: { type: integer }
            pendingTypes: { type: array, items: { type: string } }
            oldestPendingSince: { type: [string, "null"], format: date-time }
            stalled: { type: boolean }

    PatientProfile:
      type: object
      properties:
        patient: { $ref: "#/components/schemas/Patient" }
        encounters: { type: array, items: { type: object } }
        conditions: { type: array, items: { type: object } }
        observations: { type: array, items: { type: object } }
        medications: { type: array, items: { type: object } }
    Participant:
      type: object
      required: ["@id", displayName]
      properties:
        "@context": { type: array, items: {} }
        "@id": { type: string }
        "@type": { type: string }
        participantId: { type: string }
        identity:
          type: string
          description: The participant's did:web, as the EDC layer resolves it.
        slug: { type: string }
        state: { type: string }
        properties: { type: object }
        displayName: { type: string }
        role:
          type: string
          enum:
            [
              DATA_HOLDER,
              DATA_USER,
              HDAB_AUTHORITY,
              EDC_ADMIN,
              PATIENT,
              TRUST_CENTER_OPERATOR,
              EDC_USER_PARTICIPANT,
            ]
        cfm:
          description: >-
            Present only when the hub provisions through CFM (CFM_TENANT_URL
            set, ADR-085) and the Tenant Manager answered: what CFM holds for
            this participant, or null for a context CFM did not provision,
            such as the seeded five.
          type: [object, "null"]
          required: [tenantId, profileId, state]
          properties:
            tenantId: { type: string }
            profileId: { type: string }
            state:
              type: string
              enum: [active, pending, disposed, error]
            detail:
              type: string
              description: The profile's error, when state is error.

    NegotiationRequest:
      type: object
      required: [participantId, counterPartyAddress, assetId]
      properties:
        participantId: { type: string }
        counterPartyAddress: { type: string }
        counterPartyId: { type: string }
        providerDid: { type: string }
        offerId: { type: string }
        assetId: { type: string }
        policyId: { type: string }
    Negotiation:
      type: object
      properties:
        "@id": { type: string }
        "@type": { type: string }
        state:
          type: string
          enum:
            [
              INITIAL,
              REQUESTING,
              REQUESTED,
              OFFERED,
              ACCEPTING,
              ACCEPTED,
              AGREEING,
              AGREED,
              FINALIZING,
              FINALIZED,
              TERMINATED,
            ]
        "@context": { type: array, items: {} }
        type: { type: string }
        assetId: { type: string }
        contractAgreementId: { type: string }
        correlationId: { type: string }
        counterPartyAddress: { type: string }
        counterPartyId: { type: string }
        protocol: { type: string }
        callbackAddresses: { type: array, items: { type: object } }
        createdAt: { type: integer, description: Epoch milliseconds. }
        source:
          type: string
          enum: [controlplane, demo, mock]
          description: Which of the three merged sources this row came from (#358).
        openable:
          type: boolean
          description: Whether GET /api/negotiations/{id} can serve this row.
    TransferRequest:
      type: object
      required: [participantId, contractId, counterPartyAddress]
      properties:
        participantId: { type: string }
        contractId: { type: string }
        counterPartyAddress: { type: string }
        assetId: { type: string }
        transferType:
          type: string
          enum: [HttpData-PULL, HttpData-PUSH]
    TransferProcess:
      type: object
      properties:
        "@id": { type: string }
        "@type": { type: string }
        state: { type: string }
        contractId: { type: string }
        assetId: { type: string }
        transferType: { type: string }
        "@context": { type: array, items: {} }
        type: { type: string }
        correlationId: { type: string }
        callbackAddresses: { type: array, items: { type: object } }
        dataplaneMetadata: { type: object }
        stateTimestamp: { type: integer, description: Epoch milliseconds. }
        source:
          type: string
          enum: [controlplane, demo, mock]
          description: Which of the three merged sources this row came from (#358).
        openable:
          type: boolean
          description: Whether GET /api/transfers/{id} can serve this row.
    Asset:
      type: object
      required: [participantId, assetId, name]
      properties:
        participantId: { type: string }
        assetId: { type: string }
        name: { type: string }
        description: { type: string }
        contentType: { type: string }
        dataAddress:
          type: object
          properties:
            "@type": { type: string }
            type: { type: string }
            baseUrl: { type: string }
    Credential:
      type: object
      properties:
        id: { type: string }
        type:
          type: array
          items: { type: string }
        issuer: { type: string }
        credentialSubject: { type: object }
        issuanceDate: { type: string, format: date-time }
        proof: { type: object }
    OdrlPolicy:
      type: object
      properties:
        "@id": { type: string }
        "@type": { type: string }
        policy:
          type: object
          properties:
            "@type": { type: string, enum: [Set, Offer, Agreement] }
            permission: { type: array, items: { type: object } }
            prohibition: { type: array, items: { type: object } }
            obligation: { type: array, items: { type: object } }
    Task:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [negotiation, transfer] }
        state: { type: string }
        participantId: { type: string }
        updatedAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        action: { type: string }
        actor: { type: string }
        target: { type: string }
        outcome: { type: string }
    Component:
      type: object
      properties:
        name: { type: string }
        kind: { type: string }
        version: { type: string }
        url: { type: string }
        health: { type: string, enum: [up, down, degraded] }

  parameters:
    ParticipantId:
      name: participantId
      in: query
      description: >
        A participant context id on the control plane, as GET
        /api/participants lists them. Optional here: without it the route
        answers for every context.
      schema: { type: string }
    ParticipantIdRequired:
      name: participantId
      in: query
      required: true
      description: >
        The participant context id on the control plane whose negotiations
        or transfers are meant, as GET /api/participants lists them (`@id`).
      schema: { type: string }
    PatientId:
      name: patientId
      in: query
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but missing required role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - nextAuthSession: []

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/catalog/jsonld:
    get:
      tags: [Catalog]
      summary: A dataset, or the catalogue, in HealthDCAT-AP Release 8 JSON-LD
      description: >
        Passed through from the neo4j-proxy, whose output CI validates with the
        official Release 8 SHACL for non-public health data (#700).
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: JSON-LD (application/ld+json)
          content:
            application/json:
              schema:
                type: object
                required: ["@context", "@type"]
                properties:
                  "@context": { type: object }
                  "@type": { type: string }
                  "@id": { type: string }
                  "dct:identifier": { type: string }
                  "dct:title": { type: string }
                  "dct:description": { type: string }
                  "dct:accessRights": { type: object }
                  "dcatap:applicableLegislation": { type: array }
                  "dct:type": { type: object }
                  "dcat:theme": { type: object }
                  "dcat:dataset":
                    type: array
                    description: Without `id`, the datasets of the catalogue.
                    items: { type: object }
                  "dcat:themeTaxonomy":
                    type: object
                    description: Without `id`, the theme vocabulary the catalogue uses.
                  "dcat:keyword": { type: array }
                  "dct:provenance": { type: object }
                  "healthdcatap:healthCategory": { type: array }
                  "healthdcatap:healthTheme": { type: array }
                  "dct:language": { type: object }
                  "dcat:landingPage": { type: object }
                  "dpv:hasPurpose": { type: object }
                  "dpv:hasLegalBasis": { type: object }
                  "healthdcatap:hasCodingSystem": { type: array }
                  "healthdcatap:hasStructuredData": { type: object }
                  "healthdcatap:numberOfRecords": { type: object }
                  "healthdcatap:numberOfUniqueIndividuals": { type: object }
                  "healthdcatap:minTypicalAge": { type: object }
                  "healthdcatap:maxTypicalAge": { type: object }
                  "dct:temporal": { type: object }
                  "healthdcatap:retentionPeriod": { type: object }
                  "healthdcatap:populationCoverage": { type: object }
                  "healthdcatap:hasCodeValues": { type: array }
                  "healthdcatap:analytics": { type: object }
                  "dct:accrualPeriodicity": { type: object }
                  "dcat:temporalResolution": { type: object }
                  "dct:license": { type: object }
                  "foaf:page": { type: object }
                  "dct:issued": { type: string }
                  "dct:conformsTo": { type: object }
                  "healthdcatap:hasVariables": { type: array }
                  "healthdcatap:hdab": { type: object }
                  "geodcatap:custodian": { type: object }
                  "dct:publisher": { type: object }
                  "dcat:contactPoint": { type: object }
                  "dcat:distribution": { type: array }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No dataset with this id }
        "502": { description: The catalogue is unavailable }

  /api/catalog:
    get:
      tags: [Catalog]
      summary: List HealthDCAT-AP datasets
      responses:
        "200":
          description: Dataset list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HealthDataset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Catalog]
      summary: Create HealthDCAT-AP dataset
      x-required-roles: [DATA_HOLDER, EDC_ADMIN]
      description: Requires DATA_HOLDER or EDC_ADMIN role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealthDataset" }
      responses:
        "201": { description: Dataset created }
        "400": { description: id and title are required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Needs DATA_HOLDER or EDC_ADMIN" }
    delete:
      tags: [Catalog]
      summary: Delete dataset
      x-required-roles: [DATA_HOLDER, EDC_ADMIN]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Needs DATA_HOLDER or EDC_ADMIN" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/jurisdictions:
    get:
      tags: [Catalog]
      summary: National implementation profiles of the EHDS
      description: >
        How DE, AT, BE, FR, NL and ES implement the secondary use of
        Regulation (EU) 2025/327 (#782): the legal role of the access body,
        the national laws, the opt-out (Art. 71), fees (Art. 62) and dates,
        each with its official source, and which of the hub's fictional
        participants is under which. Any signed-in participant (ADR-044).
      responses:
        "200":
          description: The profiles
          content:
            application/json:
              schema:
                type: object
                required: [reviewedOn, regulation, jurisdictions]
                properties:
                  reviewedOn:
                    {
                      type: string,
                      description: ISO date the profiles were last checked against their sources,
                    }
                  regulation:
                    type: object
                    properties:
                      title: { type: string }
                      eli: { type: string, format: uri }
                  jurisdictions:
                    type: array
                    items: { $ref: "#/components/schemas/Jurisdiction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: No profiles in the graph and none bundled }

  /api/graph:
    get:
      tags: [Graph]
      summary: Load 5-layer knowledge graph
      parameters:
        - name: layer
          in: query
          schema: { type: string, enum: [all, l1, l2, l3, l4, l5] }
        - name: persona
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 1000 }
      responses:
        "200":
          description: Graph payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/graph/expand:
    get:
      tags: [Graph]
      summary: Expand neighborhood around a node
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
        - name: depth
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Expanded subgraph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/graph/node:
    get:
      tags: [Graph]
      summary: Fetch single node with relationships
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Node detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphNode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/graph/validate:
    get:
      tags: [Graph]
      summary: Validate Neo4j schema constraints and counts
      responses:
        "200": { description: Validation result }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/patient:
    get:
      tags: [Patient]
      summary: Patient index and cohort statistics
      responses:
        "200":
          description: Patient index and cohort statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientIndex" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/patient/profile:
    get:
      tags: [Patient]
      summary: Patient profile (encounters, conditions, observations, medications)
      x-required-roles: [EDC_ADMIN, PATIENT]
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: >
            With patientId, that patient's profile. Without it, the index of
            patients the caller may choose from.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PatientProfile"
                  - $ref: "#/components/schemas/PatientProfileIndex"
        "403": { description: "Needs EDC_ADMIN or PATIENT" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/patient/profile/interests:
    put:
      tags: [Patient]
      summary: Choose my health interests from the suggested list
      x-required-roles: [PATIENT]
      description: >
        A patient names their own health interests, chosen from the list the
        profile suggests (`suggestedInterests`). The choice replaces the
        interests computed from the record. Patients only, on their own record
        (EHDS Art. 3, GDPR Art. 16); ids outside the list are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, interests]
              properties:
                patientId: { type: string }
                interests:
                  type: array
                  items:
                    type: string
                    enum:
                      - preventive-care
                      - cardiology
                      - endocrinology
                      - chronic-disease-management
                      - mental-health
                      - longevity
                      - nutrition
                      - sleep
                      - fitness
                      - cancer-screening
                      - respiratory
                      - rare-diseases
      responses:
        "200":
          description: The interests as stored, in the list's order
          content:
            application/json:
              schema:
                type: object
                properties:
                  patientId: { type: string }
                  interests: { type: array, items: { type: string } }
        "400":
          { description: "patientId missing, or an id that is not on the list" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Needs PATIENT" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/patient/insights:
    get:
      tags: [Patient]
      summary: Aggregated patient insights
      x-required-roles: [EDC_ADMIN, PATIENT]
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200": { description: Insight summary }
        "403": { description: "Needs EDC_ADMIN or PATIENT" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/patient/programmes:
    get:
      tags: [Patient]
      summary: List bonus programmes found in other data spaces (#934)
      x-required-roles: [EDC_ADMIN, PATIENT]
      parameters:
        - name: patientId
          in: query
          required: false
          description: The record an operator names; a patient acts on their own.
          schema: { type: string }
      description: >-
        DCAT-AP dcat:DataService offers typed ehds:BonusProgramme, indexed by
        the catalogue crawler and enricher. A programme receives a yes or no per
        year, never the data behind it (ADR-080). PATIENT or EDC_ADMIN.
      responses:
        "200":
          description: Programme list
          content:
            application/json:
              schema:
                type: object
                required: [programmes, consents, legalBasis]
                properties:
                  legalBasis: { type: string }
                  consents:
                    type: array
                    items:
                      type: object
                      properties:
                        consentId: { type: string }
                        programmeId: { type: string }
                        joinedAt: { type: string }
                        withdrawnAt: { type: [string, "null"] }
                  programmes:
                    type: array
                    items:
                      type: object
                      properties:
                        programmeId: { type: string }
                        title: { type: string }
                        description: { type: [string, "null"] }
                        publisherName: { type: string }
                        publisherDid: { type: string }
                        dataSpace: { type: [string, "null"] }
                        endpointUrl: { type: [string, "null"] }
                        ruleTitle: { type: [string, "null"] }
                        ruleDescription: { type: [string, "null"] }
                        ruleVersion: { type: [string, "null"] }
                        lastSeenAt: { type: [string, "null"] }
        "401": { description: No session }
        "403": { description: Not a patient or operator }
  /api/patient/programmes/consent:
    post:
      tags: [Patient]
      summary: Join a bonus programme (consent, GDPR Art. 9(2)(a)) (#934)
      x-required-roles: [EDC_ADMIN, PATIENT]
      description: >-
        Consent to one programme, its own record (ADR-080, decision 6); idempotent
        while a consent is open. A PATIENT joins on their own record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programmeId]
              properties:
                programmeId: { type: string }
                patientId: { type: string }
                source:
                  type: string
                  enum: [patient-portal, klarbefund, api-collection]
                  default: patient-portal
      responses:
        "201":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalBasis: { type: string }
                  consent:
                    type: object
                    properties:
                      consentId: { type: string }
                      programmeId: { type: string }
                      joinedAt: { type: string }
                      withdrawnAt: { type: [string, "null"] }
        "400": { description: programmeId missing or an unknown source }
        "401": { description: No session }
        "403":
          {
            description: "Not a patient or operator, or another person's record",
          }
        "404": { description: No such programme or record }
    delete:
      tags: [Patient]
      summary: Withdraw from a bonus programme (GDPR Art. 7(3))
      x-required-roles: [EDC_ADMIN, PATIENT]
      parameters:
        - name: programmeId
          in: query
          required: true
          schema: { type: string }
        - name: patientId
          in: query
          required: false
          description: The record an operator names; a patient acts on their own.
          schema: { type: string }
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalBasis: { type: string }
                  consent:
                    type: object
                    properties:
                      consentId: { type: string }
                      programmeId: { type: string }
                      joinedAt: { type: string }
                      withdrawnAt: { type: [string, "null"] }
        "403": { description: "Needs EDC_ADMIN or PATIENT" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No open consent to withdraw }
  /api/patient/programmes/evaluation:
    get:
      tags: [Patient]
      summary: The member's own result for a bonus programme year, before anything is sent (#934)
      x-required-roles: [EDC_ADMIN, PATIENT]
      description: >-
        Worked out inside the record (ADR-080, decision 3; ADR-087): goal met
        when the ended year averaged at least 150 minutes of exercise a week
        (LOINC 55411-3) and held one check-up (SNOMED CT 185349003). Nothing
        is sent or stored. Without year, the year the programme's rule names.
        A PATIENT reads their own record; EDC_ADMIN names one.
      parameters:
        - {
            name: programmeId,
            in: query,
            required: true,
            schema: { type: string },
          }
        - { name: year, in: query, required: false, schema: { type: integer } }
        - name: patientId
          in: query
          required: false
          description: The record an operator names; a patient acts on their own.
          schema: { type: string }
      responses:
        "200":
          description: The evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  programmeId: { type: string }
                  evaluation:
                    type: object
                    description: >-
                      status year-not-over carries evaluableFrom; status
                      evaluated carries goalMet and, for the member only,
                      activity (minutesPerWeek, required, weeksWithData, met)
                      and checkUp (count, required, met).
                    properties:
                      year: { type: integer }
                      status: { type: string, enum: [evaluated, year-not-over] }
                      goalMet: { type: boolean }
                      evaluableFrom: { type: string, format: date }
                      activity: { type: object }
                      checkUp: { type: object }
        "400":
          { description: "No programmeId, or a year the rule does not cover" }
        "401": { description: No session }
        "403":
          {
            description: "Not a patient or operator, or another person's record",
          }
        "404": { description: No such programme or record }
  /api/patient/programmes/transfer:
    post:
      tags: [Patient]
      summary: Send a programme the year's answer, on the person's instruction
      x-required-roles: [EDC_ADMIN, PATIENT]
      description: >-
        ADR-080, decision 4, second path. Only under an open consent; after a
        withdrawal the answer is 403. Only for the year the programme's rule
        covers (400) and once that year has ended (409). The hub evaluates the
        year inside the record (#934 step 6, ADR-087) and records the
        programme, the year and goal met, nothing else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programmeId, year]
              properties:
                programmeId: { type: string }
                year: { type: integer, minimum: 2000, maximum: 2100 }
                patientId: { type: string }
      responses:
        "202":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalBasis: { type: string }
                  transfer:
                    type: object
                    properties:
                      transferId: { type: string }
                      programmeId: { type: string }
                      year: { type: integer }
                      goalMet: { type: [boolean, "null"] }
                      status: { type: string }
                      requestedAt: { type: string }
        "400":
          description: "programmeId and a calendar year are required, or a year the rule does not cover"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: No open consent to this programme }
        "404": { description: No such programme or record }
        "409":
          { description: The year is not over; nothing is sent before it ends }
  /api/patient/research:
    get:
      tags: [Patient]
      summary: List research programmes for patient
      x-required-roles: [EDC_ADMIN, PATIENT]
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200": { description: Programme list }
        "403": { description: "Needs EDC_ADMIN or PATIENT" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Patient]
      summary: Grant research consent (GDPR Art. 7)
      x-required-roles: [EDC_ADMIN, PATIENT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, studyId]
              properties:
                patientId: { type: string }
                studyId: { type: string }
                purpose: { type: string, default: RESEARCH }
      responses:
        "201":
          description: Consent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  consentId: { type: string }
        "400": { description: patientId and studyId are required }
        "403": { description: "Needs EDC_ADMIN or PATIENT" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Patient]
      summary: Revoke research consent
      x-required-roles: [EDC_ADMIN, PATIENT]
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - name: studyId
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Consent revoked }
        "403": { description: "Needs EDC_ADMIN or PATIENT" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/patient/opt-out:
    get:
      tags: [Patient]
      summary: My opt-out from secondary use (EHDS Art. 71)
      x-required-roles: [EDC_ADMIN, PATIENT]
      description: >
        Whether the person is opted out, since when, and every earlier opt-out
        and its reversal (ADR-062). A PATIENT reads their own record without
        naming it; EDC_ADMIN names it with patientId.
      parameters:
        - name: patientId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The opt-out state and its history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptOutState"
        "400": { description: No record named and none on the session }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Another person's record }
    post:
      tags: [Patient]
      summary: Opt out of secondary use (EHDS Art. 71)
      x-required-roles: [EDC_ADMIN, PATIENT]
      description: >
        At once and without a reason; idempotent. Every new secondary-use
        extraction leaves the person out; what a permit received before is not
        recalled.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                patientId: { type: string }
                source: { type: string, default: patient-portal }
      responses:
        "200":
          description: Opted out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptOutState"
        "403": { description: "Needs EDC_ADMIN or PATIENT" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No record with this id }
    delete:
      tags: [Patient]
      summary: Reverse the opt-out
      x-required-roles: [EDC_ADMIN, PATIENT]
      parameters:
        - name: patientId
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Opted back in; the earlier opt-out stays on record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptOutState"
        "403": { description: "Needs EDC_ADMIN or PATIENT" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: There is no open opt-out to reverse }

  /api/app-accounts/challenge:
    post:
      tags: [Patient]
      summary: A challenge for the Klarbefund app to have Apple attest
      description: >
        Answers without a session: the app has no account yet. A signed,
        five-minute challenge and nothing else (ADR-054).
      security: []
      responses:
        "200":
          description: The challenge
          content:
            application/json:
              schema:
                type: object
                required: [challenge]
                properties:
                  challenge: { type: string }
        "429": { description: Too many challenges in a minute }
  /api/app-accounts:
    post:
      tags: [Patient]
      summary: Create a sandbox account for the Klarbefund app
      description: >
        Answers without a session, and only to a request whose Apple App
        Attest attestation verifies (ADR-054). Creates a Keycloak login with
        a generated password, an empty record of its own, and connects the
        phone. The password is in this answer once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, keyId, attestation, deviceId]
              properties:
                challenge: { type: string }
                keyId: { type: string, description: base64 App Attest key id }
                attestation:
                  { type: string, description: base64 attestation object }
                deviceId: { type: string, format: uuid }
                deviceName: { type: string }
      responses:
        "201":
          description: The account
          content:
            application/json:
              schema:
                type: object
                required: [username, password, patientId, ehds, issuer, client]
                properties:
                  username: { type: string, example: kb-ab3dk7mn }
                  password: { type: string }
                  patientId: { type: string, example: KB-AB3DK7MN }
                  ehds: { type: string, format: uri }
                  issuer: { type: string, format: uri }
                  client: { type: string, example: klarbefund-account }
        "400": { description: A field is missing }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: This key already created an account }
        "429": { description: Too many accounts }
        "502": { description: Keycloak or Neo4j failed }
        "503": { description: Account creation is not configured on this hub }
  /api/auth/eudi/register:
    post:
      tags: [Patient]
      summary: Create a sandbox account from a verified PID (ADR-067)
      description: >
        Part of the EUDI Wallet sign-in, so it answers without a session.
        Only for a `sid` whose sign-in the status route refused with
        `canRegister: true`: a verified PID whose secure hash is on no
        account. Creates a Keycloak login `kb-…` with a generated password
        and the hash as the attribute `pid_fingerprint`, and an empty record
        of its own; the `sid` then signs in to it once, at assurance high.
        One account per hash; the same rate limit as `/api/app-accounts`.
        The password is in this answer once. The hub keeps neither the name
        nor the birth date of the PID.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sid]
              properties:
                sid: { type: string }
      responses:
        "201":
          description: The account
          content:
            application/json:
              schema:
                type: object
                required: [status, username, password]
                properties:
                  status: { type: string, enum: [completed] }
                  username: { type: string, example: kb-ab3dk7mn }
                  password: { type: string }
        "400": { description: The body is not JSON }
        "403": { description: This sign-in cannot create an account }
        "404": { description: Unknown or expired sign-in }
        "409": { description: This PID already has an account }
        "429": { description: Too many accounts }
        "502": { description: Keycloak or Neo4j failed }
  /api/patient/wallet-link:
    get:
      tags: [Patient]
      summary: Whether the patient's account is linked to an EUDI Wallet PID
      x-required-roles: [PATIENT]
      description: >
        ADR-067. Only a sandbox account (`kb-`) can be linked; a demo persona
        is answered `eligible: false`. The secure hash itself is never
        answered. The link is made by presenting the PID
        (`POST /api/auth/eudi/start` with `{ "purpose": "link" }`).
      responses:
        "200":
          description: The link state
          content:
            application/json:
              schema:
                type: object
                required: [eligible, available, linked]
                properties:
                  eligible: { type: boolean }
                  available:
                    type: boolean
                    description: the hub has the hash key and the account service
                  linked: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Needs PATIENT" }
        "502": { description: Keycloak failed }
    delete:
      tags: [Patient]
      summary: Disconnect the EUDI Wallet (ADR-067)
      x-required-roles: [PATIENT]
      description: >
        Removes the attribute `pid_fingerprint` from the patient's own
        sandbox account; the account stays.
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                required: [linked]
                properties:
                  linked: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a sandbox account }
        "404": { description: The account is gone }
        "502": { description: Keycloak failed }
  /api/patient/observations:
    get:
      tags: [Patient]
      summary: The patient's own record as a FHIR R4 Bundle (EHDS Art. 3, Art. 14)
      x-required-roles: [EDC_ADMIN, PATIENT]
      description: >
        Observations as a FHIR R4 searchset Bundle, each with the range the
        laboratory printed, oldest first per code. With `include=all` the
        Bundle also carries the record's DiagnosticReports (resting ECG,
        imaging), Immunizations (the vaccination record) and
        MedicationStatements (the medication plan), the Art. 14 categories an
        ePA or EHR integrator asks for next (ADR-059). A PATIENT reads their
        own record only; EDC_ADMIN any. Synthetic data, tagged `fictional`.
      parameters:
        - name: patientId
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: false
          schema: { type: string, description: one LOINC code }
        - name: include
          in: query
          required: false
          schema: { type: string, enum: [all] }
      responses:
        "200":
          description: FHIR R4 Bundle
          content:
            application/json:
              schema:
                type: object
                required: [resourceType, type, total, entry]
                properties:
                  resourceType: { type: string, enum: [Bundle] }
                  id: { type: string }
                  meta: { type: object }
                  type: { type: string, enum: [searchset] }
                  total: { type: integer }
                  link:
                    type: array
                    items:
                      type: object
                      properties:
                        relation: { type: string }
                        url: { type: string }
                  entry:
                    type: array
                    items:
                      type: object
                      required: [resource]
                      properties:
                        fullUrl: { type: string }
                        resource:
                          type: object
                          required: [resourceType, id]
                          properties:
                            resourceType:
                              type: string
                              enum:
                                [
                                  Observation,
                                  DiagnosticReport,
                                  Immunization,
                                  MedicationStatement,
                                ]
                            id: { type: string }
        "400": { description: patientId is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: A patient reads their own record only }
        "404": { description: Patient not found }
        "502": { description: Neo4j unavailable }
  /api/patient/app/account:
    delete:
      tags: [Patient]
      summary: Delete the account the Klarbefund app created
      description: >
        The Keycloak login, its record and its phones (ADR-054, App Store
        guideline 5.1.1(v)). The app's token and a connected device; a demo
        persona is refused.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not an account the app created }
        "502": { description: Keycloak or Neo4j failed }
  /api/patient/app-pairing:
    post:
      tags: [Patient]
      summary: Start connecting the Klarbefund app (QR code, device grant)
      x-required-roles: [PATIENT]
      description: >
        Asks Keycloak for a device authorization for `klarbefund-app` and
        answers with the QR code, the `klarbefund://connect` link it carries
        and Keycloak's approval page. The code lives 120 seconds. PATIENT
        session only (ADR-049).
      responses:
        "200":
          description: The pairing
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    pairingId,
                    appLink,
                    qrDataUri,
                    userCode,
                    verificationUri,
                    expiresAt,
                  ]
                properties:
                  pairingId: { type: string, format: uuid }
                  appLink:
                    {
                      type: string,
                      example: "klarbefund://connect?ehds=...&device_code=...",
                    }
                  qrDataUri:
                    { type: string, description: PNG data URI of the QR code }
                  userCode: { type: string, example: ABCD-EFGH }
                  verificationUri: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a patient }
        "429": { description: Too many pairings in a minute }
        "502": { description: Keycloak refused or is unreachable }

  /api/patient/app-pairing/{pairingId}:
    get:
      tags: [Patient]
      summary: State of a pairing this patient started
      x-required-roles: [PATIENT]
      parameters:
        - {
            name: pairingId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: pending, connected (with the phone's name) or expired
          content:
            application/json:
              schema:
                type: object
                required: [pairingId, status, expiresAt]
                properties:
                  pairingId: { type: string, format: uuid }
                  status: { type: string, enum: [pending, connected, expired] }
                  expiresAt: { type: string, format: date-time }
                  deviceName: { type: string }
        "403": { description: "Needs PATIENT" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/patient/app-devices:
    get:
      tags: [Patient]
      summary: The phones this patient connected
      x-required-roles: [PATIENT]
      responses:
        "200":
          description: Connected phones, newest first
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/AppConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Needs PATIENT" }
    post:
      tags: [Patient]
      summary: Register the phone under a pairing (called by the app)
      security:
        - klarbefundAppToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingId, deviceId]
              properties:
                pairingId: { type: string, format: uuid }
                deviceId:
                  {
                    type: string,
                    format: uuid,
                    description: UUID v4 the app generated once,
                  }
                deviceName: { type: string, maxLength: 60 }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection: { $ref: "#/components/schemas/AppConnection" }
        "400": { description: "Not JSON, or deviceId is not a UUID v4" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: No pairing of this login matches }
        "409":
          description: "The QR code already connected a phone, or the device id belongs to another login"

  /api/patient/app-devices/{deviceId}:
    delete:
      tags: [Patient]
      summary: Disconnect a phone
      x-required-roles: [PATIENT]
      description: >
        From the patient screen with a session, for any of the patient's
        phones; or from the app with its token, for its own device only.
      security:
        - nextAuthSession: []
        - klarbefundAppToken: []
      parameters:
        - {
            name: deviceId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                required: [disconnected]
                properties:
                  disconnected: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The app tried to disconnect another device }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/patient/app/wearables:
    post:
      tags: [Patient]
      summary: The Klarbefund app adds the person's weekly device values to their own record
      description: >
        Body: a FHIR R4 Bundle of Observations, one per metric and week, read
        from Apple Health on the phone (ADR-057). Only the five metrics of the
        app's Trends screen are accepted, each with its LOINC code and UCUM
        unit: resting heart rate 40443-4 (/min), heart rate variability SDNN
        80404-7 (ms), steps per day 41950-7 (/d), body weight 29463-7 (kg),
        exercise minutes per day 55411-3 (min/d, ADR-087).
        Status `final`, a plausible value and an `effectivePeriod` of at most a
        week; the rest is answered as skipped. Each sync replaces the previous
        one. Only an account the app created (ADR-054); a demo persona is
        refused.
      security:
        - klarbefundAppToken: []
      parameters:
        - {
            name: X-Klarbefund-Device,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: FHIR R4 Bundle }
      responses:
        "201":
          description: Stored, and why the rest was skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored: { type: integer }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        reason: { type: string }
        "400": { description: Not a FHIR Bundle }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not an account the app created }
        "404": { description: No record is assigned to this login }
        "413": { description: More than 1000 weekly values }
        "429": { description: Too many syncs in a minute }
        "502": { description: Neo4j failed }
  /api/patient/app/programmes:
    get:
      tags: [Patient]
      summary: The Klarbefund app lists bonus programmes and the person's own consents (#934)
      description: >-
        The app-token twin of /api/patient/programmes, from the same queries and
        with the same answer (ADR-080, decision 6). The record is the one the
        login owns; there is no patientId parameter (ADR-049).
      security:
        - klarbefundAppToken: []
      parameters:
        - {
            name: X-Klarbefund-Device,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: The offer and the person's consents, newest first
          content:
            application/json:
              schema:
                type: object
                required: [programmes, consents, legalBasis]
                properties:
                  legalBasis: { type: string }
                  consents: { type: array, items: { type: object } }
                  programmes: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No record is assigned to this login }
  /api/patient/app/programmes/consent:
    post:
      tags: [Patient]
      summary: The Klarbefund app joins a bonus programme (GDPR Art. 9(2)(a)) (#934)
      description: >-
        The app-token twin of POST /api/patient/programmes/consent, recorded with
        source klarbefund. Its own record, separate from study consent and the
        Art. 71 opt-out (ADR-080, decision 6).
      security:
        - klarbefundAppToken: []
      parameters:
        - {
            name: X-Klarbefund-Device,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programmeId]
              properties:
                programmeId: { type: string }
      responses:
        "201":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalBasis: { type: string }
                  consent:
                    type: object
                    properties:
                      consentId: { type: string }
                      programmeId: { type: string }
                      joinedAt: { type: string }
                      withdrawnAt: { type: [string, "null"] }
        "400": { description: programmeId missing }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "No such programme, or no record for this login" }
    delete:
      tags: [Patient]
      summary: The Klarbefund app withdraws from a bonus programme (GDPR Art. 7(3))
      security:
        - klarbefundAppToken: []
      parameters:
        - name: programmeId
          in: query
          required: true
          schema: { type: string }
        - {
            name: X-Klarbefund-Device,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Withdrawn; transfers stop at once
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalBasis: { type: string }
                  consent:
                    type: object
                    properties:
                      consentId: { type: string }
                      programmeId: { type: string }
                      joinedAt: { type: string }
                      withdrawnAt: { type: [string, "null"] }
        "400": { description: programmeId missing }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No open consent to withdraw }
  /api/patient/app/programmes/evaluation:
    get:
      tags: [Patient]
      summary: The Klarbefund app shows the member's own result for a programme year (#934)
      description: >-
        The app-token twin of /api/patient/programmes/evaluation (ADR-049,
        ADR-087), for the login's own record only.
      security:
        - klarbefundAppToken: []
      parameters:
        - {
            name: X-Klarbefund-Device,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: programmeId,
            in: query,
            required: true,
            schema: { type: string },
          }
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: The evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  programmeId: { type: string }
                  evaluation:
                    type: object
                    description: >-
                      status year-not-over carries evaluableFrom; status
                      evaluated carries goalMet and, for the member only,
                      activity (minutesPerWeek, required, weeksWithData, met)
                      and checkUp (count, required, met).
                    properties:
                      year: { type: integer }
                      status: { type: string, enum: [evaluated, year-not-over] }
                      goalMet: { type: boolean }
                      evaluableFrom: { type: string, format: date }
                      activity: { type: object }
                      checkUp: { type: object }
        "400":
          { description: "No programmeId, or a year the rule does not cover" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "No such programme, or no record for this login" }
  /api/patient/app/programmes/transfer:
    post:
      tags: [Patient]
      summary: The Klarbefund app asks the hub to send a programme the year's answer
      description: >-
        The app-token twin of POST /api/patient/programmes/transfer (ADR-080,
        decision 4, second path). Only under an open consent; after a
        withdrawal the answer is 403 and nothing is recorded. Only for the
        year the programme's rule covers (400) and once it has ended (409);
        then evaluated inside the record (ADR-087).
      security:
        - klarbefundAppToken: []
      parameters:
        - {
            name: X-Klarbefund-Device,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programmeId, year]
              properties:
                programmeId: { type: string }
                year: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        "202":
          description: Evaluated and recorded; delivery to the programme is #934 step 8
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalBasis: { type: string }
                  transfer:
                    type: object
                    properties:
                      transferId: { type: string }
                      programmeId: { type: string }
                      year: { type: integer }
                      goalMet: { type: [boolean, "null"] }
                      status: { type: string }
                      requestedAt: { type: string }
        "400":
          description: "programmeId and a calendar year are required, or a year the rule does not cover"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: No open consent to this programme }
        "404": { description: "No such programme, or no record for this login" }
        "409":
          { description: The year is not over; nothing is sent before it ends }
  /api/patient/app/record:
    post:
      tags: [Patient]
      summary: The Klarbefund app adds one report's values to the patient's own record
      description: >
        Body: the FHIR R4 document the app writes for a report. Only
        `preliminary` Observations with a LOINC code are stored, with their
        provenance; the rest is answered as skipped. `X-Klarbefund-Report`
        names the report, so sending it again replaces its values. Only an
        account the app created (ADR-054); a demo persona is refused.
        #473 phase 3.
      parameters:
        - in: header
          name: X-Klarbefund-Report
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: FHIR R4 Bundle }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [stored, skipped]
                properties:
                  stored: { type: integer }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        reason: { type: string }
        "400": { description: "No report id, or not a FHIR Bundle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not an account the app created }
        "413": { description: More than 500 values }
        "429": { description: Too many reports in a minute }
        "502": { description: Neo4j failed }
    get:
      tags: [Patient]
      summary: The connected patient's own record, for the app (EHDS Art. 3)
      description: >
        Observations as a FHIR R4 searchset Bundle, each with the range the
        laboratory printed; the same Bundle /api/patient/observations returns.
        Synthetic data, tagged `fictional`.
      security:
        - klarbefundAppToken: []
      parameters:
        - {
            name: X-Klarbefund-Device,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: FHIR R4 Bundle
          content:
            application/fhir+json:
              schema: { type: object, required: [resourceType, type, entry] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No record is assigned to this login }
  /api/compliance:
    get:
      tags: [Compliance]
      summary: EHDS / GDPR / DSP / DCP compliance summary
      responses:
        "200": { description: Compliance status }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/compliance/tck:
    get:
      tags: [Compliance]
      summary: DSP / DCP / EHDS test suite results
      responses:
        "200": { description: TCK results }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/credentials:
    get:
      tags: [Credentials]
      summary: List W3C Verifiable Credentials held across the dataspace
      responses:
        "200":
          description: Credentials list
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/credentials/definitions:
    get:
      tags: [Credentials]
      summary: List credential definitions registered with IssuerService
      responses:
        "200": { description: Definitions list }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/credentials/request:
    post:
      tags: [Credentials]
      summary: Request a credential issuance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantContextId, credentialType]
              properties:
                participantContextId: { type: string }
                credentialType: { type: string }
      responses:
        "201": { description: Issuance process started }
        "400": { description: Required fields missing }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/credentials/{id}:
    delete:
      tags: [Credentials]
      summary: Revoke a credential
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/negotiations:
    get:
      tags: [Negotiations]
      summary: List DSP contract negotiations
      parameters:
        - $ref: "#/components/parameters/ParticipantIdRequired"
      responses:
        "200":
          description: Negotiation list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Negotiation" }
        "400": { description: participantId is missing }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Negotiations]
      summary: Initiate DSP contract negotiation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NegotiationRequest" }
      responses:
        "201":
          description: Negotiation initiated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Negotiation" }
        "400": { description: Required fields missing }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/negotiations/{id}:
    get:
      tags: [Negotiations]
      summary: Fetch single negotiation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ParticipantIdRequired"
      responses:
        "200":
          description: Negotiation detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Negotiation" }
        "400": { description: participantId is missing }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: The connector has no such negotiation }
        "502": { description: The connector did not answer or refused }

  /api/transfers:
    get:
      tags: [Transfers]
      summary: List data plane transfers
      parameters:
        - $ref: "#/components/parameters/ParticipantIdRequired"
      responses:
        "200":
          description: Transfer list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TransferProcess" }
        "400": { description: participantId is missing }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Transfers]
      summary: Initiate data transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "201":
          description: Transfer started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferProcess" }
        "400": { description: Required fields missing }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/transfers/{id}:
    get:
      tags: [Transfers]
      summary: Fetch single transfer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ParticipantIdRequired"
      responses:
        "200":
          description: Transfer detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferProcess" }
        "400": { description: participantId is missing }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: The connector has no such transfer }
        "502": { description: The connector did not answer or refused }

  /api/transfers/{id}/data:
    get:
      tags: [Transfers]
      summary: The data a STARTED pull transfer gives access to
      description: >-
        Asks the consumer's siglet for the flow's access token and the
        provider's data plane for the data; the token stays on the server.
        Patient resources are pseudonymised for roles that do not see
        patient identity (#475, #876).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ParticipantIdRequired"
      responses:
        "200":
          description: The data, with its size and when it was fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferId: { type: string }
                  assetId: { type: string }
                  contractId: { type: string }
                  contentType: { type: string }
                  bytes: { type: integer }
                  truncated: { type: boolean }
                  fetchedAt: { type: string, format: date-time }
                  data: {}
        "400": { description: participantId and a transfer id are required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The transfer is not STARTED }
        "502":
          description: The token or the data could not be fetched; `step` says which

  /api/transfers/{id}/import:
    post:
      tags: [Transfers]
      summary: Import a STARTED transfer's data into an SPE workspace
      description: >-
        Pulls the data as GET /api/transfers/{id}/data does, pseudonymised
        for roles that do not see patient identity (#475), and has the
        neo4j-proxy write it into the chosen SPE's graph as one dataset,
        SPE-1 unless `speId` names another (EHDS Art. 73, #876). A second
        import of the same transfer merges onto the first. On Azure the
        workspaces start on demand (ADR-072): a stopped one is started and
        the import answers 503 with how long. Their store is in memory, so
        an import lasts until the workspace stops (`untilStopped`); loading
        it as a sealed extract through the Trustee is #915.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId]
              properties:
                participantId: { type: string }
                speId: { type: string, enum: [SPE-1, SPE-2], default: SPE-1 }
                overwrite:
                  type: boolean
                  default: false
                  description: Replace the import the SPE holds already
      responses:
        "200":
          description: What was imported, and the link to its 3D overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId: { type: string }
                  speId: { type: string }
                  records: { type: integer }
                  relationships: { type: integer }
                  byType:
                    type: object
                    additionalProperties: { type: integer }
                  importedAt: { type: string, format: date-time }
                  pseudonymised: { type: boolean }
                  untilStopped:
                    type: boolean
                    description: >-
                      The workspace keeps the import in memory until it
                      stops (Azure); not loaded through the Trustee yet
                  closed:
                    type: boolean
                    description: >-
                      The hub terminated the transfer after the import, with
                      the reason "Closed after import into SPE-n": the access
                      to the provider's data ends
                  graphUrl: { type: string }
        "400":
          description: "participantId, a transfer id or a known SPE is missing"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The transfer is not STARTED, or the SPE holds it already and
            `overwrite` is not set; then `existing` describes that import
        "413": { description: The data is too large to import at once }
        "422": { description: The data is not a FHIR Bundle }
        "502":
          description: The token, the data or the import failed; `step` says which
        "503":
          description: >-
            The SPE workspace is not connected, or (Azure) is stopped or
            starting; then `spe` gives its state and `etaSeconds`, and
            `started` says whether this call started it

  /api/spe-imports:
    get:
      tags: [Transfers]
      summary: Which transfers the SPE workspaces hold already
      description: >-
        The duplicate check behind My data (#876): for each transfer id, the
        SPE that holds it, since when and with how many records. An SPE that
        does not answer is listed in `unreachable`.
      parameters:
        - name: ids
          in: query
          required: true
          description: One or more transfer ids, comma separated
          schema: { type: string }
      responses:
        "200":
          description: The imports found
          content:
            application/json:
              schema:
                type: object
                properties:
                  imports:
                    type: array
                    items:
                      type: object
                      properties:
                        datasetId: { type: string }
                        speId: { type: string }
                        records: { type: integer }
                        importedAt: { type: string, format: date-time }
                  unreachable: { type: array, items: { type: string } }
        "400": { description: ids is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: The SPE workspaces did not answer }

  /api/spe-imports/{id}/graph:
    get:
      tags: [Transfers]
      summary: An imported transfer as the graph viewer draws it
      description: >-
        The dataset, the SPE workspace it was loaded into, its records and
        the references between them (#876). /graph?dataset={id}&spe=SPE-1
        merges it into the view and focuses on the dataset.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: spe
          in: query
          schema: { type: string, enum: [SPE-1, SPE-2], default: SPE-1 }
      responses:
        "200":
          description: Nodes and links for the graph viewer
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset: { type: object }
                  nodes: { type: array, items: { type: object } }
                  links: { type: array, items: { type: object } }
                  truncated: { type: boolean }
        "400": { description: A dataset id and a known SPE are required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: The SPE workspace is not connected }

  /api/agreements/{id}:
    get:
      tags: [Transfers]
      summary: One contract agreement, with its signing date, period and policy
      description: >-
        The agreement as the consumer's connector holds it; `validUntil` is
        the end of the period its policy allows, counted from the signing
        (#876).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ParticipantIdRequired"
      responses:
        "200":
          description: The agreement
          content:
            application/json:
              schema:
                type: object
                properties:
                  agreementId: { type: string }
                  assetId: { type: string }
                  providerId: { type: string }
                  consumerId: { type: string }
                  signedAt: { type: string }
                  validUntil: { type: string }
                  policy: { type: object }
        "400": { description: participantId and an agreement id are required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/assets:
    get:
      tags: [Assets]
      summary: List EDC-V assets
      parameters:
        - $ref: "#/components/parameters/ParticipantId"
      responses:
        "200": { description: Asset list }
