name: MeinBefund
options:
  bundleIdPrefix: red.mabu
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Matches the App Store Connect record, which was created as "Version 1.0".
    # A build whose CFBundleShortVersionString differs lands in its own
    # TestFlight train and cannot be attached to that version later, so the
    # two are kept identical rather than nearly so.
    MARKETING_VERSION: "1.0"
    # Rises with every upload: App Store Connect refuses a build number it has
    # already seen, and it refuses it after the upload, having spent minutes.
    CURRENT_PROJECT_VERSION: "5"

targets:
  # Mirrors the SwiftPM `Shared` target so the app and the parity tool compile
  # exactly the same sources, including the generated analyte table.
  Shared:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: red.mabu.meinbefund.shared
        PRODUCT_NAME: Shared
        GENERATE_INFOPLIST_FILE: YES

  MeinBefund:
    type: application
    platform: iOS
    dependencies:
      - target: Shared
    sources:
      # One entry only. xcodegen finds en.lproj and de.lproj underneath and
      # builds a variant group per file, which is what both the resource copy
      # and `xcodebuild -exportLocalizations` expect. Naming the .lproj folders
      # again as separate resource paths makes Xcode see each of them twice:
      # the build then fails with "remove failed de.lproj" and the export with
      # "en.lproj couldn't be copied ... an item with the same name exists".
      - path: Sources/MeinBefund
    settings:
      base:
        # The bundle id is registered with Apple and carries the App Store
        # record, the TestFlight builds and the keychain items, so it stays as
        # it is. The name people see is CFBundleDisplayName below; nobody sees
        # either of these two.
        PRODUCT_BUNDLE_IDENTIFIER: red.mabu.meinbefund
        PRODUCT_NAME: MeinBefund
        # Synthesise Info.plist from the INFOPLIST_KEY_* settings below.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Klarbefund
        # The device language decides. English base, German translation.
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # VisionKit needs a reason string or the scanner crashes on first use.
        # English, like every other base string. The German is in
        # `Sources/MeinBefund/de.lproj/InfoPlist.strings`: a permission prompt
        # in the wrong language is the first thing a person sees.
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          Klarbefund uses the camera only to scan your lab reports and the
          QR code that connects it to your health record. The photographs
          stay encrypted on this device.
        # Read only, asked for on the Trends screen when the person taps
        # "Show trends from Apple Health" and never at launch (#186
        # criterion 3). German in de.lproj/InfoPlist.strings.
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          Klarbefund reads resting heart rate, heart rate variability, steps
          and weight to show them beside your lab values. It keeps no copy and
          writes nothing to Health.
        # The app asks for no write access (toShare: []), so iOS never shows
        # this. App Store Connect refuses an upload with the HealthKit
        # entitlement and no update string all the same (ITMS-90683, build
        # 1.0 (3), 2026-10-05), so it says what is true: nothing is written.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: >-
          Klarbefund never writes to Health. It only reads the values listed
          in the read request, to show them beside your lab values.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Cloud analysis (ADR-034). Empty by default and checked at runtime, so
        # an unconfigured build simply does not offer the button rather than
        # offering it and failing. Set per build, never committed with values.
        #
        # The values live in `info.properties` below, not as INFOPLIST_KEY_*.
        # That prefix only synthesises Apple's own documented keys; a custom one
        # is accepted without complaint and then silently absent from the built
        # Info.plist, so the app reads nil and hides the feature while the build
        # log says nothing at all.
        MB_OIDC_ISSUER: ""
        MB_OIDC_CLIENT_ID: ""
        MB_OIDC_REDIRECT_SCHEME: ""
        MB_FEDERATION_BASE_URL: ""
        # The store must be unreadable while the device is locked.
        CODE_SIGN_ENTITLEMENTS: Sources/MeinBefund/MeinBefund.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      # App Attest (ADR-054): a development build's keys are attested in
      # Apple's development environment, a TestFlight or App Store build's in
      # production. The hub accepts both and records which.
      configs:
        Debug:
          MB_APP_ATTEST_ENV: development
        Release:
          MB_APP_ATTEST_ENV: production
    info:
      # Generated, so Info.plist must never be hand-edited: `xcodegen generate`
      # silently overwrites it, and the edit reappears as a mystery regression.
      path: Sources/MeinBefund/Info.plist
      properties:
        # Export compliance, declared with the build rather than answered per
        # upload. The app encrypts only with Apple's own platform
        # cryptography: CryptoKit AES-GCM sealing each stored record, the
        # Keychain holding the key as ThisDeviceOnly, and
        # NSFileProtectionComplete on the file. No cryptography of its own, no
        # protocol of its own, and no key ever leaves the device. Without this
        # a build processes to VALID and then sits at "Missing Compliance",
        # where no tester can install it until someone answers by hand.
        ITSAppUsesNonExemptEncryption: false
        MBOIDCIssuer: $(MB_OIDC_ISSUER)
        MBOIDCClientID: $(MB_OIDC_CLIENT_ID)
        MBOIDCRedirectScheme: $(MB_OIDC_REDIRECT_SCHEME)
        MBFederationBaseURL: $(MB_FEDERATION_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: red.mabu.meinbefund.oidc
            CFBundleURLSchemes: [$(MB_OIDC_REDIRECT_SCHEME)]
          # Connect to EHDS (#473): the patient screen's QR code and its
          # "Open in Klarbefund" link. A custom scheme, because a universal
          # link needs the Associated Domains capability on the App ID.
          - CFBundleURLName: red.mabu.meinbefund.connect
            CFBundleURLSchemes: [klarbefund]
        # The compose stack is plain http on localhost; the live hub is https.
        # Local networking only, nothing on the internet is exempted.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # Drives the app in a simulator the way a person does.
  #
  # The unit suite checks what the app computes; this checks what it shows and
  # what a tap does, which is where this project's last several defects lived:
  # a card clipped at the chart's edge, a selection that forgot itself on the
  # next render, `LOINC Optional("2093-3")` on the report screen. None of them
  # was reachable from a unit test and every one was obvious on screen.
  #
  # Every test launches with `-MBDemoSeed`, so no real report is ever involved
  # and the data is the same on any machine.
  MeinBefundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: MeinBefund
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: red.mabu.meinbefund.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MeinBefund

schemes:
  MeinBefund:
    build:
      targets:
        MeinBefund: all
        MeinBefundUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MeinBefundUITests
