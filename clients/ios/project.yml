name: MeinBefund
options:
  bundleIdPrefix: red.mabu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # Mirrors the SwiftPM `Shared` target so the app and the parity tool compile
  # exactly the same sources, including the generated analyte table.
  Shared:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: red.mabu.meinbefund.shared
        PRODUCT_NAME: Shared
        GENERATE_INFOPLIST_FILE: YES

  MeinBefund:
    type: application
    platform: iOS
    dependencies:
      - target: Shared
    sources:
      - path: Sources/MeinBefund
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: red.mabu.meinbefund
        PRODUCT_NAME: MeinBefund
        # Synthesise Info.plist from the INFOPLIST_KEY_* settings below.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MeinBefund
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # VisionKit needs a reason string or the scanner crashes on first use.
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          MeinBefund nutzt die Kamera nur, um Ihre Befunde zu scannen.
          Die Aufnahmen bleiben verschlüsselt auf diesem Gerät.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Cloud analysis (ADR-034). Empty by default and checked at runtime, so
        # an unconfigured build simply does not offer the button rather than
        # offering it and failing. Set per build, never committed with values.
        INFOPLIST_KEY_MBOIDCIssuer: $(MB_OIDC_ISSUER)
        INFOPLIST_KEY_MBOIDCClientID: $(MB_OIDC_CLIENT_ID)
        INFOPLIST_KEY_MBOIDCRedirectScheme: $(MB_OIDC_REDIRECT_SCHEME)
        INFOPLIST_KEY_MBFederationBaseURL: $(MB_FEDERATION_BASE_URL)
        MB_OIDC_ISSUER: ""
        MB_OIDC_CLIENT_ID: ""
        MB_OIDC_REDIRECT_SCHEME: ""
        MB_FEDERATION_BASE_URL: ""
        # The store must be unreadable while the device is locked.
        CODE_SIGN_ENTITLEMENTS: Sources/MeinBefund/MeinBefund.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/MeinBefund/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: red.mabu.meinbefund.oidc
            CFBundleURLSchemes: [$(MB_OIDC_REDIRECT_SCHEME)]
